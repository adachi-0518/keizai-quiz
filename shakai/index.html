{t:"国民皆年金の成立",c:["1959年に国民年金保険が成立し、1961年に施行された","自営業者や零細企業労働者を対象とした"],w:["1954年に成立した","被用者のみを対象とした制度である","1985年に成立した"],e:"1961年施行＝国民皆年金（国民皆保険と同年）。"},

{k:"7",title:"第7回 経済学からみた年金制度",qs:[

{t:"支給開始年齢が決められている意義",c:["政府と個人の間に情報の非対称性が存在するためである","一定の年齢に達すれば一律に支給するという次善の策である"],w:["財政負担を最大化するためである","個人ごとに稼得能力を正確に把握できるためである","逆選択を促進するためである"],e:"本当に稼得能力が低下したか個別に判定できない→年齢で一律に線を引く。"},
{t:"賦課方式",c:["今年度の保険料で今年度の給付を賄う方式である","その時代の若者の保険料でその時代の高齢者を賄う、世代間の助け合いである"],w:["自分が若いころ積み立てた保険料で自分の老後を賄う方式である","収益率は市場利子率である","納付・負担の世代間格差は発生しない"],e:"賦課方式＝pay-as-you-go。医療保険と同じ考え方。"},
{t:"積立方式",c:["現役時に積み立てた保険料を運用益とともに高齢時の年金に充てる方式である","収益率は市場利子率であり、貯蓄・資本蓄積に対して中立的である"],w:["収益率は賃金所得増加率である","高齢化により若年世代に不利になる","各時点で年金収支が均衡するように決められる"],e:"積立＝funded system。世代間格差は発生せず、同一世代内で収支が均衡。"},

]}};
const LEC=[];
LEC.push({k:"1",title:EXTRA["1"].title,qs:EXTRA["1"].qs});
DATA.forEach(d=>LEC.push(d));
LEC.push({k:"14",title:EXTRA["14"].title,qs:EXTRA["14"].qs});

const S={};
let cur=0, wrongOnly=false;

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function keyOf(li,qi){return li+"_"+qi;}
function buildOrder(li,qi){
  const q=LEC[li].qs[qi];
  const items=shuf(q.c.map(t=>({t,ok:1})).concat(q.w.map(t=>({t,ok:0}))));
  return items;
}
const ORD={};
function order(li,qi){
  const k=keyOf(li,qi);
  if(!ORD[k])ORD[k]=buildOrder(li,qi);
  return ORD[k];
}

function tabs(){
  const el=document.getElementById('tabs');
  el.innerHTML='';
  LEC.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'');
    const total=l.qs.length;
    let done=0;
    for(let q=0;q<total;q++)if(S[keyOf(i,q)])done++;
    if(done===total)b.className+=' done';
    b.textContent='第'+l.k+'回';
    b.onclick=()=>{cur=i;wrongOnly=false;document.getElementById('ba').style.display='none';document.getElementById('bw').style.display='';render();};
    el.appendChild(b);
  });
}

function render(){
  tabs();
  const l=LEC[cur],m=document.getElementById('main');
  let h='<h2>'+l.title+'</h2>';
  l.qs.forEach((q,qi)=>{
    const k=keyOf(cur,qi),st=S[k];
    if(wrongOnly&&(!st||st.ok))return;
    const items=order(cur,qi);
    h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">Q'+(qi+1)+'</span><span class="qt">'+q.t+'</span></div><p class="hint">正しいものを2つ選ぶ</p><div class="opts">';
    items.forEach((it,i)=>{
      let cls='o';
      if(st){
        const picked=st.sel.indexOf(i)>=0;
        if(it.ok)cls+=' c';else if(picked)cls+=' x';
      }
      const mark=st?(it.ok?'✓':(st.sel.indexOf(i)>=0?'✕':(i+1))):(i+1);
      h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'"><i>'+mark+'</i><span>'+it.t+'</span></div>';
    });
    h+='</div>';
    if(st){h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'正解':'不正解')+'</b>　'+q.e+'</div>';}
    else{h+='<div class="act"><button data-check="'+qi+'">答え合わせ</button><span class="cnt" data-cnt="'+qi+'">0 / 2 選択</span></div>';}
    h+='</div>';
  });
  if(wrongOnly&&h.indexOf('class="q')<0)h+='<div class="done-msg">この回に間違えた問題はありません。</div>';
  m.innerHTML=h;
  bind();stats();
}

const PICK={};
function bind(){
  document.querySelectorAll('.o').forEach(el=>{
    const qi=+el.dataset.q,i=+el.dataset.i,k=keyOf(cur,qi);
    if(S[k])return;
    el.onclick=()=>{
      PICK[k]=PICK[k]||[];
      const p=PICK[k],x=p.indexOf(i);
      if(x>=0)p.splice(x,1);else{if(p.length>=2)return;p.push(i);}
      el.classList.toggle('sel',p.indexOf(i)>=0);
      const c=document.querySelector('[data-cnt="'+qi+'"]');
      if(c)c.textContent=p.length+' / 2 選択';
    };
  });
  document.querySelectorAll('[data-check]').forEach(b=>{
    const qi=+b.dataset.check,k=keyOf(cur,qi);
    b.onclick=()=>{
      const p=PICK[k]||[];
      if(p.length!==2){const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='2つ選んでください';return;}
      const items=order(cur,qi);
      const ok=p.every(i=>items[i].ok);
      S[k]={sel:p.slice(),ok:ok};
      save();render();
    };
  });
}

function stats(){
  const l=LEC[cur];let d=0,o=0;
  l.qs.forEach((q,qi)=>{const st=S[keyOf(cur,qi)];if(st){d++;if(st.ok)o++;}});
  document.getElementById('s1').textContent=d+' / '+l.qs.length;
  document.getElementById('s2').textContent=o;
  document.getElementById('s3').textContent=d-o;
  document.getElementById('s4').textContent=d?Math.round(o/d*100)+'%':'—';
}

function save(){try{localStorage.setItem('shq',JSON.stringify(S));}catch(e){}}
function load(){try{const v=localStorage.getItem('shq');if(v)Object.assign(S,JSON.parse(v));}catch(e){}}

document.getElementById('bw').onclick=function(){wrongOnly=true;this.style.display='none';document.getElementById('ba').style.display='';render();};
document.getElementById('ba').onclick=function(){wrongOnly=false;this.style.display='none';document.getElementById('bw').style.display='';render();};
document.getElementById('br').onclick=function(){
  LEC[cur].qs.forEach((q,qi)=>{const k=keyOf(cur,qi);delete S[k];delete PICK[k];delete ORD[k];});
  wrongOnly=false;document.getElementById('ba').style.display='none';document.getElementById('bw').style.display='';
  save();render();
};
load();render();

</script></body></html>
