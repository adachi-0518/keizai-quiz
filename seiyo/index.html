<script>
const LEC=[{"k": "I", "title": "ユニットI 東西交易とオランダの繁栄", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>近世の東西交易はなぜ始まり、なぜオランダが繁栄の中心になったのか。\n<h3 style=\"margin-top:10px\">因果の筋（200字）</h3>近世欧州は毛織物・鉄砲・機械時計という自らの<b>物産複合</b>を軸に、香辛料・絹・陶磁器などアジアの物産を求めて世界へ進出した（<b>大航海時代</b>）。この<b>Push</b>（欧州側の動機）と<b>Pull</b>（アジアの物産）が東西通商を本格化させ、他地域を物産複合圏として取り込んでいく。中南米の銀流入は<b>価格革命</b>を引き起こした。オランダはバルト海穀物貿易（母なる貿易）と造船業の優位を基盤に、1602年に世界初の株式会社である東インド会社を設立し、アムステルダムを拠点に17世紀の覇権を築いた。</div>", "terms": [{"t": "大航海時代（地理上の発見の時代）", "a": "15世紀末以降、ヨーロッパ人が大挙して世界各地へ進出した時代。東西通商の本格的開始をもたらした。ポルトガルの東回り航海（1488年ディアスの喜望峰到達、1498年ヴァスコ・ダ・ガマのインド航路発見）とスペインの新大陸貿易（1492年コロンブス）が二つの柱。", "tag": ""}, {"t": "物産複合", "a": "各社会において人間の衣食住を構成するものの集合体。欧州は毛織物・鉄砲・機械時計、アジアは香辛料・茶・コーヒー・砂糖・木綿・絹製品・染料・陶磁器。欧州が他地域を自らの物産複合圏として取り込んでいく過程が近世の世界進出であった。", "tag": ""}, {"t": "Push要因とPull要因", "a": "大航海時代を説明する二つの力。Pushは欧州側の押し出し要因（アジア物産への需要、航海技術の発達など）、Pullはアジア側の引き寄せ要因（香辛料・絹・陶磁器といった魅力的な物産）。両者が結びついて東西通商が本格化した。", "tag": ""}, {"t": "商業革命", "a": "大航海時代の航路開拓により、ヨーロッパ商業の中心が地中海から大西洋沿岸へ移動し、取引される商品と規模が一変した変化。ポルトガルのインド航路発見がその契機となった。", "tag": ""}, {"t": "価格革命", "a": "16世紀半ば以降、中南米で銀鉱山が続々と発見され大量の銀がヨーロッパへ流入した結果、物価が持続的に高騰した現象。貨幣量の増加が実体経済に大きな影響を与えた事例。", "tag": ""}, {"t": "トルデシリャス条約（1494年）", "a": "スペインとポルトガルが新たに発見される非キリスト教圏の地を分割することを取り決めた条約。両国による世界分割の枠組みを定めた。", "tag": ""}, {"t": "オランダ東インド会社（VOC, 1602年）", "a": "乱立していた東インド貿易会社を統合して設立された、世界初の株式会社。連邦議会から東インド貿易独占の特権を得て競争を回避し、永続的組織となった。1617年バタビア（ジャカルタ）を占拠して拠点とし、17世紀末には世界最大の収益会社となった。", "tag": ""}, {"t": "「母なる貿易」", "a": "オランダがバルト海から南欧へ穀物を運んだ中継貿易のこと。地中海沿岸国の穀物需要急増を背景に、オランダはこの輸出の4分の3を掌握し、繁栄の基盤とした。", "tag": ""}, {"t": "フリュート船", "a": "オランダが建造した高性能の商船。造船所を内陸・農村に立地させてコストを削減し、少ない乗員で大量の貨物を運べたため、オランダの通商活動に決定的な優位をもたらした。", "tag": ""}, {"t": "アントウェルペンからアムステルダムへ", "a": "16世紀初頭から1585年まで商業都市アントウェルペンが最盛期にあったが、1585年にスペイン軍の焼き討ちとスヘルデ川封鎖を受け、その機能をアムステルダムが肩代わりした。1579年の宗教的寛容政策が商人の移住を促した。", "tag": ""}, {"t": "オランダ衰退の要因", "a": "中継商業による繁栄の一方で、生産力的基盤の弱い経済構造を改変できなかったこと。加えて17世紀後半にバルト海・地中海貿易の重要性が相対的に縮小し、英仏が国内の混乱から脱して対外通商に本格進出したため攻勢が激化した。ただし18世紀に入ってもアムステルダムは欧州金融の中心機能を維持した。", "tag": ""}], "qs": [{"q": "東西通商の本格的開始をもたらしたものは何か。", "a": "近世欧人の世界進出（大航海時代）", "d": ["ローマ帝国の拡大", "十字軍の遠征", "産業革命"], "e": "「地理上の発見の時代」とも呼ばれる。Push要因とPull要因の両面から確認する。"}, {"q": "各社会において人間の衣食住を構成するものの集合体を何というか。", "a": "物産複合", "d": ["重商主義", "産業構造", "生活様式"], "e": "欧＝毛織物・鉄砲・機械時計／亜＝香辛料・茶・コーヒー・砂糖・木綿・絹製品・染料・陶磁器。"}, {"q": "1498年にインド航路（カリカット到着）を発見したのは誰か。", "a": "ヴァスコ・ダ・ガマ", "d": ["バルトロメウ・ディアス", "コロンブス", "アメリゴ・ヴェスプッチ"], "e": "1488年ディアスが喜望峰に到達し、1498年ダ・ガマがインド航路を開いた。この二段構えで押さえる。"}, {"q": "16世紀半ば以降、中南米からの大量の銀流入が欧州に引き起こした現象は何か。", "a": "価格革命", "d": ["商業革命", "産業革命", "農業革命"], "e": "航路開拓による商業の中心移動が「商業革命」、銀流入による物価高騰が「価格革命」。混同しやすいので対で覚える。"}, {"q": "1602年に設立されたオランダ東インド会社の画期性はどこにあるか。", "a": "世界初の「株式会社」であり永続的組織となった点", "d": ["国家が直接経営した点", "無償で貿易を行った点", "短期の一回限りの組織だった点"], "e": "連邦議会から東インド貿易独占の特権を得て競争を回避した点も重要。"}, {"q": "オランダの通商活動に決定的な優位をもたらした産業は何か。", "a": "造船業（高性能のフリュート船）", "d": ["毛織物工業", "製鉄業", "金融業"], "e": "造船所を内陸・農村に立地させてコストを削減した点まで言えると強い。"}, {"q": "オランダがバルト海から南欧への穀物輸出の4分の3を掌握した貿易は何と呼ばれるか。", "a": "「母なる貿易」", "d": ["三角貿易", "中継貿易", "東インド貿易"], "e": "バルト海・地中海貿易の独占がオランダ繁栄の基盤。これが17世紀後半に相対的に縮小したことが衰退の一因となる。"}, {"q": "オランダ衰退の根本的な要因としてレジュメが挙げているものはどれか。", "a": "中継商業に依存し、生産力的基盤の弱い経済構造を改変できなかったこと", "d": ["軍事力が全くなかったこと", "人口が激減したこと", "金融業から撤退したこと"], "e": "18世紀に入ってもアムステルダムは欧州金融の中心機能を維持した点にも注意。"}]}, {"k": "II", "title": "ユニットII イギリス産業革命への道", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>イギリスはなぜ最初に工業化しえたのか（国際的前提と国内的前提）。\n<h3 style=\"margin-top:10px\">因果の筋（200字）</h3>本格的工業化に先立ち、各国は国富増大をめざす<b>重商主義</b>政策を採った。イギリスは17世紀にオランダ、18世紀にフランスと覇権を争い、東南アジアの拠点を失う一方でインド支配に集中する。ところがインド産の安価で上質な綿製品（<b>キャリコ</b>）が大量流入し、国民的産業だった毛織物工業を含む繊維産業全体が打撃を受けた。1701年キャリコ輸入禁止令・1721年使用禁止令で保護を図る一方、「いかにしてインド綿に匹敵する製品を国内で作るか」という課題が生まれる。この<b>イースタン・インパクト</b>が産業革命の国際的誘因となった。国内的には土地・労働力・資本という生産の三要素の市場が18世紀までに成立していた。</div>", "terms": [{"t": "重商主義（mercantilism）", "a": "本格的工業化に先立つ時期に採用された、国の富を増大させるための政策。イギリスの場合は国内産業の保護育成が政策基調であった。17世紀には英蘭、18世紀には英仏がライバルとして熾烈に争った。", "tag": ""}, {"t": "キャリコ（キャラコ）", "a": "インド綿の主力製品である薄手の綿布。語源は積出港カリカット。羊毛製品より使いやすさ・快適性・価格で優位にあり、大量流入によりイギリスの繊維産業全体が苦境に陥った。", "tag": ""}, {"t": "キャリコ輸入禁止令（1701年）・使用禁止令（1721年）", "a": "インド産綿製品の流入から国内繊維産業を保護するための法令。1701年は無地のキャリコを除外、1721年は再輸出用を認めるという例外つきであった。国内での代替生産をめざす動機を生んだ。", "tag": ""}, {"t": "イースタン・インパクト", "a": "インド綿の大量流入という東方からの衝撃が、「いかにしてインド綿に匹敵する製品を国内で生産可能にするか」という18世紀イギリスの課題を生み、結果的に産業革命の国際的誘因となったこと。", "tag": ""}, {"t": "生産の三要素", "a": "工業化の不可欠の前提としての土地・労働力・資本。土地は自然的条件と土地制度（イギリスでは18世紀にほぼ全土がfreeholding）、労働力は量（人口増）と質（識字率・移動と職業選択の自由）、資本は個別資本と社会資本からなる。", "tag": ""}, {"t": "freeholding（自由土地保有）", "a": "土地の私的・排他的所有権にもとづく保有形態。イギリスでは土地の私的所有権の確立が早く、18世紀にはほぼ全土がこの状態となり、土地市場の商品化が進んでいた。", "tag": ""}, {"t": "禁欲的プロテスタンティズム", "a": "節約・勤勉・禁欲をとくに重視するプロテスタンティズムの諸派（メソジスト、バプテスト、クエーカーなど）。労働力の質的側面、すなわち工場労働者・企業経営者としての資質の醸成に寄与したと指摘される。", "tag": ""}, {"t": "社会資本（社会的インフラストラクチュア）", "a": "運河、道路（英米のターンパイク）、港湾設備、鉄道など工業化に必要な基盤。イギリスでは貴族を含む広範な層が積極的に投資し、上流階層にとっては有利な資産運用方法でもあった。イギリス階級制度の開放性・流動性の高さと関連する。", "tag": ""}, {"t": "メシュエン条約（1693年）", "a": "ポルトガルがブラジルの金鉱の権益をイギリスに保護してもらう見返りに、イギリス毛織物製品に本国・植民地市場を開放した条約。イギリスの外国市場拡大策の一環。", "tag": ""}], "qs": [{"q": "本格的工業化に先立つ時期に、国の富を増大させるために採用された政策を何というか。", "a": "重商主義（mercantilism）", "d": ["自由放任主義", "保護貿易主義", "絶対主義"], "e": "イギリスの重商主義は国内産業の保護育成が政策基調であった点まで言えるとよい。"}, {"q": "イギリスが17世紀・18世紀に覇権を争った相手の組み合わせとして正しいものはどれか。", "a": "17世紀＝オランダ／18世紀＝フランス", "d": ["17世紀＝フランス／18世紀＝オランダ", "両世紀ともスペイン", "両世紀ともドイツ"], "e": "東南アジアの拠点を奪われた結果、インド支配に集中したという流れが重要。"}, {"q": "インド綿の主力製品である薄手の綿布を何というか。", "a": "キャリコ（キャラコ）", "d": ["ファスチャン", "モスリン", "フランネル"], "e": "語源は積出港カリカット。1701年輸入禁止令、1721年使用禁止令の対象となった。"}, {"q": "インド綿の大量流入が結果的に産業革命の国際的誘因となったことを何と呼ぶか。", "a": "イースタン・インパクト", "d": ["ウエスタン・インパクト", "コロンブス交換", "商業革命"], "e": "「いかにしてインド綿に匹敵する製品を国内で生産するか」が18世紀イギリスの課題となった。"}, {"q": "工業化の不可欠の前提とされる「生産の三要素」とは何か。", "a": "土地・労働力・資本", "d": ["土地・技術・市場", "労働力・資本・技術", "資本・市場・国家"], "e": "それぞれに量的側面と質的側面、自然的条件と歴史的形成物という二面がある。"}, {"q": "イギリスで18世紀までにほぼ全土に及んだ土地保有形態は何か。", "a": "freeholding（自由土地保有）", "d": ["借地農制", "荘園制", "共同地"], "e": "土地の私的・排他的所有権の確立にもとづく土地市場の商品化が早かった。"}, {"q": "労働力の質的側面として、イギリスで指摘される宗教的要因はどれか。", "a": "禁欲的プロテスタンティズム（メソジスト、バプテスト、クエーカー等）", "d": ["カトリック改革", "国教会の成立", "ピューリタン革命"], "e": "節約・勤勉・禁欲を重視する諸派が、工場労働者・企業経営者としての資質の醸成に寄与したとされる。"}, {"q": "イギリスにおいて社会資本への投資が活発だった背景として、レジュメが指摘するものはどれか。", "a": "貴族を含む上流階層がビジネス活動に積極的に関わり、階級間の流動性が高かったこと", "d": ["国家がすべての投資を独占していたこと", "外国資本に全面的に依存していたこと", "農民層が資本を提供したこと"], "e": "上流階層にとって社会資本投資は有利な資産運用方法でもあった。"}]}, {"k": "III", "title": "ユニットIII イギリス産業革命とパクス・ブリタニカ", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>産業革命の「発明」の意義は何か。そして技術革新はどのような特徴を持っていたか。\n<h3 style=\"margin-top:10px\">最重要：レジュメの定式（丸ごと覚える）</h3>「産業革命の発明の意義は、単発の発明としてどれだけ画期的だったのかではなく、<b>発明全体として三つの要素を結合させたこと</b>にある」<ul><li><b>原理</b>：手作業の機械化 → 人間労働の代替・軽減</li><li><b>動力</b>：自然的・生物的動力 → エネルギー転換動力（生産行為を時間と場所の制約から解放）</li><li><b>素材</b>：植物性・動物性原料 → 鉱物性原料（鉄、鋼鉄）</li></ul>\n<h3 style=\"margin-top:10px\">技術革新の三つの特徴（過去問【2】の骨格）</h3><ul><li><b>①工程間の不均衡（imbalance）</b>：紡績工程が先に機械化されて生産性が急上昇し、織布工程が追いつかない。ある工程の機械化が次の工程のボトルネックを生み、それがまた次の発明を誘発する連鎖。</li><li><b>②手工業的技術の残存</b>：機械化されても操作に手工業的熟練が必要な段階が長く残った（ジェニー紡績機は操作に熟練を要し機械動力運転に向かない、など）。</li><li><b>③長期性</b>：1733年の飛杼から1830年代の全工程機械化・工場生産化まで<b>およそ100年</b>を要した。</li></ul></div>", "terms": [{"t": "Innovation と Invention の違い", "a": "Invention は原案となる着想や装置そのもの（an original idea or device）。Innovation はその発明が最初に実際に使用されること（the first use of invention）。産業革命で問題になるのは、発明そのものより実用化のほうである。", "tag": ""}, {"t": "特許制度", "a": "発明を保護する制度で、「知的財産権」の確立と不可分。イギリスは17世紀初頭に特許制度を導入した。ただしミュール紡績機のクロンプトンのように、特許を申請せず技術を秘匿した例もある。", "tag": ""}, {"t": "産業革命の発明の意義（三要素の結合）", "a": "単発の発明の画期性ではなく、発明全体として三つの要素を結合させた点にある。①原理＝手作業の機械化、②動力＝自然的・生物的動力からエネルギー転換動力へ、③素材＝植物性・動物性原料から鉱物性原料（鉄・鋼鉄）へ。", "tag": ""}, {"t": "綿加工の主要な生産工程", "a": "準備工程（綿繰・洗綿・梳綿）→ 紡績工程（粗紡・精紡）→ 織布工程 → 仕上工程（染色・仕立）。産業革命の技術革新は紡績工程から始まり、織布工程がそれに遅れて追随した。", "tag": ""}, {"t": "多軸化", "a": "紡績工程における引き延ばしと撚りかけの機械化。一度に扱える紡錘の数を増やすことで生産性を飛躍させた。これを可能にしたのが水力紡績機・ジェニー紡績機・ミュール紡績機の三つの発明である。", "tag": ""}, {"t": "飛杼（flying shuttle, 1733年）", "a": "ジョン・ケイ（ランカシャーの手織工）が発明した織布工程の装置。片手のみで操作可能、杼の受け損ねがない、広幅織物の単独作業が可能という利点があった。織布工程の生産性を高めたが、これに続く機械化はなかなか進まなかった。", "tag": ""}, {"t": "ジェニー紡績機（1764年発明／1770年, ハーグリーヴズ）", "a": "ジェームズ・ハーグリーヴズ（ランカシャーの紡績兼大工）の発明。操作に手工業的熟練を要し、機械動力での運転には向かなかった。40番手の糸に対応しキャリコ向け。手工業的技術の残存を示す代表例。", "tag": ""}, {"t": "水力紡績機（waterframe, 1769年, アークライト）", "a": "リチャード・アークライト（ランカシャーの床屋兼鬘業者）の発明。ローラードラフトとフライヤーの機構を持つ。ノッティンガム工場（馬力）、ダービーシャーのクロムフォード工場（ダーヴェント川の水力）で稼働した。20番手の太い糸に対応。", "tag": ""}, {"t": "ミュール紡績機（1780年, クロンプトン）", "a": "サミュエル・クロンプトン（ランカシャーのモスリン工）の発明。ジェニー紡績機と水力紡績機の長所を兼ね備えた（それゆえミュール＝ラバの名）。80番手の細糸を紡げモスリン向け。イギリスで最も多く普及した紡績機だが、クロンプトンは特許を申請せず技術を秘匿した。", "tag": ""}, {"t": "自動ミュール（self-actor, 1825年, リチャード・ロバーツ）", "a": "蒸気機関と連結された自動化されたミュール紡績機。1790年の水力ミュールを経て実現した。1820年代以降、各企業は大型ミュールとともにこれを導入し、労働力構成の変化を加速させた。", "tag": ""}, {"t": "力織機（power loom, 1786年, カートライト）", "a": "エドワード・カートライト（ノッティンガムシャーの牧師）が発明し、単一の努力のみで織布工程の全作業を機械化することに初めて成功した。ただし失業を恐れた手織工の焼き討ちにより建設中の工場が焼失した。1820年代にリチャード・ロバーツが改良力織機を実現した。", "tag": ""}, {"t": "工程間の不均衡（imbalance）", "a": "紡績工程が先に機械化されて生産性が急上昇したのに対し、織布工程の機械化が遅れ、工程間に生産力の不均衡が生じたこと。これがさらなる発明を誘発する連鎖を生んだ。産業革命の技術革新の第一の特徴。", "tag": ""}, {"t": "手工業的技術の残存", "a": "機械化が進んだあとも操作に手工業的熟練が必要な段階が長く残ったこと。ジェニー紡績機が操作に熟練を要し機械動力運転に向かなかったことが典型例。産業革命の技術革新の第二の特徴。", "tag": ""}, {"t": "技術革新の長期性", "a": "1733年の飛杼から1830年代の全工程機械化・工場生産化の実現まで、およそ100年を要したこと。織布工程の機械化が遅れた理由は、機械自体の技術的信頼性、労働力コストの上昇、成人男子の失業への社会的抵抗であった。産業革命の技術革新の第三の特徴。", "tag": ""}, {"t": "工場法（factory act, 1833年）", "a": "18歳以下の年少労働者の深夜労働禁止、労働時間を一日12時間・週69時間以内に制限、9歳未満の児童の就労禁止、工場監督官制度を定めた法律。1844年法で労働時間制限が女性労働力にも適用され、1847年法で一日12時間規制が11時間に強化された。", "tag": ""}, {"t": "産業革命期の労働力構成の変化", "a": "機械を操作する成人男子労働力が相対的に減少し、低賃金の児童・女性労働者が相対的かつ絶対的に増大した。巨額の初期投資を早期回収するため労働時間も延長され、女性や児童の深夜労働が日常化した。これが工場法制定の背景となる。", "tag": ""}, {"t": "ジェネラル・ショップとチェーン・ストア", "a": "産業革命期の小売市場整備を担った業態。ジェネラル・ショップは固定店舗のよろず屋的小売店で、日用雑貨・非生鮮食料品中心、販売単位が小さく掛け売りにも対応した。チェーン・ストアは少数の売れ筋商品（バター、ベーコン、ハム、卵、茶等）に限定し、大量仕入れ・大きな販売単位を特徴とした。", "tag": ""}, {"t": "穀物法（Corn Laws）とその廃止", "a": "17世紀に遡り、一貫して国内の穀物生産者（地主・借地農）の保護を目的とした法。18世紀後半にイギリスが穀物輸入国に転換すると関税による輸入制限が中心となった。マンチェスターの綿工業関係者が生計費高騰と国内需要減退を理由に全廃を主張し、1845年の凶作とアイルランド馬鈴薯飢饉を経て1846年に廃止された。決断したのは綿工業経営者出身のピール首相。", "tag": ""}, {"t": "「世界の工場」", "a": "ナポレオン戦争終結期から1870年代にかけてのイギリスの地位。19世紀半ばの世界市場に占める実績は綿布2分の1、鉄2分の1、鋼鉄7分の5、石炭3分の1。輸出は工業製品が圧倒的で綿製品が半分を占め、輸入は温暖地域の産物・農産物・工業原料であった。", "tag": ""}, {"t": "パクス・ブリタニカ（Pax Britanica）", "a": "イギリス経済を基軸として世界経済の構造が編成された19世紀の状態。「世界の工場」としての圧倒的な工業生産力に、自由貿易政策と金本位制が結びついて成立した。", "tag": ""}], "qs": [{"q": "Innovation の定義として正しいものはどれか。", "a": "the first use of invention（発明の最初の使用）", "d": ["an original idea or device", "特許を取得すること", "技術を秘匿すること"], "e": "Invention＝原案・装置そのもの、Innovation＝それが最初に実際に使われること。この対を英語で言えるようにしておく。"}, {"q": "イギリスが特許制度を導入したのはいつか。", "a": "17世紀初頭", "d": ["15世紀末", "18世紀後半", "19世紀半ば"], "e": "特許制度は「知的財産権」の確立と不可分。ただしクロンプトンのように特許を申請せず秘匿した例もある。"}, {"q": "レジュメが述べる「産業革命の発明の意義」として正しいものはどれか。", "a": "発明全体として原理・動力・素材の三つの要素を結合させたこと", "d": ["単発の発明がきわめて画期的だったこと", "国家が発明を主導したこと", "特許制度がなかったこと"], "e": "原理＝手作業の機械化、動力＝エネルギー転換動力、素材＝鉱物性原料（鉄・鋼鉄）。この三つを必ずセットで書く。"}, {"q": "綿加工の主要な生産工程の順序として正しいものはどれか。", "a": "準備工程 → 紡績工程 → 織布工程 → 仕上工程", "d": ["紡績工程 → 準備工程 → 織布工程 → 仕上工程", "織布工程 → 紡績工程 → 準備工程 → 仕上工程", "準備工程 → 織布工程 → 紡績工程 → 仕上工程"], "e": "準備＝綿繰・洗綿・梳綿、紡績＝粗紡・精紡、仕上＝染色・仕立。技術革新は紡績工程から始まった。"}, {"q": "1733年に飛杼（flying shuttle）を発明したのは誰か。", "a": "ジョン・ケイ", "d": ["ジェームズ・ハーグリーヴズ", "リチャード・アークライト", "エドワード・カートライト"], "e": "ランカシャーの手織工。片手のみで操作可能、杼の受け損ねなし、広幅織物の単独作業が可能となった。"}, {"q": "1769年の水力紡績機（waterframe）を発明したのは誰か。", "a": "リチャード・アークライト", "d": ["サミュエル・クロンプトン", "ジョン・ケイ", "リチャード・ロバーツ"], "e": "ランカシャーの床屋兼鬘業者。ローラードラフトとフライヤーの機構を持ち、クロムフォード工場でダーヴェント川の水力を用いた。"}, {"q": "ジェニー紡績機の欠点としてレジュメが指摘するものはどれか。", "a": "操作に手工業的熟練を要し、機械動力運転には向かなかった", "d": ["糸が太くしか紡げなかった", "水力でしか動かせなかった", "特許が取得できなかった"], "e": "「手工業的技術の残存」という技術革新の第二の特徴を示す代表例。水力紡績機との長所を兼ね備えたものが求められた結果がミュール紡績機。"}, {"q": "1780年にミュール紡績機を発明したのは誰か。", "a": "サミュエル・クロンプトン", "d": ["リチャード・アークライト", "ジェームズ・ハーグリーヴズ", "ジョン・ノースロップ"], "e": "ランカシャーのモスリン工。80番手の細糸を紡げ、イギリスで最も普及した紡績機となったが、特許を申請せず技術を秘匿した。"}, {"q": "1786年に力織機を発明し、織布工程の全作業の機械化に初めて成功したのは誰か。", "a": "エドワード・カートライト", "d": ["リチャード・ロバーツ", "ジョン・ケイ", "サミュエル・クロンプトン"], "e": "ノッティンガムシャーの牧師。ただし失業を恐れた手織工の焼き討ちにより建設中の工場が焼失した。"}, {"q": "織布工程の機械化が紡績工程より遅れた理由としてレジュメが挙げるものはどれか。", "a": "機械自体の技術的信頼性と労働力コストの上昇", "d": ["原料の綿花が不足していたため", "特許制度がなかったため", "蒸気機関が存在しなかったため"], "e": "加えて成人男子の失業への社会的抵抗も指摘されている。この三点が「長期性」の内実。"}, {"q": "飛杼の発明から全工程の機械化・工場生産化の実現まで、どれくらいの期間を要したか。", "a": "およそ100年（1733年→1830年代）", "d": ["およそ20年", "およそ50年", "およそ200年"], "e": "技術革新の「長期性」を示す最重要の数字。過去問【2】ではこの具体的な年代を必ず入れる。"}, {"q": "イギリス産業革命の綿工業における技術革新の三つの特徴の組み合わせとして正しいものはどれか。", "a": "工程間の不均衡・手工業的技術の残存・長期性", "d": ["国家主導・急速性・全面性", "資本集約・労働節約・技術移転", "分業・標準化・大量生産"], "e": "過去問【2】がまさにこの三点を問うた。それぞれに具体的な機械の実例を対応させて書けるようにする。"}, {"q": "1833年の工場法の内容として正しいものはどれか。", "a": "18歳以下の年少労働者の深夜労働禁止と9歳未満の児童の就労禁止", "d": ["すべての児童労働の全面禁止", "women の雇用の全面禁止", "一日8時間労働制の導入"], "e": "労働時間は一日12時間・週69時間以内。1844年法で女性にも適用、1847年法で11時間に強化。"}, {"q": "1846年の穀物法廃止を決断した首相は誰か。", "a": "R. ピール", "d": ["W. グラッドストン", "B. ディズレーリ", "R. コブデン"], "e": "ピール自身が綿工業経営者出身であった点が印象的。1845年の凶作とアイルランド馬鈴薯飢饉が直接の契機。"}, {"q": "19世紀半ばのイギリスが世界市場で占めた綿布のシェアはどれくらいか。", "a": "約2分の1", "d": ["約3分の1", "約5分の7", "約10分の9"], "e": "綿布1/2、鉄1/2、鋼鉄5/7、石炭1/3。「世界の工場」の内実を示す数字として押さえる。"}]}, {"k": "IV", "title": "ユニットIV 後発国の工業化（ドイツの事例）", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>後発国はどのように先発国に追いつき、工業化したのか。\n<h3 style=\"margin-top:10px\">GDP成長率の長期的動向（5局面）</h3><ul><li><b>第1局面 1820年〜1870年代</b>：産業革命の成果が徐々に顕在化</li><li><b>第2局面 1870年代〜1913年</b>：一人当たりGDPが全ての地域で増大。輸送・通信手段の急速な拡大＝<b>「第一次グローバリゼーションの時代」</b></li><li><b>第3局面 1914年〜1950年</b>：多くの地域で成長が伸び悩み</li><li><b>第4局面 1950年〜1973年</b>：空前の成長率＝<b>高度経済成長期</b></li><li><b>第5局面 1973年〜</b>：前局面をはるかに下回る。ただし地域差あり</li></ul>数百年を通じて格差は増大傾向にある。\n<h3 style=\"margin-top:10px\">因果の筋（200字）</h3>工業化を段階的に捉えるモデルとして<b>ロストウのテイク・オフ・モデル</b>（5段階）があるが、これは工業化への絶対的信頼と「繁栄のアメリカ」に支えられたモデルであった。これに対し<b>ガーシェンクロン・モデル</b>は、後発国であるがゆえの共通の特徴を4点で捉える。①先発国から最新技術・資本を導入できるため急速に工業化する、②キャッチアップのため大規模な生産組織をとる、③生産財（資本財）部門が早期に発展する、④銀行・租税といった<b>制度的手段</b>を採用する。ドイツはまさにこの型で、合成染料を軸とする化学工業と鉄道網の急伸長により重化学工業国となった。</div>", "terms": [{"t": "第一次グローバリゼーションの時代", "a": "1870年代から1913年にかけての第2局面のこと。一人当たりGDPが全ての地域で前局面より増大し、輸送・通信手段が急速に拡大して世界経済の結びつきが強まった時期を指す呼称。", "tag": ""}, {"t": "テイク・オフ・モデル（ロストウ）", "a": "W.W.ロストウ『経済発展の諸段階』が示した5段階モデル。伝統的社会 → 離陸のための先行条件 → テイク・オフ → 成熟への前進 → 高度大衆消費時代。工業化を飛行機の上昇にたとえた点に特徴がある。", "tag": ""}, {"t": "テイク・オフ（離陸）", "a": "ロストウ・モデルの第3段階で、本格的な工業化のスタートを指す。これは決定的転換（decisive transition）であり、それ以降は成長が社会の常態となる。判定条件は生産的投資の比率、牽引車的製造工業部門（主導部門）、制度的・構造的変化の三つ。", "tag": ""}, {"t": "ガーシェンクロン・モデル", "a": "A.ガーシェンクロンが示した、後発国であるゆえの共通した特徴。①急速な工業化（先発国から最新技術・資本を導入可能）、②大規模な生産組織、③生産財（資本財）部門の早期的発展、④「制度的手段」の採用の4点からなる。", "tag": ""}, {"t": "後発性の利益", "a": "後発国が先発国のすでに確立した最新技術や資本を導入できることで、先発国がたどった試行錯誤を省略し急速に工業化できるという利点。ガーシェンクロン・モデルの第一の特徴。", "tag": ""}, {"t": "製鋼法の技術革新", "a": "鋼鉄は19世紀半ばまで大量生産できず高価だった。1857年ベッセマー転炉法、1864年ジーメンス・マルタン平炉法（屑鉄の利用、蓄熱原理）、1878年トマス法（塩基性転炉。石灰石投入により燐を除去し、含燐鉄鉱石＝ミネット鉱を利用可能にした）と続いた。原料純度の高い米英ではベッセマー法が急速に普及した。", "tag": ""}, {"t": "ドイツの合成染料工業", "a": "19世紀後半、タール染料から合成染料を生成する事業が化学工業の中心となった。原料コストが最小限で高価な天然染料をたちまち代替した。ドイツは五大企業体制（バイエル、ヘキスト、カッセラ、AGFA、BASF）を築き、1870年に世界総輸出の50％、1900年には90％を占めた。開発に着手したのは英人パーキンだったが、工科大学や企業内R&D部署の設立が早かったドイツで実用化が進んだ。", "tag": ""}, {"t": "「制度的手段」（institutional implement）", "a": "後発国が工業化を推進するために採用する仕組み。銀行が貯蓄を工業投資へ振り向ける、租税により政府が直接工業投資を行う、殖産興業政策や経済五か年計画を実施する、などが該当する。ガーシェンクロン・モデルの第四の特徴。", "tag": ""}, {"t": "ドイツの鉄道網の急速な拡大", "a": "1834年のニュルンベルク〜フュルト間5マイルの開通を皮切りに鉄道網が急伸長し、ライン川の水運と相まって流通を活性化させた。鉄道は生産財部門の早期的発展を象徴する事例である。", "tag": ""}], "qs": [{"q": "1870年代から1913年にかけての時期は何と呼ばれるか。", "a": "第一次グローバリゼーションの時代", "d": ["高度経済成長期", "産業革命期", "大不況期"], "e": "一人当たりGDPが全地域で増大し、輸送・通信手段が急速に拡大した第2局面。"}, {"q": "空前の成長率を記録した「高度経済成長期」にあたるのはどの時期か。", "a": "1950年〜1973年", "d": ["1820年〜1870年代", "1870年代〜1913年", "1914年〜1950年"], "e": "第4局面。1973年以降の第5局面では成長率が大きく下がる。"}, {"q": "ロストウ・モデルにおける「テイク・オフ」は第何段階にあたるか。", "a": "第3段階", "d": ["第1段階", "第2段階", "第5段階"], "e": "伝統的社会 → 先行条件 → テイク・オフ → 成熟への前進 → 高度大衆消費時代。テイク・オフは decisive transition と位置づけられる。"}, {"q": "ロストウがテイク・オフの判定条件として挙げたものはどれか。", "a": "生産的投資の比率、主導部門、制度的・構造的変化", "d": ["人口増加率、識字率、都市化率", "貿易黒字、外貨準備、為替相場", "GDP、失業率、物価上昇率"], "e": "第5段階への到達の指標となるのは耐久消費財の普及である点も対で押さえる。"}, {"q": "ガーシェンクロン・モデルが挙げる後発国の特徴に含まれないものはどれか。", "a": "小規模な家内工業中心の生産組織", "d": ["急速な工業化", "生産財部門の早期的発展", "「制度的手段」の採用"], "e": "後発国はキャッチアップのために大規模な生産組織をとる。これが第二の特徴。"}, {"q": "1878年のトマス法（塩基性転炉）の意義はどこにあるか。", "a": "石灰石の投入により燐を除去し、含燐鉄鉱石（ミネット鉱）を利用可能にした", "d": ["屑鉄の利用を可能にした", "初めて鋼鉄の大量生産を可能にした", "電気炉による製鋼を実現した"], "e": "屑鉄の利用と蓄熱原理は1864年のジーメンス・マルタン平炉法。1857年ベッセマー転炉法と合わせて三つを区別する。"}, {"q": "1900年時点でドイツが合成染料の世界総輸出に占めた割合はどれくらいか。", "a": "約90％", "d": ["約30％", "約50％", "約70％"], "e": "1870年に50％、1900年に90％。開発に着手したのは英人パーキンだったが、実用化はドイツで進んだ。"}, {"q": "ガーシェンクロン・モデルの「制度的手段」に含まれるものはどれか。", "a": "銀行が貯蓄を工業投資へ振り向けること", "d": ["特許制度の廃止", "労働組合の結成", "自由貿易政策の採用"], "e": "銀行、租税による政府の直接投資、殖産興業政策や経済五か年計画などが該当する。"}]}, {"k": "V", "title": "ユニットV アメリカ合衆国の登場", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>アメリカはなぜ世界で最も早く「大衆消費社会」を実現できたのか。\n<h3 style=\"margin-top:10px\">因果の筋（200字）</h3>アメリカは<b>白人の居住植民地</b>として出発した（アジアは白人が支配者として入植したのと対照的）。比較的早い時期に独立を達成し、合理的思考様式や民主的統治原理といった経済発展に適合的な要素が直接移植された。独立後も原綿・穀物の供給地としてイギリスへの経済的従属が続いたため、経済的自立と西部・南部の経済的統合が課題となる。<b>ハミルトン体制</b>による公債・租税・銀行・貨幣制度の整備と製造業振興政策がその出発点であり、初期工業化はニューイングランドの綿工業が担った。広大な資源・絶えざる移民・巨大な国内市場を背景に、世界で最も早く大衆消費社会を実現した。</div>", "terms": [{"t": "白人居住植民地", "a": "アメリカがそこに白人自身が定住する形の植民地として出発したこと。白人が支配者として入植したアジアの植民地とは性格が異なり、合理的思考様式や民主的統治原理といった経済発展に適合的な要素が直接移植された点が重要である。", "tag": ""}, {"t": "勅許状（charter）", "a": "国王が植民地建設を認可するために付与した文書。これにより「領主支配地」が成立した。1630年マサチューセッツ、1632年メリーランド、1635年ニューハンプシャー、1680年ペンシルヴェニア、1732年ジョージアなど。", "tag": ""}, {"t": "「代表なくして課税なし」", "a": "本国議会に代表を送れない植民地に課税することは不当だとする主張。イギリスの新大陸への課税強化に対する反発を表し、1773年のボストン茶会事件、1775年の独立戦争開戦、1776年の13植民地独立宣言へとつながった。", "tag": ""}, {"t": "ハミルトン体制", "a": "ワシントン内閣財務長官アレクサンダー・ハミルトンが構築した経済制度。公債（1790年公債借換法。外債は直ちに償還、戦時公債は通常公債に切替、減債基金は公有地売却収入）、租税（1789年関税法など）、銀行（1791年第一合衆国銀行、1816年第二合衆国銀行）、貨幣制度（1792年Coinage Act）、製造業振興政策（1791年 Report on Manufactures）からなる。", "tag": ""}, {"t": "S. スレイター", "a": "イギリス出身で1789年に渡米し、1793年にロードアイランド州ポータケットに紡績工場を建設した人物。「家族ぐるみ雇用」により工場を中心とするコミュニティを建設し、19世紀前半には400以上の工業コミュニティが生まれた。", "tag": ""}, {"t": "F. ローウェルとウォルサム工場", "a": "富裕なボストン商人ローウェルは1810〜12年にイギリスで繊維工場を視察し、1814年にウォルサムでボストン・マニュファクチャリング社を創業した。労働力は周辺農村の独身女性をリクルート。株式会社形態・生産工程の統合・製品の規格化を特徴とし、のちのアメリカのビッグ・ビジネスのモデルとなった。", "tag": ""}, {"t": "大衆消費社会（豊かな社会）", "a": "耐久消費財が広く一般家庭に普及した豊かな社会。アメリカは広大な資源、絶えざる移民、フロンティア拡大による巨大な国内市場を背景に、世界で最も早くこれを実現した。ロストウ・モデルの第5段階にあたる。", "tag": ""}], "qs": [{"q": "アメリカがアジアの植民地と決定的に異なる点はどこか。", "a": "白人の居住植民地として出発した点", "d": ["宗主国が存在しなかった点", "工業化が先行した点", "奴隷制がなかった点"], "e": "アジアは白人が支配者として入植した。この対比により、経済発展に適合的な要素が直接移植された理由が説明できる。"}, {"q": "イギリスが植民地建設を認可するために付与した文書を何というか。", "a": "勅許状（charter）", "d": ["独立宣言", "権利章典", "マグナ・カルタ"], "e": "1630年マサチューセッツ、1632年メリーランドなど。これにより「領主支配地」が成立した。"}, {"q": "ワシントン内閣の財務長官として経済制度を構築したのは誰か。", "a": "アレクサンダー・ハミルトン", "d": ["トマス・ジェファソン", "テンチ・コックス", "フランシス・ローウェル"], "e": "公債・租税・銀行・貨幣制度・製造業振興政策の五本柱。1791年に第一合衆国銀行を設立した。"}, {"q": "1793年にロードアイランド州ポータケットに紡績工場を建設したのは誰か。", "a": "S. スレイター", "d": ["F. ローウェル", "E. ホイットニー", "A. ハミルトン"], "e": "イギリス出身で1789年渡米。「家族ぐるみ雇用」により工場を中心とするコミュニティを建設した。"}, {"q": "ウォルサム工場（1814年創業）の労働力はどこから調達されたか。", "a": "周辺農村の独身女性", "d": ["ヨーロッパからの移民", "南部の奴隷", "都市の失業者"], "e": "株式会社形態・生産工程の統合・製品の規格化を特徴とし、のちのアメリカのビッグ・ビジネスのモデルとなった。"}, {"q": "独立後のアメリカが直面した課題としてレジュメが挙げるものはどれか。", "a": "イギリスに対する経済的自立と、西部・南部の経済的統合", "d": ["ヨーロッパへの再統合", "植民地の再獲得", "農業からの完全撤退"], "e": "独立後も原綿・穀物の供給地として経済的従属が続いていた。"}]}, {"k": "VI", "title": "ユニットVI 19世紀後半の世界経済", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>19世紀後半に世界経済の結びつきはどのように強まったのか。そのなかでイギリスの国際投資はどのような特徴と役割を持ったか。\n<h3 style=\"margin-top:10px\">レジュメが明示する単元の要点</h3><ul><li>19世紀後半は欧米以外の地域でも経済成長率が高まる</li><li>世界経済の結びつきが強まり、<b>「第一次グローバリゼーションの時代」</b>の呼称も</li><li>英は生産力が翳っても、経済活動の重心をやや移動させ、引き続き世界経済をリード</li></ul>\n<h3 style=\"margin-top:10px\">イギリスの国際投資の特徴（過去問【3】の中核）</h3><ul><li><b>①「世界の工場」から「世界の銀行」（Bank of the World）へ</b>：工業生産力に翳りが見えても、金融へ重心を移して主導権を保った。輸出入の担い手としては「世界の商店主」。</li><li><b>②政府債と鉄道投資の比率がきわめて高い</b>：鉄道は工業化に不可欠の社会資本で巨額の初期投資を要するため、資金の出し手が必要だった。</li><li><b>③投資先は「新定住地域」（the regions of recent settlement）が大きい</b>：温帯に属し広大・肥沃な平原を持ち、植民地から独立ないし財政的自治権を獲得した地域。カナダは政府債・鉄道の比率がとくに大きい。南アフリカは定義から外れる。</li><li><b>④英仏は間接投資が主流</b>（米独は直接投資＝FDIが主流）。</li><li><b>⑤「多角的決済システム」の形成</b>：同額の金でより効率的に支払いを拡大できる仕組みができた。</li></ul>\n<h3 style=\"margin-top:10px\">役割の書き方</h3>単に「金を出した」ではなく、<b>受け入れ国の側で何が起きたか</b>まで書く。アルゼンチンの例（鉄道敷設 → 穀物・食肉の比較優位産業への特化 → 「世界の食糧庫」化 → イギリス中心のネットワークに「半周辺」国として組み込まれる）が最も書きやすい。</div>", "terms": [{"t": "移民のプル要因とプッシュ要因", "a": "プル要因は受け入れ側の求心力で、新大陸での土地獲得や企業的成功といった社会的上昇の機会。プッシュ要因は押し出し要因で、人口圧力、貧困、飢饉、さまざまな迫害。19世紀特有の事情としては工業化の波及による農村からの人口流出がある。欧州移民の受け入れ国は米62％、アルゼンチン9％、カナダ8％、ブラジル7％。", "tag": ""}, {"t": "熟練労働者移住自由化（1825年）", "a": "イギリスが熟練労働者の国外移住を自由化した措置。1842年には機械類の輸出も全面解禁された。高度の技術や専門能力を持つ人の移動が急速な技術伝播をもたらした。それ以前からイギリスの技術者は外国と行き来し、技術の密輸も頻繁であった。", "tag": ""}, {"t": "「世界の銀行」（Bank of the World）", "a": "19世紀後半、工業生産力に翳りが見え始めたイギリスが、経済活動の重心を金融へ移して転身した姿。「世界の工場」からの転換を表す。輸出入の担い手としては「世界の商店主」とも呼ばれた。", "tag": ""}, {"t": "間接投資と直接投資（FDI）", "a": "間接投資は債券・株式の取得など経営に直接関与しない形の投資、直接投資は現地に子会社や工場を設けて経営に関与する投資。19世紀後半において米独は直接投資、英仏は間接投資が主流であった。", "tag": ""}, {"t": "新定住地域（the regions of recent settlement）", "a": "イギリスの投資先として投資額が大きかった地域。温帯に属し広大・肥沃な平原を持ち、植民地から独立ないし財政的自治権を獲得した地域を指す。カナダはイギリスからの投資で政府債・鉄道の比率が際立って大きい。南アフリカは新定住地域の定義からは外れる。", "tag": ""}, {"t": "政府債と鉄道投資", "a": "イギリスの国際投資においてきわめて比率が高かった二つの対象。鉄道は工業化に不可欠の社会資本であり、巨額の初期投資を必要とするため外部からの資金供給が求められた。", "tag": ""}, {"t": "多角的決済システム", "a": "19世紀後半の世界経済に形成された決済の仕組み。各国間の債権債務を二国間ではなく多角的に相殺することで、同額の金でより効率的に支払いを拡大することが可能になった。", "tag": ""}, {"t": "「中核」と「周辺」（ウォーラーステイン）", "a": "I.ウォーラーステインの「資本主義世界システム」論の概念。中核は英・仏・独ほか欧州数か国、米、やや遅れて露・日。周辺は欧州・北米以外の多くの諸国で、経済的には中核国の原料供給地・工業製品市場・投資受入先、政治的には中核国の植民地に組み入れられた。", "tag": ""}, {"t": "単一中心的中核と多中心的中核", "a": "ウォーラーステインの世界システム論における中核の二つの状態。単一中心的中核の時期（A）と多中心的中核の時期（B）は周期的に繰り返し、時間的にはBのほうがはるかに長い。19世紀後半から20世紀なかばはBにあたる過渡期的局面である。", "tag": ""}, {"t": "「半周辺」とアルゼンチン", "a": "新定住地域が置かれた中核と周辺の中間的な立場。アルゼンチンは1816年独立、1853年憲法制定を経て、移民優遇措置（1876年自作農創設法）と外資導入（1910年時点でイギリスが投資の60％）により鉄道網を拡大し、穀物と食肉という比較優位産業に特化した。1880年代の冷凍船技術実用化で欧州への冷凍肉輸出が始まり、19世紀末までに「世界の食糧庫」の地位を確立、イギリスとは「名誉自治領」と呼ばれるほど緊密に結びついた。", "tag": ""}, {"t": "「一匹の羊から二枚の皮を剥ぐ」", "a": "イギリスにとってのアルゼンチン鉄道投資を評した表現。鉄道への投資から利子を得ると同時に、その鉄道が運ぶ穀物・食肉を安く輸入できるという二重の利益を得たことを指す。", "tag": ""}, {"t": "本国費（Home Charges）", "a": "植民地インドがイギリス本国に支払った行政費・軍事費・債務利子等の名目の送金。イギリスがインドから恒常的に資金を吸い上げる仕組みとなり、多角的決済システムのなかでイギリスの対米・対欧赤字を埋める役割を果たしたとされる。※2025年度過去問の関連語句にあるが、手元のレジュメには明示がないため、授業ノートで扱いを確認しておくこと。", "tag": "要確認"}], "qs": [{"q": "19世紀後半にイギリスが転身した姿を表す言葉はどれか。", "a": "「世界の銀行」（Bank of the World）", "d": ["「世界の工場」", "「世界の市場」", "「世界の農場」"], "e": "工業生産力に翳りが見えても、経済活動の重心を金融へ移して世界経済をリードし続けた。輸出入の担い手としては「世界の商店主」。"}, {"q": "19世紀後半の国際投資について、英仏と米独の違いとして正しいものはどれか。", "a": "英仏は間接投資、米独は直接投資（FDI）が主流", "d": ["英仏は直接投資、米独は間接投資が主流", "いずれも直接投資が主流", "いずれも間接投資が主流"], "e": "過去問【3】の関連語句に「間接投資」「直接投資」が並んでいた。この区別を必ず書く。"}, {"q": "イギリスの国際投資において、きわめて比率が高かった投資対象はどれか。", "a": "政府債と鉄道", "d": ["製造業と鉱山", "不動産と商業", "農地と牧場"], "e": "鉄道は工業化に不可欠の社会資本であり、巨額の初期投資を必要とした点が理由。"}, {"q": "イギリスの投資先として投資額が大きかった「新定住地域」の条件はどれか。", "a": "温帯に属し、広大・肥沃な平原を持ち、植民地から独立ないし財政的自治権を獲得した地域", "d": ["熱帯に属し、鉱物資源が豊富な地域", "人口密度が高く、工業が発達した地域", "寒冷で人口の少ない地域"], "e": "カナダは政府債・鉄道の比率が際立って大きい。南アフリカは新定住地域の定義から外れる点に注意。"}, {"q": "19世紀後半に形成され、同額の金でより効率的に支払いを拡大することを可能にした仕組みは何か。", "a": "多角的決済システム", "d": ["金本位制", "ブロック経済", "関税同盟"], "e": "二国間ではなく多角的に債権債務を相殺する仕組み。過去問【3】の関連語句にも挙げられている。"}, {"q": "イギリスが熟練労働者の移住を自由化したのはいつか。", "a": "1825年", "d": ["1801年", "1842年", "1870年"], "e": "1842年には機械類の輸出も全面解禁。ヒトのネットワークによる技術伝播を象徴する年号。"}, {"q": "ウォーラーステインの世界システム論において「周辺」が果たした役割はどれか。", "a": "中核国の原料供給地・工業製品市場・投資受入先", "d": ["中核国への資本輸出", "世界金融の中心", "工業製品の輸出拠点"], "e": "政治的には中核国の植民地に組み入れられた。1415年から1969年までに総数412の植民地が存在し、支配国は英172、スペイン81、仏65。"}, {"q": "19世紀末のアルゼンチンが確立した地位はどれか。", "a": "「世界の食糧庫」", "d": ["「世界の工場」", "「世界の銀行」", "「世界の商店主」"], "e": "1880年代の冷凍船技術実用化により欧州へ冷凍肉の輸出を開始。穀物と食肉という比較優位産業への特化の結果。"}, {"q": "1910年時点でアルゼンチンへの最大の投資国はどこで、その割合はどれくらいか。", "a": "イギリス、約60％", "d": ["アメリカ、約60％", "フランス、約40％", "ドイツ、約30％"], "e": "アルゼンチンはイギリスにとってもラテンアメリカ最大の投資先だった。「名誉自治領」と呼ばれるほど緊密。"}, {"q": "イギリスにとってのアルゼンチン鉄道投資を評した表現はどれか。", "a": "「一匹の羊から二枚の皮を剥ぐ」", "d": ["「世界の食糧庫」", "「名誉自治領」", "「半周辺」"], "e": "鉄道投資の利子を得ると同時に、その鉄道が運ぶ穀物・食肉を安く輸入できるという二重の利益。"}]}, {"k": "VII", "title": "ユニットVII 両世界大戦間期の激動", "note": "<div class=\"note\"><h3>この単元で答える問い</h3>第一次世界大戦は世界経済の構造をどう変え、なぜ戦間期は不安定だったのか。\n<h3 style=\"margin-top:10px\">レジュメが明示する単元のポイント</h3><ul><li>第一次世界大戦により、<b>経済的勢力配置図が一変</b></li><li>欧諸国は大戦の経済的打撃が甚大で、深刻な諸問題を抱える</li><li>米は<b>一人勝ち的な債権国</b>となり、「豊かな社会」の恩恵を享受</li></ul>\n<h3 style=\"margin-top:10px\">なぜ不安定だったか（3点で書く）</h3><ul><li><b>①戦債・賠償金問題</b>：連合国側も膨大な戦債を累積し、ドイツは巨額の賠償金支払いを負った。唯一の債権国アメリカが欧州に資金援助し、イギリスに代わってネットワークの要となったが、これはドイツ経済の復興を前提とした脆弱でリスクを含む結びつきだった。</li><li><b>②再建金本位制の機能不全</b>：戦後 \"Return to normalcy!\" のもと各国が金本位制に復帰した（1919米・1924独・1925英・1928仏・1930日）が、イギリスは戦前と同じ平価で復帰したためポンドが過大評価となった。</li><li><b>③覇権の空白</b>：アメリカはイギリスの戦前の役割（自由貿易・国際投資のリーダー）を果たそうとせず、ポンドとドル双方が基軸通貨となる不安定なシステムとなった。「世界は米を必要としたが、米は、その気がなければ一人でもやっていけた」。</li></ul></div>", "terms": [{"t": "戦間期", "a": "1918年の第一次世界大戦休戦から1939年の第二次世界大戦開戦までの期間。長くはないが、管理経済の登場、共産主義経済圏の成立、英から米への経済的覇権の移行など、戦後世界経済のあり方に直結する構造転換の時期であった。ただし移行は完了せず、過渡期的な混乱期にとどまった。", "tag": ""}, {"t": "管理経済（managed economy）", "a": "政府が経済に介入して調整を行う仕組み。戦間期に登場し、政府による経済の全面的統制を行う共産主義経済圏の成立と並んで、この時期の構造転換を象徴する。", "tag": ""}, {"t": "戦債・賠償金問題", "a": "第一次世界大戦が史上初の近代戦・総力戦であったため、連合国側の国々でも膨大な戦債が累積し、敗戦国の中心であったドイツは巨額の賠償金支払いを負った。唯一の債権国アメリカが欧州に資金援助し、イギリスに代わってネットワークの要となったが、ドイツ経済の復興を前提とした脆弱な結びつきであった。", "tag": ""}, {"t": "再建金本位制", "a": "第一次大戦で一時停止された金本位制が戦後に再建されたもの。1919年米、1924年独、1925年英、1928年仏、1930年日と復帰し、基軸国イギリスが復帰した1925年から再建金本位制の時代となる。しかし戦前ほど順調には機能しなかった。", "tag": ""}, {"t": "ポンドの過大評価", "a": "イギリスが戦前と同じ平価（par rate）で金本位制に復帰したため、戦後に決定的に低下した経済的地位に比してポンドの価値が高すぎる状態となったこと。輸出競争力を損ない、再建金本位制の機能不全の一因となった。", "tag": ""}, {"t": "T型フォード", "a": "フォードが生産した自動車。\"Tin Lizzie\" と呼ばれ、中産階級家族の所有・利用を想定し、運転・修理が容易で耐久性・耐候性に優れるという明白な商品コンセプトを持った。1913年に流れ作業による組立生産ライン（assembly line）を導入、1914年に日給を2.3ドルから5ドルに倍増した。これにより米では自動車が一般市民の日用品となった。", "tag": ""}, {"t": "販売金融会社と分割払い購入", "a": "耐久消費財の普及を支えた仕組み。1928年には全米で千社に達し、「消費のための借金」を可能にした。均質的で大量の消費需要、ブランドを基準とした選択購入、セルフ形式のスーパーマーケットとともに1920年代アメリカの「豊かな社会」を構成した。", "tag": ""}, {"t": "1920年代アメリカ農業の不振", "a": "戦時中は連合国側への膨大な食糧提供による特需があったが、戦後は経済的に疲弊した欧州が戦前ほどの購買力を持たず、しかも戦時中の食糧不足の経験から穀物自給方針に舵を切ったため、1920年代を通じて農業不振が深刻化した。大恐慌に先駆ける状況であった。", "tag": ""}], "qs": [{"q": "戦間期とはいつからいつまでか。", "a": "1918年〜1939年", "d": ["1914年〜1918年", "1929年〜1939年", "1920年〜1930年"], "e": "1918年の第一次世界大戦休戦から、1939年の第二次世界大戦開戦まで。"}, {"q": "第一次世界大戦の結果、アメリカはどうなったか。", "a": "一人勝ち的な債権国となった", "d": ["深刻な打撃を受けた", "孤立して衰退した", "債務国に転落した"], "e": "欧州諸国が甚大な経済的打撃を受けた一方で、アメリカは「豊かな社会」の恩恵を享受した。"}, {"q": "戦間期の構造転換を象徴する、政府が経済に介入する仕組みを何というか。", "a": "管理経済（managed economy）", "d": ["自由放任経済", "計画経済", "混合経済"], "e": "共産主義（政府による経済の全面的統制）経済圏の成立と並ぶ、戦間期の構造転換の要素。"}, {"q": "イギリスが金本位制に復帰したのは何年か。", "a": "1925年", "d": ["1919年", "1924年", "1928年"], "e": "1919米・1924独・1925英・1928仏・1930日。基軸国イギリスが復帰した1925年から再建金本位制の時代となる。"}, {"q": "再建金本位制が順調に機能しなかった理由としてレジュメが指摘するものはどれか。", "a": "イギリスが戦前と同じ平価で復帰し、ポンドが過大評価となったこと", "d": ["金の産出量が激減したこと", "すべての国が同時に復帰したこと", "ドルが金と交換できなかったこと"], "e": "加えて、米が英の戦前の役割（自由貿易・国際投資のリーダー）を果たそうとしなかったことも大きい。"}, {"q": "T型フォードについて、1913年に導入されたものは何か。", "a": "流れ作業による組立生産ライン（assembly line）", "d": ["分割払い販売制度", "労働組合との団体交渉", "海外生産拠点"], "e": "1914年には日給を2.3ドルから5ドルに倍増。2.5ドルを基本給とし勤勉な従業員に同額を上乗せする仕組みだった。"}, {"q": "1920年代アメリカの農業が不振だった理由として正しいものはどれか。", "a": "欧州が購買力を失い、かつ穀物自給方針に舵を切ったため", "d": ["国内需要が激減したため", "干ばつが続いたため", "関税が撤廃されたため"], "e": "戦時中は連合国側への食糧提供で特需があった反動。大恐慌に先駆ける状況であった。"}, {"q": "1920年代アメリカで「消費のための借金」を可能にした仕組みは何か。", "a": "販売金融会社による分割払い購入", "d": ["株式の信用取引", "住宅ローン", "消費者信用組合"], "e": "1928年には全米で千社に達した。均質的で大量の消費需要、ブランド選択、セルフ形式のスーパーマーケットとともに「豊かな社会」を構成した。"}]}];
const KAKO="\n<div class=\"note\" style=\"border-left-color:var(--ng)\">\n<h3>今年の出題形式（先生の予告）</h3>\n<p style=\"margin:6px 0\"><b>全3問。問1＝用語を4つ、それぞれ2〜3行で説明。問2・問3＝論述。</b></p>\n<p style=\"margin:6px 0;font-size:13px;color:var(--sub)\">昨年度（2025年度）の過去問は3問すべてが論述で、問1が30点・問2が30点・問3が40点でした。<b>今年は問1が用語説明に変わっています</b>ので、そのまま同じとは考えないでください。ただし問2・問3の論述の性格は引き継がれる可能性が高いです。</p>\n</div>\n\n<div class=\"note\">\n<h3>昨年度（2025年度）の実際の出題　担当：重富公生</h3>\n<h4>【1】30点</h4>\n<p>西暦1500年頃以降、ヨーロッパ人は大挙して世界各地に進出した（「大航海時代」）。この進出は世界経済の歴史の上でどのような意味を持っていたか、思うところを述べなさい。</p>\n<h4>【2】30点</h4>\n<p>イギリス産業革命の綿工業における発明や技術革新の特徴として、しばしば三つのこと、すなわち第一に工程間の不均衡(imbalance)が見られたこと、第二に手工業的技術の残存、第三にその長期性が指摘されている。これら三点について、個々の実例にもとづいて論述しなさい。</p>\n<p class=\"kw\"><b>関連語句</b>：紡績工程、織布工程、紡車、手織機、飛杼、多軸化、キャリコ、水力紡績機、準備工程、アークライト、ミュール紡績機、特許、ジェニー紡績機、ファスチャン、熟練、自動ミュール、力織機、工場生産</p>\n<h4>【3】40点</h4>\n<p>19世紀のなかばから20世紀の初頭にかけて、世界経済のネットワークが急速に拡大・発展していった。そのネットワークを構成していた要素は、ヒト（移民）・モノ（貿易）・カネ（投資）・技術・情報など多岐にわたっていたが、なかでも国際投資は世界経済の成長にあたり大きな役割を果たした。投資の絶対額が際立って大きかったイギリスの国際投資の特徴および役割について論じなさい。</p>\n<p class=\"kw\"><b>関連語句</b>：間接投資、新定住地域、政府債、直接投資、「世界の銀行」、鉄道、ロンドン、工業インフラ、熱帯地域、鉱山開発、多角的決済システム、本国費、アルゼンチン、南アフリカ、インド</p>\n<p style=\"font-size:13px;color:var(--sub);margin-top:10px\"><b>読み取れること</b>：論述問題には<b>関連語句のリストが与えられ、「必要であれば解答で用いてください」</b>とされています。つまり語句を知らなくても書けなくはないが、<b>使えば使うほど点になる</b>形式です。用語をただ暗記するのではなく、「この語句をどの文脈で使うか」を意識してください。</p>\n</div>\n\n<div class=\"note\">\n<h3>答案設計図①　大航海時代の世界経済史上の意味</h3>\n<p style=\"font-size:13px;color:var(--sub);margin:4px 0 10px\">今年は用語説明に降格した可能性がありますが、論述で出た場合の骨格。</p>\n<ul>\n<li><b>導入</b>：この進出は単なる地理的発見ではなく、世界を一つの経済圏へ編成し直す起点だった、と最初に筋を示す。</li>\n<li><b>①なぜ起きたか</b>：欧州とアジアの<b>物産複合</b>の違い。<b>Push要因</b>（欧州側の動機）と<b>Pull要因</b>（アジアの物産）。</li>\n<li><b>②何が起きたか</b>：ポルトガルの東回り（1488ディアス／1498ダ・ガマ）とスペインの新大陸（1492コロンブス）。<b>商業革命</b>＝商業の中心が地中海から大西洋へ。<b>価格革命</b>＝中南米の銀流入による物価高騰。</li>\n<li><b>③何を変えたか</b>：他地域を<b>物産複合圏として取り込む</b>構造の始まり。作物・家畜の双方向的移動（中南米→欧：じゃがいも、トマト、とうもろこし／欧→中南米：馬、牛、羊）。</li>\n<li><b>④その後へのつながり</b>：オランダの覇権（VOC 1602）→ イギリスの台頭 → 19世紀の世界経済ネットワークへ。<b>ここを書くと「全体を理解している」印象になる。</b></li>\n</ul>\n</div>\n\n<div class=\"note\">\n<h3>答案設計図②　産業革命の技術革新の三特徴（実例つき）</h3>\n<p style=\"font-size:13px;color:var(--sub);margin:4px 0 10px\">最も配点効率が良い問題。三特徴それぞれに<b>機械名・人名・年代</b>を最低ひとつずつ付けるのが得点の核心。</p>\n<ul>\n<li><b>前提として一文</b>：産業革命の発明の意義は単発の画期性ではなく、<b>原理（手作業の機械化）・動力（エネルギー転換動力）・素材（鉱物性原料）の三要素を結合させた</b>点にある。</li>\n<li><b>①工程間の不均衡(imbalance)</b>：綿加工は準備→紡績→織布→仕上と進む。<b>1733年 飛杼</b>（ジョン・ケイ）が織布の生産性を上げると紡績が追いつかなくなり、<b>多軸化</b>を実現する三つの発明（<b>1769 水力紡績機／アークライト</b>、<b>1764発明・1770 ジェニー紡績機／ハーグリーヴズ</b>、<b>1780 ミュール紡績機／クロンプトン</b>）が続いた。すると今度は紡績が先行して織布がボトルネックになり、<b>1786 力織機／カートライト</b>が生まれる。<b>ある工程の機械化が次の工程の不均衡を生み、それが次の発明を誘発する連鎖。</b></li>\n<li><b>②手工業的技術の残存</b>：<b>ジェニー紡績機は操作に手工業的熟練を要し、機械動力での運転には向かなかった</b>。だから水力紡績機との長所を兼ね備えたミュール紡績機が求められた。ミュールも当初は熟練工の技能に依存し、<b>1825年の自動ミュール（リチャード・ロバーツ、蒸気機関と連結）</b>でようやく自動化される。番手の使い分け（80番手ミュール＝モスリン／40番手ジェニー＝キャリコ／20番手水力紡績機）にも触れられると強い。</li>\n<li><b>③長期性</b>：<b>1733年の飛杼から1830年代の全工程機械化・工場生産化まで約100年</b>。織布工程の機械化が遅れた理由は<b>(a)機械自体の技術的信頼性 (b)労働力コストの上昇 (c)成人男子の失業への社会的抵抗</b>の三つ。カートライトの工場が手織工の焼き討ちで焼失した事実、1820年代の改良力織機、1840年代の自動停止メカニズムまで書けば完璧。</li>\n<li><b>締め</b>：この三特徴は、産業革命が一夜の断絶ではなく<b>連鎖的・漸進的な過程</b>だったことを示している、とまとめる。</li>\n</ul>\n</div>\n\n<div class=\"note\">\n<h3>答案設計図③　イギリスの国際投資の特徴と役割</h3>\n<p style=\"font-size:13px;color:var(--sub);margin:4px 0 10px\">「特徴」と「役割」を分けて書くこと。役割は<b>受け入れ国で何が起きたか</b>まで書いて初めて点になる。</p>\n<ul>\n<li><b>導入</b>：19世紀後半、イギリスは工業生産力に翳りが見えたが、経済活動の重心を金融へ移し「世界の工場」から<b>「世界の銀行」(Bank of the World)</b>へ転身した。ロンドンがその中心。</li>\n<li><b>特徴①　投資形態</b>：<b>英仏は間接投資、米独は直接投資(FDI)</b>が主流。イギリスは経営に直接関与せず、債券取得を通じて資金を供給した。</li>\n<li><b>特徴②　投資対象</b>：<b>政府債と鉄道投資の比率がきわめて高い</b>。鉄道は工業化に不可欠の社会資本で巨額の初期投資を要するため、外部からの資金供給が不可欠だった。</li>\n<li><b>特徴③　投資先</b>：<b>新定住地域(the regions of recent settlement)</b>への投資額が大きい。温帯・広大肥沃な平原・植民地から独立ないし財政的自治権を獲得、という条件。カナダは政府債・鉄道の比率が際立つ。<b>南アフリカは新定住地域の定義からは外れる</b>（鉱山開発型）ので、書くなら区別して書く。</li>\n<li><b>特徴④　決済の仕組み</b>：<b>多角的決済システム</b>の形成により、同額の金でより効率的に支払いを拡大できた。インドからの<b>本国費</b>の送金がこのシステムのなかで果たした役割にも触れられるとよい。</li>\n<li><b>役割（ここが差がつく）</b>：アルゼンチンを例に。1857年ブエノスアイレスから西方への鉄道開通、1890年代に営業キロ数1万超。<b>鉄道敷設 → 穀物（ラ・パンパ）と食肉（1880年代の冷凍船技術実用化）という比較優位産業への特化 → 19世紀末までに「世界の食糧庫」の地位確立 → イギリス中心の世界経済ネットワークに「半周辺」国として組み込まれる</b>。イギリスにとっては<b>「一匹の羊から二枚の皮を剥ぐ」</b>（投資利子＋安価な食糧輸入）。</li>\n<li><b>締め</b>：イギリスの国際投資は世界経済の成長を促した一方で、受け入れ国を一次産品供給地として固定する側面も持った。<b>両面を書くと評価が上がる。</b></li>\n</ul>\n</div>\n\n<div class=\"note\">\n<h3>問1（用語説明4つ）の書き方</h3>\n<ul>\n<li><b>2〜3行＝おおよそ80〜120字</b>。短すぎても長すぎても損。</li>\n<li>型は<b>「①それは何か（定義）→②いつ・誰が・どこで→③なぜ重要か（意義・帰結）」</b>。この3文で必ず2〜3行になります。</li>\n<li>例：<b>ミュール紡績機</b>「1780年にサミュエル・クロンプトンが発明した紡績機で、ジェニー紡績機と水力紡績機の長所を兼ね備えた。80番手の細糸を紡げモスリン生産を可能にし、イギリスで最も普及した。ただしクロンプトンは特許を申請せず技術を秘匿した。」</li>\n<li>年代・人名が入っていない用語説明はほぼ確実に減点されます。<b>「用語説明」タブの模範解答は、この型で書いてあります。</b></li>\n</ul>\n</div>\n";
const S={},T={};let cur=0,mode='term',wrongOnly=false;

const NQ=LEC.reduce((a,l)=>a+l.qs.length,0);

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function order(li,qi){
  const k=li+'_'+qi;
  if(!ORD[k]){const q=LEC[li].qs[qi];ORD[k]=shuf([{t:q.a,ok:1}].concat(q.d.map(t=>({t,ok:0}))));}
  return ORD[k];
}
function store(){return mode==='term'?T:S;}
function items(l){return mode==='term'?l.terms:l.qs;}
function tabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  if(mode==='kako'){el.style.display='none';return;}
  el.style.display='';
  const ST=store();
  LEC.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'');
    const n=items(l).length;let done=0;
    for(let q=0;q<n;q++)if(ST[i+'_'+q])done++;
    if(done===n&&n>0)b.className+=' done';
    b.innerHTML=esc(l.k)+'<small>'+done+'/'+n+'</small>';
    b.onclick=()=>{cur=i;wrongOnly=false;rb();render();window.scrollTo(0,0);};
    el.appendChild(b);
  });
}
function rb(){document.getElementById('ba').style.display='none';document.getElementById('bw').style.display='';}
function render(){
  tabs();
  const m=document.getElementById('main');
  const showChrome=mode!=='kako';
  document.getElementById('prog').style.display=showChrome?'':'none';
  document.getElementById('stats').style.display=showChrome?'':'none';
  document.getElementById('foot').style.display=showChrome?'':'none';
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  if(mode==='kako'){m.innerHTML=KAKO;return;}
  const l=LEC[cur];
  let h='<h2>'+esc(l.title)+'</h2>';
  if(l.note&&!wrongOnly&&mode==='quiz')h+=l.note;
  let shown=0;
  if(mode==='term'){
    if(!wrongOnly)h+='<div class="note"><h3>使い方</h3>用語を見て、<b>声に出して2〜3行で説明</b>してから「答えを見る」。模範解答は<b>①定義 → ②いつ・誰が・どこで → ③なぜ重要か</b>の型で書いてあります。この型ごと覚えると本番で手が止まりません。</div>';
    l.terms.forEach((tm,ti)=>{
      const k=cur+'_'+ti,st=T[k];
      if(wrongOnly&&(!st||st.ok))return;
      shown++;
      h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">'+(ti+1)+'</span><span class="term">'+esc(tm.t)+(tm.tag?'<span class="tagx">'+esc(tm.tag)+'</span>':'')+'</span></div>';
      if(OPEN[k]||st){
        h+='<div class="ans"><span class="lab">模範解答（2〜3行）</span>'+esc(tm.a)+'</div>';
        if(!st)h+='<div class="act"><button class="gd" data-g="'+ti+'" data-v="1">言えた</button><button class="bd" data-g="'+ti+'" data-v="0">言えなかった</button></div>';
        else h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'言えた':'言えなかった')+'</b>　<button data-un="'+ti+'" style="padding:3px 10px;font-size:12px;margin-left:6px">やり直す</button></div>';
      }else{
        h+='<div class="act"><button data-open="'+ti+'">答えを見る</button><span class="hint">先に声に出して説明してみる</span></div>';
      }
      h+='</div>';
    });
  }else{
    l.qs.forEach((q,qi)=>{
      const k=cur+'_'+qi,st=S[k];
      if(wrongOnly&&(!st||st.ok))return;
      shown++;
      h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">Q'+(qi+1)+'</span><span class="qt">'+esc(q.q)+'</span></div><div class="opts">';
      order(cur,qi).forEach((it,i)=>{
        let cls='o';
        if(st){if(it.ok)cls+=' c';else if(st.sel===i)cls+=' x';}
        const mk=st?(it.ok?'\u2713':(st.sel===i?'\u2715':(i+1))):(i+1);
        h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'"><i>'+mk+'</i><span>'+esc(it.t)+'</span></div>';
      });
      h+='</div>';
      if(!st)h+='<div class="act"><button data-check="'+qi+'">答え合わせ</button><span class="hint" data-cnt="'+qi+'"></span></div>';
      else h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'正解':'不正解')+'</b>　'+esc(q.e)+'</div>';
      h+='</div>';
    });
  }
  if(!shown)h+='<div class="msg">この単元に残っているものはありません。</div>';
  m.innerHTML=h;bind();stats();
}
function bind(){
  document.querySelectorAll('[data-open]').forEach(b=>{b.onclick=()=>{OPEN[cur+'_'+b.dataset.open]=1;render();};});
  document.querySelectorAll('[data-g]').forEach(b=>{b.onclick=()=>{T[cur+'_'+b.dataset.g]={ok:b.dataset.v==='1'};save();render();};});
  document.querySelectorAll('[data-un]').forEach(b=>{b.onclick=()=>{delete T[cur+'_'+b.dataset.un];delete OPEN[cur+'_'+b.dataset.un];save();render();};});
  document.querySelectorAll('.o').forEach(el=>{
    const qi=+el.dataset.q,i=+el.dataset.i,k=cur+'_'+qi;
    if(S[k])return;
    el.onclick=()=>{PICK[k]=i;el.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
      const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='';};
  });
  document.querySelectorAll('[data-check]').forEach(b=>{
    const qi=+b.dataset.check,k=cur+'_'+qi;
    b.onclick=()=>{
      if(PICK[k]===undefined){const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='選択肢を選んでください';return;}
      S[k]={sel:PICK[k],ok:!!order(cur,qi)[PICK[k]].ok};save();render();
    };
  });
}
function stats(){
  const ST=store(),l=LEC[cur],n=items(l).length;let d=0,o=0;
  for(let i=0;i<n;i++){const st=ST[cur+'_'+i];if(st){d++;if(st.ok)o++;}}
  document.getElementById('s1').textContent=d+' / '+n;
  document.getElementById('s2').textContent=o;
  document.getElementById('s3').textContent=d-o;
  document.getElementById('s4').textContent=d?Math.round(o/d*100)+'%':'\u2014';
  document.getElementById('l2').textContent=mode==='term'?'言えた':'正解';
  document.getElementById('l3').textContent=mode==='term'?'言えなかった':'不正解';
  let ad=0,ao=0;const TOT=mode==='term'?NT:NQ;
  LEC.forEach((L,li)=>{const nn=items(L).length;for(let i=0;i<nn;i++){const st=ST[li+'_'+i];if(st){ad++;if(st.ok)ao++;}}});
  document.getElementById('pbar').style.width=Math.round(ad/TOT*100)+'%';
  document.getElementById('plab').textContent=(mode==='term'?'用語の進捗 ':'4択の進捗 ')+ad+' / '+TOT;
  document.getElementById('prate').textContent=ad?((mode==='term'?'言えた率 ':'正答率 ')+Math.round(ao/ad*100)+'%'):'';
}
function save(){try{localStorage.setItem(SK,JSON.stringify({S,T}));}catch(e){}}
function load(){try{const v=localStorage.getItem(SK);if(v){const o=JSON.parse(v);Object.assign(S,o.S||{});Object.assign(T,o.T||{});}}catch(e){}}
document.querySelectorAll('.mode').forEach(b=>{b.onclick=()=>{mode=b.dataset.m;wrongOnly=false;rb();render();window.scrollTo(0,0);};});
document.getElementById('bw').onclick=function(){wrongOnly=true;this.style.display='none';document.getElementById('ba').style.display='';render();};
document.getElementById('ba').onclick=function(){wrongOnly=false;this.style.display='none';document.getElementById('bw').style.display='';render();};
document.getElementById('br').onclick=function(){const ST=store(),n=items(LEC[cur]).length;for(let i=0;i<n;i++){delete ST[cur+'_'+i];delete PICK[cur+'_'+i];delete ORD[cur+'_'+i];delete OPEN[cur+'_'+i];}wrongOnly=false;rb();save();render();};
document.getElementById('brall').onclick=function(){
  if(!confirm('全ての記録を消します。よろしいですか？'))return;
  [S,T,ORD,PICK,OPEN].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  wrongOnly=false;rb();save();render();};
load();render();
</script></body></html>
