<script>
const LEC=[{"k":"1","title":"第1章 モチベーション（内容理論）","qs":[{"s":["マレーは欲求をリスト化し、その測定には","ロールシャッハ・テスト","を用いた。"],"bad":1,"fix":"TAT（主題統覚検査）","e":"TATは曖昧な絵画に対して被験者の自由な空想的物語を求め分析する投影法。ロールシャッハ・テストはcfとして挙げられているだけ。"},{"s":["マレー理論の問題点として、","欲求が少なすぎること","と、TATが研究者・診断者の力量に依存することが挙げられる。"],"bad":1,"fix":"欲求が多すぎること","e":"30個もの欲求を列挙したため「倹約的原理」に反し、実践的応用性が低いと批判された。"},{"s":["マクリーランドは、マレーの欲求リストの中から特に","生理的欲求と高い相関","のある欲求を探索した。"],"bad":1,"fix":"仕事成果と高い相関","e":"達成動機理論。仕事成果との関係を意識した点で、マレーより実践性が高い。"},{"s":["マクリーランドの達成動機理論における欲求の構成は、達成欲求・権力欲求・","生理的欲求","の3つである。"],"bad":1,"fix":"親和欲求","e":"親和欲求＝集団への所属・新しい友人や同僚を希求する欲求。人間関係に関連する欲求。"},{"s":["マズローの欲求階層説では、人間の欲求を","重要度","別に分類している。"],"bad":1,"fix":"緊急度","e":"緊急度の高いものから先に満たそうとすると仮定する。"},{"s":["マズローの欲求階層は、生理的欲求→安全欲求→","尊敬欲求→所属と愛の欲求","→自己実現欲求の順である。"],"bad":1,"fix":"所属と愛の欲求→尊敬欲求","e":"所属と愛（社会的欲求）が先、尊敬（承認）が後。この2つの順序が最も入れ替えられやすい。"},{"s":["マズローの欲求階層説において、","自己実現欲求","の典型例として長期安定雇用や大企業志向・公務員志向が挙げられる。"],"bad":1,"fix":"安全欲求","e":"安全な状況を求め、不確実な状況を避けたがる欲求の典型例。"},{"s":["欲求階層説のポイントとして、欲求の順序性が仮定されているが、","並行は認められる","。"],"bad":1,"fix":"逆行・並行・ジャンプはいずれも認められない","e":"マズローは3つとも×。並行を認めるのはERG理論のほう。"},{"s":["マズローの欲求階層説において、","安全欲求","だけは満足することがなく、際限がないとされる。"],"bad":1,"fix":"自己実現欲求","e":"自己実現欲求のみ、満たされても際限がない。"},{"s":["よく見る欲求階層のピラミッド図は、","マズロー自身","が作成したものである。"],"bad":1,"fix":"広報担当者のGoble","e":"マズロー本人が描いた図ではないという点が講義で強調されている。"},{"s":["アルダーファのERG理論は、マズローの欲求区分を改良し、欲求を","生存・人間関係・達成","の3つに再構成した。"],"bad":1,"fix":"生存・人間関係・成長","e":"G＝Growth（成長）。達成ではない。"},{"s":["ERG理論では、上位の欲求が満たされない場合に","上位の欲求の重要度がさらに強まる","という退行現象を認める。"],"bad":1,"fix":"下位の欲求の重要度が強まる","e":"満たされない上位欲求の代わりに、下位欲求へ関心が戻る（退行）。"},{"s":["ERG理論では、欲求のジャンプも並行も","いずれも認められない","。"],"bad":1,"fix":"ジャンプは認められないが、並行は認められる","e":"ERGはジャンプ×・並行○。マズローは並行も×。ここが両者の決定的な違い。"},{"s":["ERG理論において、成長欲求は","不満が引き金","となって生じる。"],"bad":1,"fix":"不満が引き金にはならない","e":"成長欲求だけは不満によって動かされない。"},{"s":["ハーズバーグの動機づけ-衛生理論は、米国ピッツバーグの","会計士および技師","を対象とした大規模な職務態度調査が出発点である。"],"bad":-1,"fix":"","e":"対象となった職種まで問われることがある。"},{"s":["ハーズバーグが用いた特殊な調査方法を","質問紙法","という。"],"bad":1,"fix":"臨界事象法","e":"際立って好感情（悪感情）を経験した状況を聞き取り、分析する方法。"},{"s":["ハーズバーグの発見事実は、人間が「満足」を感じる要因と「不満足」を感じる要因が","同一である","ことであった。"],"bad":1,"fix":"独立（別物）である","e":"満足の反対は不満足ではない、というのが二要因理論の核心。"},{"s":["ハーズバーグの理論において、達成・承認・仕事自体・責任・昇進は","衛生要因","に分類される。"],"bad":1,"fix":"動機づけ要因","e":"多くは職務内容に関連する。給与・対人関係・作業条件などが衛生要因。"},{"s":["動機づけ要因は","不満足を抑制する","が、モチベーションを促進しない。"],"bad":1,"fix":"モチベーションを促進する","e":"動機づけ要因＝満足を促進するが不満足は抑制しない／衛生要因＝不満足を抑制するがモチベーションは促進しない。逆に書かれやすい。"},{"s":["衛生要因は","組織側が提供すべき最低条件","であり、それすらないと駄目だが、充実させても大きな効果は望めない。"],"bad":-1,"fix":"","e":"動機づけ要因はあるほど良い条件、衛生要因は最低限の条件、という整理。"},{"s":["デシの内発的動機づけ理論では、賞罰に依存せず自分自身の内面から湧きあがる意欲や関心に基づくモチベーションを扱い、関係する欲求は","有能さへの欲求と自己決定の欲求","である。"],"bad":-1,"fix":"","e":"有能感＝職務環境との相互作用において効果的であると感じること。自己決定＝自分で計画立案・実行・目的達成ができていると感じること。"},{"s":["金銭的報酬が内発的動機づけを阻害することを","エンハンシング効果","という。"],"bad":1,"fix":"アンダーマイニング効果","e":"阻害＝アンダーマイニング、促進＝エンハンシング。逆に書かれやすい。"},{"s":["言語的報酬が内発的動機づけを促進することを","エンハンシング効果","という。"],"bad":-1,"fix":"","e":"アンダーマイニング効果と対で覚える。"}]},{"k":"2","title":"第2章 モチベーション（過程理論）","qs":[{"s":["ローラーが定式化した期待モデルは M ＝（E→P）×Σ（P→O）×V であり、Vは","努力への期待","を表す。"],"bad":1,"fix":"報酬の価値（誘意性）","e":"E→P が努力への期待。V は誘意性（報酬の価値）。"},{"s":["ローラーの期待モデルにおけるΣ記号は、","報酬が単一である","ことを示している。"],"bad":1,"fix":"報酬が複数あり、各々に異なる誘意性がある","e":"だからΣで合計する。"},{"s":["ローラーは、ブルームが「V」と一括していた心理的過程を","（E→P）とVに分解","して精緻化した。"],"bad":1,"fix":"（P→O）とVに分解","e":"分解されたのは（P→O）＝道具性とV＝誘意性。"},{"s":["アトキンソンの達成動機理論の式は M ＝ E × V であり、ただし E ＋ V ＝","0.5","という制約がある。"],"bad":1,"fix":"1.0","e":"EとVの和が1.0なので、Eが高いほどVは低くなる（簡単な課題ほど達成の価値は低い）。"},{"s":["アトキンソンによれば、達成動機の強い人は","極端に困難度の低い","仕事に動機づけられる。"],"bad":1,"fix":"程良い困難度（主観的確率が五分五分）の","e":"M＝E×VでE＋V＝1.0なので、E＝V＝0.5のとき積が最大になる。"},{"s":["アトキンソンによれば、回避動機が強い人は、","程良い困難度の課題","を指向する。"],"bad":1,"fix":"極端に困難度の低い課題か極端に困難度の高い課題","e":"程良い困難度を好むのは達成動機の強い人。回避動機が強い人は両極端を選ぶ。"},{"s":["バンデューラの自己効力感のうち、学業的自己効力感や進路選択自己効力感のように特定領域固有の自信を","特性的自己効力感","という。"],"bad":1,"fix":"課題特殊的自己効力感","e":"一般的な自信が特性的自己効力感（generalized）、領域固有が課題特殊的（task-specific）。"},{"s":["自己効力感の理論において、ある行動がどのような結果に至るかという予期を","効力予期","という。"],"bad":1,"fix":"結果予期","e":"人→行動が効力予期、行動→結果が結果予期。"},{"s":["自己効力感に作用する情報源のうち、他者がその課題を遂行する行為を観察すること（モデリング）を","言語的説得","という。"],"bad":1,"fix":"代理的経験","e":"遂行行動の達成・代理的経験・言語的説得・生理的情動的状態・感情の高揚・想像的体験の6つ。"},{"s":["自己効力感に作用する情報源のうち、最も強力とされるのは自分が実際に課題を遂行し「やって出来た」という成功体験を持つ","遂行行動の達成","である。"],"bad":-1,"fix":"","e":"実体験にもとづくため最も効果が大きい。"},{"s":["ロック＆レイサムの目標設定理論では、","設定された目標","によりモチベーションが生起していくプロセスを説明する。"],"bad":-1,"fix":"","e":"目標設定への参加→困難度・具体性→自己効力感→行動→成果、という流れ。"},{"s":["モチベーションを高める目標の性質として、目標が","容易に達成可能な低水準","であることが挙げられる。"],"bad":1,"fix":"達成困難で高水準","e":"困難度・具体性・受容（コミットメント）・フィードバックの4つ。"},{"s":["目標設定理論において「ベストを尽くせ！」というような漠然とした目標設定より具体的であることを","目標の具体性","という。"],"bad":-1,"fix":"","e":"goal specificity。困難度（goal difficulty）と対で覚える。"},{"s":["目標設定理論では、期待理論と同様に、目標の困難度が高いほどパフォーマンスは","低下する","と予測する。"],"bad":1,"fix":"上昇する","e":"期待理論は困難度が上がるとパフォーマンス低下、達成モチベーション理論は中程度が最高、目標設定理論は困難なほど高い。この3理論の不整合が講義で問われる。"}]},{"k":"3","title":"第3章 組織コミットメント","qs":[{"s":["組織コミットメントの下位次元のうち、「その組織に居続けたいと思うために居続ける」側面を描写するものを","功利的コミットメント","という。"],"bad":1,"fix":"情緒的コミットメント","e":"「居続けたい」＝情緒的。情動的・感情的コミットメントも同義。下位に同一化と愛着がある。"},{"s":["「その組織に居続ける必要があるために居続ける」という損得勘定にもとづく次元を","功利的コミットメント","という。"],"bad":-1,"fix":"","e":"打算的・計算的・道具的・継続的・存続的も同義。下位に対価と投資（サイド・ベット）がある。"},{"s":["「打算的」「計算的」「道具的」「継続的」「存続的」コミットメントは、いずれも","情緒的コミットメント","と同義である。"],"bad":1,"fix":"功利的コミットメント","e":"これらはすべて功利的コミットメントの言い換え。情緒的と混同させる問題が作られやすい。"},{"s":["「その組織に居続けるべきと考えるために居続ける」側面を描写する次元を","功利的コミットメント","という。"],"bad":1,"fix":"規範的コミットメント","e":"「べき」＝規範的。義務感・忠誠心にもとづく。情緒的・功利的と合わせて3次元。"},{"s":["組織コミットメントの下位次元は、情緒的・功利的の","2つ","である。"],"bad":1,"fix":"規範的を加えた3つ","e":"「居続けたい」情緒的／「居続ける必要がある」功利的／「居続けるべき」規範的、の3つ。"},{"s":["情緒的コミットメントの下位要素は、組織の目標や価値観と自分の価値観を同一とする「同一化」と、組織の仲間や職場それ自体が好きである「","対価","」である。"],"bad":1,"fix":"愛着","e":"対価は功利的コミットメントの下位要素。"},{"s":["組織に投資してきた結果、離れると失うものが生じることを","サイド・ベット（side-bet、付属的賭け）","という。"],"bad":-1,"fix":"","e":"功利的コミットメントの下位要素「投資」にあたる。"},{"s":["功利的コミットメントと情緒的コミットメントは、","どちらが先でどちらが後かが明確に決まっている","。"],"bad":1,"fix":"どちらが先かは一概に言えない","e":"一方が他方を 正に行動するよう動機づける影響力。"}]},{"k":"7","title":"第7章 組織的公正","qs":[{"s":["アダムスの衡平理論は、企業の従業員が","労働時間","に対して示す反応を説明するために展開された理論である。"],"bad":1,"fix":"給与","e":"モチベーションの過程理論に分類される。"},{"s":["衡平理論では、個人が組織に提供するインプット（学歴・知能・経験・技能・年齢）と、組織から提供されるアウトカム（賃金・内的報酬・職位・特権）が、それぞれ","客観的に測定","される。"],"bad":1,"fix":"主観的に価値づけ","e":"主観的な価値づけである点が重要。だから同じ待遇でも人によって不公平と感じ方が異なる。"},{"s":["衡平理論では、人は自分のインプットとアウトカムの比を","過去の自分","と比較する。"],"bad":1,"fix":"他人","e":"他人のインプットとアウトカムの比と比較する。比較の結果が平等でないとき、不平等を解消するよう動機づけられる。"},{"s":["アダムスのモデルにおいて、自分の比が他者より小さい場合（過少報酬）、人は","満足する","。"],"bad":1,"fix":"過少報酬が解消されるような行動に動機づけられる","e":"満足するのは両者が等しい場合。過多報酬なら罪の意識を感じる。"},{"s":["過多報酬時の不衡平解消行動として、仕事の生産性や質の向上によってインプットを","減少させる","ことが挙げられる。"],"bad":1,"fix":"増加させる","e":"過多報酬なら自分のインプットを増やしてバランスを取る。過少報酬なら生産制限などインプットを減らす。"},{"s":["分配原理のうち、高い貢献をなしえた人が高いアウトカムを得る原理を","平等原理","といい、成果主義的人事の基本原理である。"],"bad":1,"fix":"衡平原理","e":"平等原理は貢献や必要性と関係なく一律に分配する原理で、年功主義的人事の背後にある。"},{"s":["分配原理のうち、貢献や必要性とは関係なく一律に分配する原理を","必要性原理","という。"],"bad":1,"fix":"平等原理","e":"必要性原理は必要性の高い人から順に高いアウトカムを得る原理。平等原理と必要性原理は年功主義的人事の背後にある原理。"},{"s":["分配原理は衡平・必要性・平等の","3つのみ","である。"],"bad":1,"fix":"3つに労力原理と独占原理を加えた5つ","e":"労力原理＝努力した人ほど高いアウトカムを得る原理、独占原理＝最も高い業績を上げた者に全てを与える原理。「3つ＋2」と講義ノートに書かれている。"},{"s":["分配原理のうち、最も高い業績を上げた者に全てを与える原理を","独占原理","という。"],"bad":-1,"fix":"","e":"5つ目の分配原理。労力原理とセットで覚える。"},{"s":["限られた資源や成果を分配する場合に要求される過程（プロセス）の公正を","分配的公正","という。"],"bad":1,"fix":"手続き的公正","e":"分配的公正は結果の公正、手続き的公正は過程の公正。"},{"s":["レヴェンサル（1980）の公正判断理論は、人が分配手続きを公正なものと判断する基準を","3つ","に整理した。"],"bad":1,"fix":"6つ","e":"一貫性・偏向の抑制・情報の正確性・修正可能性・代表性・倫理性の6つ。"},{"s":["レヴェンサルの6基準のうち、意思決定者が利己心や偏見に影響されていないかを問うものを","一貫性","という。"],"bad":1,"fix":"偏向の抑制","e":"一貫性は、組織メンバーに偏り無く適用されるルールが一定期間保持されているかどうか。"},{"s":["レヴェンサルの6基準のうち、決定過程に修正の機会が用意されていることを","修正可能性","という。"],"bad":-1,"fix":"","e":"代表性は手続きの影響を受ける人々の関心や価値観が反映されていること、倫理性は一般的な道徳や倫理基準に反しないこと。"},{"s":["組織的公正の新しい次元のうち、対人関係におけるコミュニケーションの公正、上司から部下に対する偏りのない態度・行動を","情報的公正","という。"],"bad":1,"fix":"相互作用的公正（対人的公正）","e":"情報的公正は、管理者が適切な説明を行ったか、重要な情報を伝達してくれたかといった情報に関わる公正。"},{"s":["組織的公正が個人に与える影響として、リストラ実施時の","抵抗コスト","を削減する（対象者の選定がフェアだと理解されやすい）ことが挙げられる。"],"bad":-1,"fix":"","e":"雇用調整の円滑な実施につながる。"},{"s":["組織的公正を巡る現代的課題として、公正の基準・感覚は","固定的","であり、短期間で観察できるとされる。"],"bad":1,"fix":"流動的","e":"経営者の考え方や能力、景気動向、政府方針、技術水準などの複雑な総体に左右されるため、社会動向とリンクし長いレンジで観察する必要がある。"}]},{"k":"8","title":"第8章 組織市民行動（OCB）","qs":[{"s":["組織市民行動（OCB）とは、","職務記述書に明記された義務的な職務行動","である。"],"bad":1,"fix":"仕事の一部ではないが組織のためになる自発的な行動","e":"組織にプラス、報酬なし、自発的であることがポイント。"},{"s":["OCBの下位次元のうち、困難に直面したメンバーを支援することを","誠実さ","という。"],"bad":1,"fix":"愛他主義","e":"誠実さは要求以上のことをしようとすること。"},{"s":["OCBの下位次元のうち、不平不満を軽く出さないことを","公衆道徳","という。"],"bad":1,"fix":"スポーツマン精神","e":"公衆道徳は責任をもって参加すること（会議への参加・発表）。"},{"s":["OCBの下位次元は、愛他主義・誠実さ・スポーツマン精神・丁重さ・","攻撃性","の5つである。"],"bad":1,"fix":"公衆道徳","e":"公衆道徳（civic virtue）。攻撃性は誤り。"},{"s":["OCBの効果として、販売実績にはスポーツマン精神と公衆道徳が、生産効率・品質には","愛他主義","が正の影響を与える。"],"bad":1,"fix":"誠実さ","e":"顧客満足度に正の影響を与えるのが愛他主義。"},{"s":["職務記述書で担当者が明記されない「落ちこぼれ仕事」の存在は","日本企業にのみ見られ、欧米的企業では発生しない","。"],"bad":1,"fix":"日本企業に顕著だが、欧米的企業でも発生する","e":"この隙間を埋めるものとしてOCBが位置づけられる。"},{"s":["OCBが組織パフォーマンスを高める理由のうち、メンバー間の人間関係を良好に保ち問題発生時の対処が容易になることを","リテンション効果","という。"],"bad":1,"fix":"調整効果","e":"リテンション効果はメンバーを組織に引き留める働きやすい環境の提供。"},{"s":["OCBの規定因として、情緒的コミットメントが高いほどOCBは","低下する","。"],"bad":1,"fix":"上昇する","e":"職務満足感・組織コミットメント・リーダーシップ・組織的公正がOCBを高める。"},{"s":["OCBの規定因として、","分配的公正","が高いほど組織市民行動が高まる。"],"bad":1,"fix":"手続き的公正","e":"手続き的公正↑→組織市民行動↑。さらに組織的公正が職務満足を高める経路もある。"},{"s":["OCBを促進するマネジメントのうち、構造を読み解き状況に上手く対処できる知識を","宣言的知識","という。"],"bad":1,"fix":"手続き的知識","e":"宣言的知識は客観的で確定的な認識内容に関わる知識（言葉で説明できる知識）。役割外行動には手続き的知識の育成がより重要。"},{"s":["OCBのダークサイドとして、行き過ぎたOCBは","本来の役割が疎かになる","リスクがある。"],"bad":-1,"fix":"","e":"基本的な職務設計の粗雑さも背景にある。"},{"s":["OCBのダークサイドとして、スポーツマン精神の弊害は","変革が必要なときに沈黙を守る","危険性である。"],"bad":-1,"fix":"","e":"不平不満を出さないことが、必要な問題提起まで抑えてしまう。"},{"s":["OCBのダークサイドとして、うわべだけの組織市民行動を","ジョブクリープ","といい、組織パフォーマンスの低下につながる。"],"bad":1,"fix":"印象操作","e":"ジョブクリープは自発的行為が当然視され、正式な仕事になってしまうこと。"},{"s":["OCBのダークサイドとして、","職務の相互依存性","の低い職場ではOCBが機能しにくい。"],"bad":-1,"fix":"","e":"仕事と仕事の重なり合いが小さいと、そもそも助け合う余地がない。"},{"s":["OCBのダークサイドとして、","嫌な人","ほど期待されると「自発」を強調する雰囲気が高業績者に不満をもたらす。"],"bad":1,"fix":"良い人","e":"良い人ほどOCBを期待され、負担が集中する。"}]}];

const S={};let cur=0,wrongOnly=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  LEC.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'');
    let done=0;for(let q=0;q<l.qs.length;q++)if(S[i+'_'+q])done++;
    if(done===l.qs.length)b.className+=' done';
    b.textContent='第'+l.k+'章';
    b.onclick=()=>{cur=i;wrongOnly=false;rb();render();};
    el.appendChild(b);
  });
}
function rb(){document.getElementById('ba').style.display='none';document.getElementById('bw').style.display='';}
function render(){
  tabs();
  const l=LEC[cur],m=document.getElementById('main');
  let h='<h2>'+l.title+'</h2>',shown=0;
  l.qs.forEach((q,qi)=>{
    const k=cur+'_'+qi,st=S[k];
    if(wrongOnly&&(!st||st.ok))return;
    shown++;
    h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">Q'+(qi+1)+'</span><span class="sent">';
    q.s.forEach((seg,si)=>{
      if(seg==='・'){h+='・';return;}
      let cls='seg';
      if(st){
        cls+=' locked';
        if(si===q.bad)cls+=' isbad';
        else if(si===st.pick)cls+=' wrongpick';
      }
      h+='<span class="'+cls+'" data-q="'+qi+'" data-s="'+si+'">'+esc(seg)+'</span>';
    });
    h+='</span></div>';
    if(!st){
      h+='<div class="act"><span class="hint">誤りだと思う箇所をクリック、または</span><button class="none" data-none="'+qi+'">誤りなし</button></div>';
    }else{
      if(q.bad===-1)h+='<div class="fix">この文に<b>誤りはありません</b>。</div>';
      else h+='<div class="fix">正しくは <b>'+esc(q.fix)+'</b></div>';
      h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'正解':'不正解')+'</b>　'+esc(q.e)+'</div>';
    }
    h+='</div>';
  });
  if(!shown)h+='<div class="msg">この章に間違えた問題はありません。</div>';
  m.innerHTML=h;bind();stats();
}
function bind(){
  document.querySelectorAll('.seg').forEach(el=>{
    const qi=+el.dataset.q,si=+el.dataset.s,k=cur+'_'+qi;
    if(S[k])return;
    el.onclick=()=>{S[k]={pick:si,ok:si===LEC[cur].qs[qi].bad};save();render();};
  });
  document.querySelectorAll('[data-none]').forEach(b=>{
    const qi=+b.dataset.none,k=cur+'_'+qi;
    b.onclick=()=>{S[k]={pick:-1,ok:LEC[cur].qs[qi].bad===-1};save();render();};
  });
}
function stats(){
  const l=LEC[cur];let d=0,o=0;
  l.qs.forEach((q,qi)=>{const st=S[cur+'_'+qi];if(st){d++;if(st.ok)o++;}});
  document.getElementById('s1').textContent=d+' / '+l.qs.length;
  document.getElementById('s2').textContent=o;
  document.getElementById('s3').textContent=d-o;
  document.getElementById('s4').textContent=d?Math.round(o/d*100)+'%':'—';
}
function save(){try{localStorage.setItem('obq',JSON.stringify(S));}catch(e){}}
function load(){try{const v=localStorage.getItem('obq');if(v)Object.assign(S,JSON.parse(v));}catch(e){}}
document.getElementById('bw').onclick=function(){wrongOnly=true;this.style.display='none';document.getElementById('ba').style.display='';render();};
document.getElementById('ba').onclick=function(){wrongOnly=false;this.style.display='none';document.getElementById('bw').style.display='';render();};
document.getElementById('br').onclick=function(){LEC[cur].qs.forEach((q,qi)=>delete S[cur+'_'+qi]);wrongOnly=false;rb();save();render();};
load();render();

</script></body></html>
