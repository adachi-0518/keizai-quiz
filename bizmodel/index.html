<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビジネスモデル論 | 試験対策クイズ</title>
<meta name="description" content="ビジネスモデルの基礎概念から9セル、ジョブ理論、利益の設計、デジタル時代の用語まで。用語を3行で説明する練習・4択・論述と事例の3モードがあります。">
<style>
:root{
 --bg:#fbfaf8;--card:#fff;--line:#e5e2da;--txt:#22211e;--sub:#6d6a63;--soft:#f4f2ed;
 --ok:#1d7a4f;--okbg:#e7f4ec;--ng:#b3312e;--ngbg:#fbeaea;
 --accent:#7a3f5d;--accentbg:#f5eaf0;--on:#fff;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#1a1917;--card:#242320;--line:#3a3833;--txt:#ecebe5;--sub:#a6a39b;--soft:#2c2b27;
 --ok:#6cc79a;--okbg:#1e3a2c;--ng:#e88a88;--ngbg:#3c2322;
 --accent:#d493b3;--accentbg:#33212b;--on:#161513;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);line-height:1.85;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 font-feature-settings:"palt"}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 60px}

/* ---- header ---- */
h1{font-size:22px;font-weight:600;margin:0 0 6px;line-height:1.45;letter-spacing:.01em}
.lead{color:var(--sub);font-size:13.5px;line-height:1.8;margin:0 0 4px}
.meta{font-size:12px;color:var(--sub);margin:6px 0 22px}
.meta b{color:var(--accent);font-weight:600}

/* ---- 共通パーツ ---- */
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{font-family:inherit;font-size:13px;line-height:1.5;padding:7px 14px;border-radius:99px;
 border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;transition:border-color .12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.chip small{font-size:10.5px;opacity:.62;margin-left:5px;font-weight:400}
.chip.on small{opacity:.8}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--card);flex-wrap:wrap}
.seg button{font-family:inherit;font-size:13.5px;padding:9px 18px;border:none;background:transparent;
 color:var(--sub);cursor:pointer;line-height:1.5;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600}
.modehint{font-size:12.5px;color:var(--sub);margin:-6px 0 16px;line-height:1.75}

/* ---- 進捗 ---- */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0 6px;font-size:12.5px;color:var(--sub)}
.hud .n{font-variant-numeric:tabular-nums}
.hud .ok{color:var(--ok);font-weight:600}
.hud .ng{color:var(--ng);font-weight:600}
.hud .sp{flex:1}
.track{height:5px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:20px}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

/* ---- 要点ノート ---- */
details.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
 border-radius:0 11px 11px 0;margin-bottom:16px;font-size:14px;line-height:1.85}
details.note>summary{cursor:pointer;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none}
details.note>summary::-webkit-details-marker{display:none}
details.note>summary::before{content:"▸ ";font-size:11px}
details.note[open]>summary::before{content:"▾ "}
.note .body{padding:0 15px 14px}
.note h3{margin:12px 0 5px;font-size:14px;font-weight:600}
.note h3:first-child{margin-top:0}
.note p{margin:5px 0}
.note ul{margin:5px 0;padding-left:20px}
.note li{margin-bottom:3px}
.note .kwlist{font-size:13px;color:var(--sub);background:var(--soft);border-radius:8px;padding:9px 12px;line-height:2}

/* ---- 問題カード ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;margin-bottom:14px}
.src{font-size:11.5px;color:var(--sub);margin:0 0 12px;letter-spacing:.02em}
.qtext{font-size:18px;line-height:1.95;margin:0 0 18px;font-weight:400}
.qtext .blank{display:inline-block;min-width:78px;border-bottom:2px solid var(--accent);
 background:var(--accentbg);border-radius:3px;padding:0 8px;text-align:center;color:transparent}
.qtext .blank.on{color:var(--ok);font-weight:600;background:var(--okbg);border-bottom-color:var(--ok);min-width:0}
u.bad{text-decoration:none;background:var(--ngbg);color:var(--ng);font-weight:600;
 border-bottom:2px solid var(--ng);border-radius:3px;padding:0 3px;
 -webkit-box-decoration-break:clone;box-decoration-break:clone}
.ask{font-size:13px;color:var(--sub);margin:0 0 11px}

.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
 font-family:inherit;font-size:15.5px;line-height:1.7;padding:13px 15px;
 border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--txt);cursor:pointer;transition:border-color .12s,background .12s}
.ch:hover{border-color:var(--accent)}
.ch i{flex-shrink:0;width:23px;height:23px;margin-top:2px;border-radius:7px;background:var(--soft);
 color:var(--sub);font-style:normal;font-size:12px;font-weight:600;
 display:flex;align-items:center;justify-content:center}
.ch.pick{border-color:var(--accent);background:var(--accentbg)}
.ch.pick i{background:var(--accent);color:var(--on)}
.ch.correct{border-color:var(--ok);background:var(--okbg)}
.ch.correct i{background:var(--ok);color:var(--on)}
.ch.miss{border-color:var(--ng);background:var(--ngbg)}
.ch.miss i{background:var(--ng);color:var(--on)}
.ch.none{color:var(--sub)}
.ch.none.correct,.ch.none.miss{color:var(--txt)}
.ch[disabled]{cursor:default}

/* ---- 判定・解説 ---- */
.verdict{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 13px;border-radius:99px;margin:18px 0 0}
.verdict.y{background:var(--okbg);color:var(--ok)}
.verdict.n{background:var(--ngbg);color:var(--ng)}
.fix{margin-top:11px;padding:12px 15px;background:var(--okbg);border-radius:10px;font-size:15.5px;line-height:1.8}
.fix b{color:var(--ok)}
.fix .lbl{font-size:12px;color:var(--sub);display:block;margin-bottom:1px}
.fix.long{font-size:14.5px;background:var(--soft)}
.fix.long b{color:var(--txt);font-weight:400}
.item .a.long b{color:var(--txt);font-weight:400}
.exp{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:13.5px;color:var(--sub);line-height:1.9}

/* ---- 操作ボタン ---- */
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:120px;font-family:inherit;font-size:14.5px;padding:12px 16px;border-radius:11px;
 border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;line-height:1.5}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.y{border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.n{border-color:var(--ng);color:var(--ng);font-weight:600}
.btn[disabled]{opacity:.38;cursor:default}
.btn[disabled]:hover{border-color:var(--line)}

.nav{display:flex;gap:9px;align-items:center;margin-top:4px}
.nav button{font-family:inherit;font-size:13.5px;padding:10px 18px;border-radius:10px;
 border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
.nav button:hover{border-color:var(--accent)}
.nav button[disabled]{opacity:.35;cursor:default}
.nav button[disabled]:hover{border-color:var(--line)}
.nav .sp{flex:1}

/* ---- 一覧ビュー ---- */
.lsec{margin:0 0 30px}
.lsec:first-child{margin-top:16px}
.lsec h2{font-size:15px;font-weight:600;margin:0 0 13px;padding-bottom:8px;border-bottom:2px solid var(--accent);line-height:1.55}
.item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.item.err{border-left:3px solid var(--ng)}
.item.clean{border-left:3px solid var(--ok)}
.item .s{font-size:15.5px;margin:0;line-height:1.9}
.item .a{margin:9px 0 0;font-size:15px;background:var(--okbg);border-radius:8px;padding:8px 12px;line-height:1.8}
.item .a b{color:var(--ok)}
.item .a .lbl{font-size:11.5px;color:var(--sub);margin-right:8px}
.item .note-ok{margin:8px 0 0;font-size:13px;color:var(--ok)}
.item .ex{margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.9}
body.hide .item .a,body.hide .item .ex,body.hide .item .note-ok{display:none}
body.hide .item .s u.bad{background:transparent;color:inherit;font-weight:400;border-bottom:none;padding:0}
body.hide .item .s .blank.on{color:transparent;background:var(--accentbg);border-bottom-color:var(--accent);min-width:78px}

/* ---- 読み物 ---- */
.doc{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:15px}
.doc h3{font-size:16.5px;margin:0 0 5px;line-height:1.6;font-weight:600}
.doc .why{font-size:13px;color:var(--sub);margin:0 0 13px;line-height:1.85}
.doc pre{background:var(--soft);border-radius:10px;padding:14px 15px;margin:0;
 font-size:13.5px;line-height:2;white-space:pre-wrap;font-family:inherit;overflow-x:auto}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.kw span{font-size:12px;padding:3px 10px;background:var(--accentbg);color:var(--accent);border-radius:99px;line-height:1.7}

/* ---- 結果 ---- */
.done{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center}
.done .big{font-size:38px;font-weight:600;line-height:1.3;margin:0;font-variant-numeric:tabular-nums}
.done .rate{font-size:14px;color:var(--sub);margin:4px 0 0}
.done .btns{margin-top:22px}

.empty{background:var(--soft);border-radius:11px;padding:16px 18px;font-size:14px;color:var(--sub);line-height:1.8}

/* ---- footer ---- */
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
 font-size:12px;color:var(--sub);line-height:1.9}
.foot .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.foot .tools button{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:99px;
 border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;line-height:1.5}
.foot .tools button:hover{border-color:var(--accent);color:var(--accent)}
.foot .tools button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.foot a{color:var(--accent)}
.keys{margin-top:10px;font-size:11.5px}
.keys kbd{display:inline-block;padding:1px 6px;margin:0 1px;border:1px solid var(--line);
 border-radius:4px;background:var(--card);font-family:inherit;font-size:11px}

@media(max-width:560px){
 .wrap{padding:20px 14px 50px}
 h1{font-size:19.5px}
 .card{padding:16px 15px 15px}
 .qtext{font-size:16.5px}
 .ch{font-size:15px;padding:12px 13px}
 .keys{display:none}
}

<div class="wrap">

<p class="meta"><b>用語63 ・ 4択50 ・ 論述7 ・ 事例7</b></p>
<div class="seg" id="modes"></div>
<p class="modehint" id="modehint"></p>

<script>var DECK={"slug":"bizmodel","defaultView":"quiz","modes":[{"id":"term","label":"用語を3行で","kind":"quiz","hint":"用語を見て説明を組み立て、「答えを見る」で模範解答と見比べて自己採点します。","sections":[{"label":"基礎","title":"1. ビジネスモデルの基礎概念","note":"","items":[{"ty":"recall","q":"「ビジネスモデル」を3行程度で説明しなさい。","a":"企業が一定の顧客に価値を提供し、同時に利益を得る仕組みのこと。顧客にも企業にも価値をもたらす「儲ける仕組み」であり、利害関係者に価値をもたらすストーリーでもある。ネットベンチャー最盛期を経て1997年頃から学術界でも使われるようになった語である。","e":"目的としての顧客価値／成果としての利益。「現時点で将来のビジネスをデザインする脳」とも表現される。"},{"ty":"recall","q":"「ビジネスモデルのゴール」を3行程度で説明しなさい。","a":"「顧客価値」と「利益」を同時に獲得することである。顧客を喜ばせるだけでは赤字になり事業が続かず、利益だけを追えば顧客が離れる。両方を同時に成り立たせる設計こそがビジネスモデルの目的である。","e":"顧客を喜ばせる→利益を上げる→事業が続く→会社を守る。赤字→事業は続かない→倒産。"},{"ty":"recall","q":"「支払意欲（WTP）」を3行程度で説明しなさい。","a":"顧客がその商品に対して払ってもよいと考える金額の上限のこと。WTPと価格の差が顧客の取り分（顧客価値）、価格とコストの差が企業の取り分（企業価値）となる。WTPを上げると双方の取り分が大きくなり win-win が成立する。","e":"価格がWTPを超えると売れない。価格がコストを下回るとダメ。WTPを上げること＝「熱狂させる」こと。"},{"ty":"recall","q":"「生み出された価値」を3行程度で説明しなさい。","a":"支払意欲（WTP）とコストの差のこと。この幅を価格が分割し、WTPと価格の間が顧客の取り分、価格とコストの間が企業の取り分になる。ビジネスモデルはこの幅そのものを広げることを目指す。","e":"WTP ─ 価格 ─ コスト の3点で図示できる。試験で図を描くならこれ。"},{"ty":"recall","q":"「熱狂」を3行程度で説明しなさい。","a":"支払意欲と機能が本来は正の相関にあるところ、その相関から大きく上方に乖離している状態のこと。機能から予想される以上にWTPが高い状態であり、良いビジネスモデルの証拠とされる。","e":"「支払意欲と機能は基本的には相関（正）。乖離しているものが熱狂的なもの＝良い方」"},{"ty":"recall","q":"「顧客価値提案（CVP）」を3行程度で説明しなさい。","a":"どんな顧客のどんな用事を、どのように解決するのかという提案のこと。「世界を変える」部分にあたり、ビジネスモデルの出発点となる。ここから利益創出（期待以上の利益）、プロセス構築（実現の手順）へとつながる。","e":"CVP ← 利益創出 ← プロセス構築、という順に設計する。"},{"ty":"recall","q":"「カスタマーサクセス」を3行程度で説明しなさい。","a":"顧客を成功させることで企業が利益を得るという考え方。ビジネスモデルの言い換えの一つであり、事業利益とは顧客の成功のことだと捉える。物やサービスを経て顧客に何かしらの喜びを与えることが利益の源泉になる。","e":"ビジネスモデルの5つの言い換えの③。試験でビジネスモデルを定義するときに使える。"},{"ty":"recall","q":"「ビジネスモデルの構成要素」を3行程度で説明しなさい。","a":"顧客価値・利益・プロセスの3つである。顧客価値提案が何を提供するかを、利益がどう儲けるかを、プロセスがどう実現するかを担う。この3つの関係を整理したものが9セル（3×3のフレーム）である。","e":"利益 ─ 顧客価値 の間にプロセスが入る三角の図でノートに描かれている。"},{"ty":"recall","q":"「理念から利益までの順番」を3行程度で説明しなさい。","a":"経営理念→経営戦略→ビジネスモデル→顧客価値→事業利益、の順に並ぶ。理想から現実へと具体化していく流れであり、ビジネスモデルはその中間で理想と現実をつなぐブースターの役割を果たす。","e":"「経営理念から利益までの距離は遠い」「定義どおりにパス運びをしないとビジネスはどこかで止まる」"}]},{"label":"9セル","title":"2. 9セルと分析フレーム","note":"","items":[{"ty":"recall","q":"「9セル（ビジネスモデル・キャンバス）」を3行程度で説明しなさい。","a":"顧客価値・利益・プロセスの3要素を、それぞれ Who・What・How の3つの問いで分解した3×3のフレームのこと。9つのセルを埋めることで、不足していることが分かり、要素間の一貫性をチェックできる。","e":"タテのつながりも見ることが重要。「裏にはセオリーが走っている（すでに知っていることとの親和性）」"},{"ty":"recall","q":"「顧客価値の行（9セルの①②③）」を3行程度で説明しなさい。","a":"①顧客は誰か（どんな性質をもつ人か）、②解決策として何を提供するか、③代替とはどのように違っているか、の3つ。①にはSTP、②③には4Cや3C分析といったマーケティングのセオリーが対応する。","e":"③の「代替との違い」がビジネスモデルの差別化の要になる。"},{"ty":"recall","q":"「利益の行（9セルの④⑤⑥）」を3行程度で説明しなさい。","a":"④誰が儲けるか、⑤何で儲けるか、⑥どのように回収するか、の3つ。⑥には利益パターン（フリーミアム等）が対応する。課金する相手・課金する対象・回収の時間軸をずらすことで多様な利益モデルが生まれる。","e":"売上と利益は別物。「課金したからといって利益があるわけではない」"},{"ty":"recall","q":"「プロセスの行（9セルの⑦⑧⑨）」を3行程度で説明しなさい。","a":"⑦誰が補完するか（誰と組んでいるか）、⑧強みは何か、⑨どのように提供するか、の3つ。⑧にはSWOT分析、⑨にはバリューチェーンやコストの検討が対応する。すべてを自社でやらない発想がここに入る。","e":"アウトソーシング・オープンイノベーションはこの行の話。"},{"ty":"recall","q":"「3C分析」を3行程度で説明しなさい。","a":"Company（自社）・Consumer（消費者＝使いたい人）・Competitor（競合）の3つの視点から事業環境を分析する枠組み。9セルでは顧客価値の行、特に「代替とはどう違うか」を検討する場面で用いられる。","e":"ノートでは Customer ではなく Consumer と書かれている。"},{"ty":"recall","q":"「マーケティングとビジネスモデルの違い」を3行程度で説明しなさい。","a":"「全体」をみるかみないかである。マーケティングは顧客への提供の部分を扱うのに対し、ビジネスモデルは顧客価値・利益・プロセスの全体のつながりを設計する。だから9セルではタテのつながりまで見る。","e":"日本企業はプロセス重視のためマーケティングが流行った、という文脈と結びつく。"}]},{"label":"ジョブ","title":"3. 顧客価値提案とジョブ理論","note":"","items":[{"ty":"recall","q":"「ジョブ理論（job to be done）」を3行程度で説明しなさい。","a":"ビジネスは顧客の「用事（ジョブ）」を解決するためにあるという考え方。人はモノを欲しがっているわけではなく、ある状況の中で用事の解決を望んでいる。商品やサービスはその解決のために「雇われる」存在にすぎない。","e":"そして必ず「未解決」がある。ここに新しいビジネスの余地が残る。"},{"ty":"recall","q":"「ターゲティングは「人」ではなく「状況」」を3行程度で説明しなさい。","a":"Whoを考えるときのコツ。属性で人を切るのではなく、どんな状況にある人がどんな進歩を望んでいるのかで切る。同じ人でも状況が変われば求めるものが変わるため、状況こそが顧客を規定する。","e":"ジョブ＝ニーズの「原因」、ニーズ＝その「結果」。原因のほうに着目する。"},{"ty":"recall","q":"「プログレス（進歩）」を3行程度で説明しなさい。","a":"顧客が特定の状況の中で目標や願望に向かって進もうとしている状態のこと。欲しいのはプロダクトではなくプログレスであり、私たちはみな「差分」を買っている。効率的に差分を生みだしてくれるかで企業は評価される。","e":"「プログレスがあれば、プロダクトなんていらない」"},{"ty":"recall","q":"「「ドリルより穴」」を3行程度で説明しなさい。","a":"顧客が欲しいのはドリルではなく穴であるという、ジョブ理論を象徴する例。ドリルを改良するのではなく「穴をどう開けるか」を考えれば、穴を開ける素材だけを開ける機械や、はじめから穴の開いたものを売るという発想が出てくる。","e":"顧客価値提案の革新的方法として、ジョブ・アップデート・ニーズ・「ドリルより穴」の4語をセットで使う。"},{"ty":"recall","q":"「ジョブとニーズの対応例」を3行程度で説明しなさい。","a":"「工事中に簡単かつ正確に穴を開けたい」に対してドリル、「授業参観で子供に自慢されたい」に対して美容室でのヘアセット、「職場の仲間との良好な関係を構築したい」に対して居酒屋、というように、ニーズの背後には必ず状況としてのジョブがある。","e":"他に、コラーゲン←美しくして若返りたい／運転免許←仲間との旅行の幅を広げる／サッカーボール←仲間よりうまくなりたい。"}]},{"label":"利益","title":"4. 利益の設計","note":"","items":[{"ty":"recall","q":"「売上と利益の違い」を3行程度で説明しなさい。","a":"売上はあっても利益がなければビジネスモデルとしてはアウトである。課金したからといって利益があるわけではなく、企業に求められるのは利益獲得である。見るべきはトップライン（売上）ではなくボトムライン（利益）である。","e":"9セルの利益の行が「誰から・何で・どのように」利益を得るのかを問うのはこのため。"},{"ty":"recall","q":"「営業利益」を3行程度で説明しなさい。","a":"売上からコストを差し引いたもの。分解すると、価格×数量から変動費と固定費を引いた額になる。9セルの⑥「どのように回収するか」を数値で表したものであり、ビジネスモデルの成否はここに表れる。","e":"〔売上〕－〔コスト〕＝〔営業利益〕／〔価格〕×〔数量〕－〔変動費〕－〔固定費〕＝〔営業利益〕"},{"ty":"recall","q":"「利益化の道筋（2³通りのロジック）」を3行程度で説明しなさい。","a":"誰から（プレイヤー）・何で（タイミング）・どう届けるか の3つの軸それぞれに、素直な選択（0＝保守）とズラした選択（1＝革新）があり、組み合わせると2の3乗＝8通りの利益パターンが成り立つという整理。","e":"0は素直に（保守）／1はズラしたスコープ（革新）。「誰から何でどう届けるかをズラしたらいける」"},{"ty":"recall","q":"「レーザーブレイド（利益パターン18）」を3行程度で説明しなさい。","a":"主要製品の利益の低さを、その製品専用の付属品で回収する利益モデル。本体を安く売り、消耗品や付属品で継続的に稼ぐ。専用品でなければ使えないというロックインが成立していることが前提となる。","e":"髭剃り本体と替刃の関係が語源。プリンタとインクも同型。"},{"ty":"recall","q":"「マッチメイキング（利益パターン26）」を3行程度で説明しなさい。","a":"売り手と買い手を引き合わせること自体を価値とし、そこから手数料などで利益を得るモデル。自ら商品を持たず、両者をつなぐ場を提供することで儲ける点に特徴がある。","e":"利益パターンの26番。自ら在庫を持たず場を提供することで儲ける、プラットフォーム型の基本形にあたる。"},{"ty":"recall","q":"「サブスクリプション」を3行程度で説明しなさい。","a":"定額課金によって継続的な収益（リカーリングレベニュー）を得るモデル。一度に回収せず投資回収を長期化させ、顧客との関係そのものを長期化させることを狙う。SaaSと組み合わせて用いられることが多い。","e":"リカーリングレベニュー（継続的な収益）と、長期的な顧客関係が対になる考え方。"},{"ty":"recall","q":"「ロックイン」を3行程度で説明しなさい。","a":"顧客が他の選択肢に乗り換えにくい状態をつくること。専用の付属品や独自規格、蓄積したデータなどによって成立する。レーザーブレイド型の利益モデルはこのロックインを前提として初めて機能する。","e":"レーザーブレイド型（本体を安く売り消耗品で稼ぐ）は、このロックインを前提として初めて成立する。"}]},{"label":"資源","title":"5. プロセス・資源・強み","note":"","items":[{"ty":"recall","q":"「強みと弱み（ビジネスモデル論での定義）」を3行程度で説明しなさい。","a":"顧客価値提案から必要な全体の活動を洗い出したうえで、その活動の中で機能する資源が強み、至らない資源が弱みである。一般的な長所短所ではなく、必要な活動を基準に定義される点に特徴がある。","e":"最重要項目なのに資源が足りないならば構築する。弱みは誰かに補ってもらう。"},{"ty":"recall","q":"「VRIO分析」を3行程度で説明しなさい。","a":"「違い」をもたらす資源を評価する4つの基準。Value（顧客に価値があるか）、Rarity（価値の源泉が希少か）、Inimitability（ライバルが模倣困難か）、Organization（VRIに適う資源を有効に活用できているか）の頭文字である。","e":"V・R・Iで資源そのものを評価し、Oでそれを使いこなせているかを評価する構造。"},{"ty":"recall","q":"「VRIOのR（希少性）のリサーチ」を3行程度で説明しなさい。","a":"他にどれだけの数の会社がその資源をもっているかを調べること。重要なのは業界内外を問わず調べること、そしてその資源を実際に顧客価値提案に活かしているかまで確認することである。","e":"持っているだけでは希少性は価値にならない。"},{"ty":"recall","q":"「VRIOのI（模倣困難性）のリサーチ」を3行程度で説明しなさい。","a":"いまから同じものを構築しようとしたらどれくらい時間がかかるかで判定する。最低2年以上かかるものでなければ強みにならない。また新技術（AI等）によって駆逐されないかも併せて検討する必要がある。","e":"「最低2年」という数字はノートに明記されている。試験で書ける具体的な基準。"},{"ty":"recall","q":"「違いと強みの関係」を3行程度で説明しなさい。","a":"違いは相手（ユーザー）が認識しているもの、強みは一度体験するとわかるもの。両者はリンクしているが、違いは外から分かるのに対して強みは認識されにくい。だから違いと強みの関係を明確にする必要がある。","e":"ビジネスモデルの見方の第3法則。「認知できる違い／違いを生み出す力」"},{"ty":"recall","q":"「垂直統合」を3行程度で説明しなさい。","a":"すべてを自分でやろうとすること。ビジネスモデル論ではこれと対照的に、すべてを自分でやらず、いかに自社の強みを活かすかが重視される。弱みの部分は補完してくれる相手に任せるという発想をとる。","e":"株主・銀行は「お金」で、消費者は「ハート」でつながる。"},{"ty":"recall","q":"「経済性・有効性・効率性」を3行程度で説明しなさい。","a":"誰にまかせるかを判断する3つの尺度。経済性はインプット、有効性はアウトプット、効率性はアウトプットをインプットで割った比率を見る。外部に任せるかどうかをこの3つで評価する。","e":"経済性＝input／有効性＝output／効率性＝o÷i。"},{"ty":"recall","q":"「資産構築編（組む相手の選び方）」を3行程度で説明しなさい。","a":"誰と組むかを考えるときの候補。理念を共有する相手、先行力・知識や知恵を持つ相手、研究者的な相手、メンターなどが挙げられる。自社に足りない資源を、関係によって補うという考え方である。","e":"ストレングスファインダーの言及もノートにある。"}]},{"label":"計画","title":"6. 事業計画との違い・ピボット","note":"","items":[{"ty":"recall","q":"「事業計画（の式）」を3行程度で説明しなさい。","a":"「顧客価値＋プロセス＝利益」という足し算で表される。顧客価値は企画、プロセスは実行体制、利益は採算評価にあたる。計画通りにビジネスを進めるための最適形であり、計画前提の考え方である。","e":"★試験の頻出。ビジネスモデルの式と必ずセットで覚える。"},{"ty":"recall","q":"「ビジネスモデル（の式）」を3行程度で説明しなさい。","a":"「（顧客価値×利益）×プロセス」という掛け算で表される。顧客価値は提案、利益は必要利益、プロセスは実行体制にあたる。新たなビジネスを生み出す思考法であり、変革前提の考え方である。","e":"掛け算だから、1つの構成要素を変えると全体の値が大きく変わる。だから多くの試行が大切になる。"},{"ty":"recall","q":"「事業計画とビジネスモデルの違い」を3行程度で説明しなさい。","a":"事業計画は足し算で計画前提、ビジネスモデルは掛け算で変革前提である。前者は計画通りに進める最適形を求めるのに対し、後者は何ができるか分からない中で何度も試行し、限りなく良い解答を見つけようとする。","e":"ビジネスモデルでは先に最低条件を決定し、それを満たす範囲でより良いものを決める。"},{"ty":"recall","q":"「ビジネスモデルは「仮説」である」を3行程度で説明しなさい。","a":"ビジネスモデルはビジネスの設計方針であり仮説にすぎない。したがってビジネスモデルに終わりはなく、検証後に裏付けをもとに拡大するか、プランBに移行するかを検討する。動きながら修正し最適な形を見つけていく。","e":"「当初のプラン通りに利益を得られることは少ない」"},{"ty":"recall","q":"「ピボット」を3行程度で説明しなさい。","a":"強みを残しながら方向転換して試行すること。当初の仮説が検証で否定されたとき、別の選択肢に移りながらも蓄積した強みは手放さない。リーンスタートアップの中で用いられる概念である。","e":"ピボット例＝Google。大学生の研究者向け検索サイト→無課金で一般開放→ライセンス課金→広告課金へ。"},{"ty":"recall","q":"「リーンスタートアップ」を3行程度で説明しなさい。","a":"小さく作って市場で検証し、その結果をもとに方向転換（ピボット）しながら事業を育てていく方法。当初の計画通りに利益が出ることは少ないという前提に立ち、失敗を許容して学習につなげる思考法をとる。","e":"デジタルの時代はスピードが大切なので、ある程度の出来でβ版（最新）を出すことで補う。"},{"ty":"recall","q":"「新しいビジネスが生まれにくい理由」を3行程度で説明しなさい。","a":"思考が硬直しているからである。ユーザーを喜ばせられなくなった以上に利益がついてこなくなるため、柔軟な発想と、失敗を許容して学習へとつなげる思考法が必要になる。批判されることは常識の範囲外であり、そこにイノベーションが生まれる余地がある。","e":"「完成しないビジネス」という言い方もノートにある。"},{"ty":"recall","q":"「プロセス重視の日本企業」を3行程度で説明しなさい。","a":"日本企業はプロセスを重視してきたため、マーケティングが流行したという指摘。とにかく真似がうまかったが、情報伝達の時間差がなくなると真似では生き残れなくなり、供給過多の中で選ばれるためにマーケティングが必要になった。","e":"まず顧客への価値提案を企画し、利益はあとからついてくるという発想。タイムマシン経営もこの文脈で語られる。"}]},{"label":"用語","title":"7. デジタル時代のビジネスモデル用語","note":"","items":[{"ty":"recall","q":"「デジタル時代のビジネスモデル用語群」を3行程度で説明しなさい。","a":"DX、サプライチェーン、クロスドッキング、ダイレクトモデル、JIT、SaaS、MaaS、ネットワークオーケストレーション、DtoCといった一連の用語群を指す。これらはすべてプロセス（どのように提供するか）の話である。","e":"いずれもプロセス（どのように提供するか）に関わる用語である点が共通している。"},{"ty":"recall","q":"「DX（デジタルトランスフォーメーション）」を3行程度で説明しなさい。","a":"プロセスをデジタル化することで、価値提供のあり方を劇的に変革すること。単なるIT化ではなく、ローコスト・ハイパフォーマンス・高収益を同時に実現する点に本質がある。","e":"9セルではプロセスの行に位置づく。"},{"ty":"recall","q":"「SaaS」を3行程度で説明しなさい。","a":"提供方法をデジタルに変えることで、継続的なアップデートを可能にするモデル。売り切りではなく提供し続ける形になるため、サブスクリプションによる課金と組み合わせて用いられることが多い。","e":"Software as a Service。ノートでは「提供方法をデジタル化に変え、アップデートを可能にし…」"},{"ty":"recall","q":"「MaaS」を3行程度で説明しなさい。","a":"移動サービスを統合的に提供する考え方。Loopの事例とともに「街を最適化する」ものとして語られる。個別の交通手段ではなく移動全体を一つのサービスとして設計する点に特徴がある。","e":"個別最適（交通手段ごと）から全体最適（移動そのもの）への転換。"},{"ty":"recall","q":"「JIT（ジャストインタイム／カンバン方式）」を3行程度で説明しなさい。","a":"必要なものを必要なときに必要なだけ供給する生産方式。在庫を持たないことでコストを下げる。サプライチェーンやクロスドッキングと並ぶ、プロセス側の代表的な仕組みである。","e":"トヨタ生産方式。ノートでは「JIT（カンバン方式）」と併記。"},{"ty":"recall","q":"「クロスドッキング」を3行程度で説明しなさい。","a":"入荷した商品を在庫として保管せず、そのまま仕分けて出荷する物流の仕組み。在庫を持たないことで保管コストと時間を圧縮する、プロセス側の効率化手法である。","e":"サプライチェーン、JITと同じ文脈で並べられている。"},{"ty":"recall","q":"「ダイレクトモデル」を3行程度で説明しなさい。","a":"中間流通を介さず、企業が顧客に直接届けるモデル。流通コストを削減できるうえ、顧客との接点を自社で持てるため顧客情報を蓄積できる。DtoCと同じ発想に立つ。","e":"DtoC＝direct to consumer。"},{"ty":"recall","q":"「ネットワークオーケストレーション」を3行程度で説明しなさい。","a":"自社ですべてを保有せず、外部の資源をネットワークとしてつなぎ、その全体を指揮することで価値を生むモデル。「すべてを自分でやらず、いかに強みを活かすか」というプロセス設計の考え方に対応する。","e":"垂直統合の対極にある発想。"},{"ty":"recall","q":"「破壊的イノベーション」を3行程度で説明しなさい。","a":"既存の製品の支払意欲を急激に低下させてしまう技術革新のこと。デジタルカメラがスマートフォンの登場によって支払意欲を大きく落としたのが典型例である。顧客価値提案だけでは不足であり、利益の創出まで考えなければならないことを示す。","e":"disrupt によってコスト・WTP・価格が同時に下がり、損失と顧客価値の双方に影響する。"}]},{"label":"理念","title":"8. 経営理念とピッチ","note":"","items":[{"ty":"recall","q":"「ミッション（Mission）」を3行程度で説明しなさい。","a":"企業が追い続ける社会への使命のこと。経営理念の中で最上位に置かれ、その企業が何のために存在するのかを示す。ビジョン・バリューとあわせて経営理念（MVV）を構成する。","e":"「経営は理念が最上位」"},{"ty":"recall","q":"「ビジョン（Vision）」を3行程度で説明しなさい。","a":"ミッションを達成するために企業が目指すべき姿のこと。同時に事業ドメインをも規定し、どこまでやるか・やらないかを決める働きをもつ。","e":"事業ドメインを規定する、という点が試験で問われうる。"},{"ty":"recall","q":"「バリュー（Value）」を3行程度で説明しなさい。","a":"企業が社会に約束する行動指針のこと。ミッション・ビジョンを日々の行動に落とし込む役割を担う。","e":"MVVの3つ目。"},{"ty":"recall","q":"「エレベーターピッチ」を3行程度で説明しなさい。","a":"短時間で事業を説明する3点セット。①どんな用事がある人を顧客にしたいか（ジョブ＝問題としていること）、②あなたの仕事はその何を解決するか（アップデート）、③他の解決策とどう違い、なぜ気にかける必要があるか（ライバルの設定）。","e":"VRIOのV（顧客価値）は、このピッチで確認できるとされている。"},{"ty":"recall","q":"「売り込みの3点」を3行程度で説明しなさい。","a":"①誰に（何を求めている人がいるのか）、②どのように解決するか（ソリューション）、③代替との違い、の3つ。相手の状況を把握し、何を求めていたかを掴み、どうやって解決するかを示す順で組み立てる。","e":"9セルの顧客価値の行（Who・What・How）と対応している。"}]},{"label":"見方","title":"9. ビジネスモデルの見方（5つの法則）","note":"","items":[{"ty":"recall","q":"「第1法則：いつ時点のビジネスか」を3行程度で説明しなさい。","a":"ビジネスモデルを見るときは、それがいつの時点のものかを確認せよという法則。同じ企業でも時期によってビジネスモデルは変わっているため、時点を固定しないと分析が成り立たない。","e":"When? に対応。"},{"ty":"recall","q":"「第2法則：ビジネスの単位を見極めよ」を3行程度で説明しなさい。","a":"プロダクトか、事業か、グループかを見極めよという法則。「顧客を喜ばせて利益をとる」までを一単位と考える。Google Map単体ではなく、そこから得た情報をGoogleの広告で儲けるところまでが一単位になる。","e":"Where? に対応。"},{"ty":"recall","q":"「事業単位」を3行程度で説明しなさい。","a":"顧客を喜ばせ、事業利益をだすことのできる組織単位のこと。必ずしも事業部とは一致せず、また必ずしも1社で完結するとは限らない。デジタル時代にはむしろほぼ一致しない。","e":"宿・交通を1括で予約するようなコラボでは、複数の事業部でひとつのビジネスモデルを形成する。プロダクトの垣根がない。"},{"ty":"recall","q":"「第3法則：違いと強みの関係を明確にせよ」を3行程度で説明しなさい。","a":"認知できる違いと、違いを生み出す力（強み）を区別し、その関係を明確にせよという法則。違いは顧客から見えるが強みは見えにくいため、両者を切り分けて考える必要がある。","e":"VRIO分析はこの第3法則を具体化する道具。"},{"ty":"recall","q":"「第4法則：全体のつながり」を3行程度で説明しなさい。","a":"9セルを個別に埋めるのではなく、要素間のつながり、とくにタテのつながりを見よという法則。顧客価値・利益・プロセスが一貫していなければビジネスモデルは機能しない。","e":"「マーケとビジネスモデルの違いは全体をみるかみないか」につながる。"},{"ty":"recall","q":"「第5法則：課金と利益は別」を3行程度で説明しなさい。","a":"課金（売上）が発生していることと、利益が出ていることは別だという法則。売上はあって利益なしはビジネスモデルとしてはアウトであり、見るべきはボトムラインである。","e":"9セルの利益の行を独立させている理由がこれ。"}]}]},{"id":"mc","label":"4択","kind":"quiz","hint":"","sections":[{"label":"4択","title":"4択50問（全範囲）","note":"","items":[{"ty":"mc","q":"ビジネスモデルという語が学術界でも使用されるようになったのは、およそ何年からか。","ch":[{"t":"1997年ごろ"},{"t":"1985年ごろ"},{"t":"2013年ごろ"},{"t":"2005年ごろ"}],"ans":0,"e":"ネットベンチャー最盛を経て1997年〜学術界でも使用されるようになった語。"},{"ty":"mc","q":"ビジネスモデルのゴールとして正しいものはどれか。","ch":[{"t":"コストの最小化"},{"t":"「顧客価値」と「利益」の同時獲得"},{"t":"売上の最大化"},{"t":"市場シェアの獲得"}],"ans":1,"e":"顧客を喜ばせるだけでは赤字、利益だけでは顧客が離れる。両立が目的。"},{"ty":"mc","q":"支払意欲(WTP)と価格の差にあたるのはどれか。","ch":[{"t":"企業の取り分（企業価値）"},{"t":"生み出された価値の総量"},{"t":"顧客の取り分（顧客価値）"},{"t":"変動費"}],"ans":2,"e":"WTP─価格＝顧客の取り分／価格─コスト＝企業の取り分。"},{"ty":"mc","q":"「熱狂的なもの」とはノートではどう説明されているか。","ch":[{"t":"価格が最も安いもの"},{"t":"支払意欲と機能の相関から乖離しているもの"},{"t":"機能が業界最高水準のもの"},{"t":"広告費を最も多く使ったもの"}],"ans":1,"e":"支払意欲と機能は基本的に正の相関。そこから上に乖離しているのが熱狂＝良い方。"},{"ty":"mc","q":"ビジネスモデルの構成要素3つの組み合わせとして正しいものはどれか。","ch":[{"t":"理念・戦略・戦術"},{"t":"ヒト・モノ・カネ"},{"t":"顧客価値・利益・プロセス"},{"t":"市場・製品・技術"}],"ans":2,"e":"この3つが9セルのタテ軸になる。"},{"ty":"mc","q":"9セルのヨコ軸（3つの問い）として正しいものはどれか。","ch":[{"t":"Plan・Do・See"},{"t":"Who・What・How"},{"t":"When・Where・Why"},{"t":"強み・弱み・機会"}],"ans":1,"e":"タテが顧客価値・利益・プロセス、ヨコが Who・What・How。"},{"ty":" l":"論述の骨格","title":"論述の骨格（7テーマ）","note":"","items":[{"ty":"read","h":"1. 事業計画とビジネスモデルの違いを説明しなさい","sub":"最頻出。式を2本書けば骨格が立つ。ノートに最も丁寧に書かれているテーマ。","body":"【序】いずれも顧客価値・プロセス・利益という同じ要素を使うが、\n　　　組み立て方と前提が異なる。\n\n【1】事業計画＝足し算・計画前提\n　　　顧客価値 ＋ プロセス ＝ 利益\n　　　（企画）　（実行体制）（採算評価）\n　　　→ 計画通りにビジネスを進める最適形を求める思考\n\n【2】ビジネスモデル＝掛け算・変革前提\n　　　（顧客価値 × 利益）× プロセス ＝ ？\n　　　（提案）　（必要利益）（実行体制）\n　　　→ 新たなビジネスを生み出す思考法\n\n【3】掛け算であることの帰結\n　　　1つの構成要素を変えると全体の値が大きく変わる\n　　　→ 何ができるか分からない。何度も試行し、限りなく良い解答を探す\n　　　→ 先に最低条件を決定し、それを満たす内でより良いものを決める\n\n【結】ビジネスモデルは設計方針であり「仮説」。ゆえに終わりがない。\n　　　検証後にプランBへ移行するか検討し、動きながら最適な形を見つける。","kw":["計画前提","変革前提","企画","実行体制","採算評価","必要利益","仮説","ピボット","リーンスタートアップ","最低条件"]},{"ty":"read","h":"2. 顧客価値提案の革新的方法について論じなさい","sub":"ノートに「論述」と明記されているテーマ。指定の4語を必ず使う。","body":"【序】人はモノを欲しがっているわけではない。\n　　　ある「状況」で「用事（ジョブ）」の解決を望んでいる。\n\n【1】ジョブ … job to be done\n　　　ニーズは結果、ジョブはその原因。原因のほうに着目する\n　　　ターゲティングは「人」ではなく「状況」\n　　　ex) 授業参観で子供に自慢されたい ← 美容室でのヘアセット\n\n【2】ニーズ … 具体的なプロダクトや機能として現れたもの\n　　　ジョブ（問いとした状況）→ ニーズ（具体的な機能）の向きを押さえる\n\n【3】「ドリルより穴」\n　　　ドリルを改良するのではなく「穴をどう開けるか」を考える\n　　　→ 穴を開ける素材のみを開ける機械／はじめから穴の開いたものを売る\n\n【4】アップデート … 欲しいのはプロダクトよりプログレス\n　　　わたしたちはみな「差分」を買っている\n　　　いかに効率的に差分を生みだしてくれるかで企業を評価する\n　　　プログレスがあれば、プロダクトなんていらない\n\n【結】顧客価値提案の革新とは、プロダクトの改良ではなく\n　　　ジョブの捉え直しによって解決の形そのものを変えることである。","kw":["ジョブ","job to be done","ニーズ","ドリルより穴","アップデート","プログレス","差分","状況","未解決","雇われる"]},{"ty":"read","h":"3. ビジネスモデルの見方（5つの法則）について述べなさい","sub":"ノートに2回登場する。番号を振って書けば分量が稼げる。","body":"【1】いつ時点のビジネスか（When?）\n　　　同じ企業でも時期でビジネスモデルは変わる。時点を固定する\n\n【2】ビジネスの単位を見極めよ（Where?）\n　　　プロダクト？ 事業？ グループ？\n　　　→「顧客を喜ばせて利益をとる」までを一単位\n　　　ex) Google Map単体ではなく、得た情報を広告で儲けるまでが一単位\n　　　事業単位＝顧客を喜ばせ事業利益を出せる組織単位\n　　　　(1)必ずしも事業部と一致しない (2)必ずしも1社で完結しない\n　　　　→ デジタル時代にはむしろほぼ一致しない\n\n【3】違いと強みの関係を明確にせよ\n　　　違い＝認知できるもの／強み＝違いを生み出す力\n　　　違いは分かるが、強みは認識されにくい\n\n【4】全体のつながり\n　　　9セルのタテのつながりも見る\n　　　マーケとビジネスモデルの違いは「全体」をみるかみないか\n\n【5】課金と利益は別\n　　　売上はあって利益なしはビジネスモデルとしてアウト\n　　　見るべきはトップラインではなくボトムライン","kw":["時点","事業単位","事業部","1社で完結しない","認知できる違い","違いを生み出す力","タテのつながり","課金","売上","ボトムライン"]},{"ty":"read","h":"4. 9セルを用いてビジネスモデルを分析する意義を論じなさい","sub":"講義の背骨。表を描いてから論じると速い。","body":"【序】9セル＝顧客価値・利益・プロセス × Who・What・How の3×3。\n\n【1】各セルの中身\n　　　顧客価値：①顧客は誰か(STP) ②何を提供するか ③代替との違い(3C・4C)\n　　　利益　　：④誰が儲けるか ⑤何で儲けるか ⑥どう回収するか(利益パターン)\n　　　プロセス：⑦誰が補完するか ⑧強みは何か(SWOT) ⑨どう提供するか(バリューチェーン)\n\n【2】意義その1：不足していることが分かる\n　　　埋まらないセルが、そのまま構築すべき資源や組むべき相手を示す\n\n【3】意義その2：一貫性をチェックできる\n　　　タテのつながりを見ることで、顧客価値・利益・プロセスの整合を確認できる\n\n【4】意義その3：裏にはセオリーが走っている\n　　　各セルに既存のフレーム（STP・3C・SWOT・バリューチェーン）が対応し、\n　　　すでに知っていることとの親和性が高い\n\n【結】マーケティングとの違いは「全体」をみるかみないか。\n　　　9セルは全体のつながりを可視化するための道具である。","kw":["Who","What","How","STP","3C分析","4C","SWOT分析","バリューチェーン","利益パターン","一貫性","タテのつながり"]},{"ty":"read","h":"5. VRIO分析について説明し、強みの評価について論じなさい","sub":"「最低2年」という数値基準が書けると強い。","body":"【序】VRIO＝「違い」をもたらす資源の評価基準。\n\n【1】V：Value 顧客に価値があるか\n　　　顧客価値提案はなにか（ピッチで確認できる）\n　　　顧客価値の Who-What-How で確認する\n\n【2】R：Rarity 価値の源泉は希少か\n　　　他にどれだけの数の会社がその資源をもっているか\n　　　業界内外を問わず調べる\n　　　それを顧客価値提案に活かしているか\n\n【3】I：Inimitability 模倣困難か\n　　　いまから構築しようとしたらどれくらい時間がかかるか\n　　　→ 最低2年以上かかるものでないと強みにならない\n　　　→ 新技術（AI等）で駆逐されないか\n\n【4】O：Organization VRIに適う資源を有効活用できているか\n\n【5】強みと弱みの定義\n　　　顧客価値提案から必要な全体の活動を明確にしたうえで、\n　　　その中で機能する資源が強み、至らない資源が弱み\n　　　→ 最重要項目なのに資源が足りないなら構築する\n　　　→ 弱みは誰かに補ってもらう\n\n【結】すべてを自分でやらず（＝垂直統合を避け）、\n　　　いかに強みを活かすかがプロセス設計の要になる。","kw":["Value","Rarity","Inimitability","Organization","最低2年","業界内外","顧客価値提案","強み","弱み","垂直統合","構築","補完"]},{"ty":"read","h":"6. 利益の作り方について、Who・What・Howの観点から論じなさい","sub":"営業利益の式と2³通りのロジックを両方入れる。","body":"【序】売上はあって利益なしは、ビジネスモデルとしてアウト。\n　　　課金したからといって利益があるわけではない。見るべきは利益。\n\n【1】利益の3つの問い\n　　　④誰が儲けるか（Who） ⑤何で儲けるか（What） ⑥どう回収するか（How）\n\n【2】営業利益の構造\n　　　〔売上〕－〔コスト〕＝〔営業利益〕\n　　　〔価格〕×〔数量〕－〔変動費〕－〔固定費〕＝〔営業利益〕\n\n【3】利益化の道筋＝2の3乗通りのロジック\n　　　プレイヤー／タイミング／届け方 の3軸それぞれに\n　　　0＝素直に（保守）／1＝ズラしたスコープ（革新）\n　　　→ 組み合わせで8通りの利益パターンが成り立つ\n\n【4】具体的なパターン\n　　　レーザーブレイド：主要製品の利益の低さを専用付属品でカバー（ロックイン前提）\n　　　マッチメイキング：売り手と買い手をつなぐこと自体で儲ける\n　　　サブスク：リカーリングレベニューで投資回収と顧客関係を長期化\n\n【結】利益を生み出すパターンは Who・What・How で全て説明できる。\n　　　誰から・何で・どう届けるかをズラすことが利益設計の本質である。","kw":["トップライン","ボトムライン","営業利益","変動費","固定費","2の3乗","保守","革新","レーザーブレイド","ロックイン","マッチメイキング","リカーリングレベニュー"]},{"ty":"read","h":"7. 破壊的イノベーションがビジネスモデルに与える影響を論じなさい","sub":"デジカメの例＋熱狂の図を組み合わせる。図を1つ描くと速い。","body":"【序】ビジネスモデルは WTP─価格─コスト の幅の上に成り立つ。\n\n【1】破壊的イノベーションが起きると何が下がるか\n　　　既存製品の支払意欲(WTP)が急激に低下する\n　　　ex) デジタルカメラはスマートフォンの登場によりWTPが急激に低下\n\n【2】何が起きるか\n　　　WTPが下がる → 顧客の取り分も企業の取り分も縮む\n　　　価格を維持すれば売れず、価格を下げればコストを下回り損失になる\n\n【3】結論\n　　　顧客価値提案だけでは不足である\n　　　利益の創出まで併せて考えなければならない\n\n【4】対応の方向\n　　　ビジネスモデルは「仮説」である以上、終わりはない\n　　　強みを残しながらピボットし、動きながら最適な形を見つける\n　　　ex) Google：研究者向け検索→無課金→ライセンス課金→広告課金\n\n【結】破壊的イノベーションは、顧客価値と利益を同時に設計し続けることの\n　　　必要性を示している。","kw":["支払意欲","WTP","disrupt","デジカメ","スマートフォン","顧客価値提案","利益の創出","仮説","ピボット","Google"]}]},{"label":"事例","title":"事例（7件）","note":"","items":[{"ty":"read","h":"チョコザップ ／ ライザップ","sub":"利益の設計（誰が儲けるかをズラす）／9セルの利益の行","body":"・圧倒的な低価格、普段着のままOK\n・なぜ変な顧客価値提案なのか → 主役はライザップ\n・チョコザップ会員に本格的な運動を提案する\n・チョコザップでは儲けない → ライザップにつなげる","kw":[]},{"ty":"read","h":"デジタルカメラ ／ スマートフォン","sub":"破壊的イノベーション／熱狂の図","body":"・デジカメはスマートフォンの登場により支払意欲が急激に低下\n・disrupt によりコスト・WTP・価格が下がる → 損失と顧客価値の双方に影響\n・⇒ 顧客価値提案だけでは不足。利益の創出を考えなければならない","kw":[]},{"ty":"read","h":"Google","sub":"ピボット／ビジネスの単位を見極めよ（第2法則）","body":"・大学生が研究者向けにつくった検索サイト\n・→ 無課金状態で一般開放\n・→ ライセンス課金（利益⑤）\n・→ 広告課金方法へ\n・また Google Map 単体ではなく、そこから得た情報を広告で儲けるまでが一単位","kw":[]},{"ty":"read","h":"Netflix","sub":"ジョブ理論（未解決のジョブ）／ピボット","body":"・レンタルビデオ店の「借りたいのに延滞料をとられる」という不満\n・2000年代、郵送レンタルの「借り放題」\n・そして必ず未解決がある\n・ケーブルで送れるようになる","kw":[]},{"ty":"read","h":"Apple","sub":"ロックイン／プロセスの設計","body":"・PCが開かない（ドライバー等では開けられない）\n・→ Apple でしか修理できない\n・→ 開けるとサインが残る","kw":[]},{"ty":"read","h":"兵庫県の匠工芸","sub":"ピボット／強みの活かし方／ジョブの発見","body":"・匠工芸 → プラスチック加工、看板、舞台美術\n・生活が満たされる、やりたいこととは何か\n・看板屋を軸にピボットする\n・武器は真似されるが、クオリティで差がつく\n・オリジナルも製作\n・コロナ下：魔法陣のパーテーション → 生活を少し楽しく → 一般人向けにも\n・無理な野望の持ち主。武器を聞く → プラスチック製 → コスプレイヤー向けのもの\n・「やりたいことを買いて食っていくには」儲け方を考える","kw":[]},{"ty":"read","h":"Loop ／ MaaS（7/27）","sub":"プロセス（しんがり）／サブスクの利益設計　★この回のノートに「事例がテストに書けるかもよ」とある","body":"・街を最適化する\n・DX：プロセスをデジタル化し、価値提供を劇的に変革\n　　　ローコスト・ハイパフォーマンス・高収益の実現\n・SaaS：提供方法をデジタルに変え、アップデートを可能にする\n・サブスク＝定額：リカーリングレベニュー／投資回収を長期化／顧客関係を長期化","kw":[]}]}]}]};</script>
<script>
/* 試験対策クイズ集 共通エンジン ------------------------------------------
   QUIZ(deck) で起動する。外部依存なし。
   1科目1ページの版でも、全科目を1ファイルにまとめた版でも同じものを使う。 */
var QUIZ = (function () {
  'use strict';

  var active = null;
  document.addEventListener('keydown', function (e) {
    if (active && active.onKey) active.onKey(e);
  });

  return function mount(DECK) {

  var $ = function (id) { return document.getElementById(id); };
  function E(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------------- 状態 ---------------- */
  var KEY = 'kq-' + DECK.slug;
  var S = {};          // 解答記録  "mode|sec|q" -> 1(正解) / 0(不正解)
  var mi = 0;          // 選択中のモード
  var sec = -1;        // 選択中の範囲（-1 = ぜんぶ）
  var view = DECK.defaultView || 'quiz';
  var only = false;    // ✕だけ
  var ix = 0;          // 出題リスト内の位置
  var list = [];       // [[secIndex, qIndex], ...]
  var st = null;       // 解答中の一時状態

  function mode() { return DECK.modes[mi]; }
  function sections() { return mode().sections; }
  function qkey(si, qi) { return mode().id + '|' + si + '|' + qi; }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ S: S, m: mi, v: view }));
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o.S) S = o.S;
      if (typeof o.m === 'number' && DECK.modes[o.m]) mi = o.m;
      if (o.v === 'quiz' || o.v === 'list') view = o.v;
    } catch (e) {}
  }

  /* ---------------- 出題リスト ---------------- */
  function build() {
    var out = [];
    sections().forEach(function (sc, si) {
      if (sec >= 0 && si !== sec) return;
      sc.items.forEach(function (it, qi) {
        if (only && S[qkey(si, qi)] !== 0) return;
        out.push([si, qi]);
      });
    });
    return out;
  }
  function wrongCount() {
    var n = 0;
    sections().forEach(function (sc, si) {
      sc.items.forEach(function (it, qi) { if (S[qkey(si, qi)] === 0) n++; });
    });
    return n;
  }
  function tally() {
    var done = 0, ok = 0;
    list.forEach(function (p) {
      var v = S[qkey(p[0], p[1])];
      if (v === 0 || v === 1) { done++; if (v === 1) ok++; }
    });
    return { done: done, ok: ok, total: list.length };
  }

  /* ---------------- 描画：ヘッダ周り ---------------- */
  function drawModes() {
    var el = $('modes'), hint = $('modehint');
    if (DECK.modes.length < 2) { el.style.display = 'none'; hint.style.display = 'none'; return; }
    el.innerHTML = DECK.modes.map(function (m, i) {
      return '<button data-m="' + i + '"' + (i === mi ? ' class="on"' : '') + '>' + E(m.label) + '</button>';
    }).join('');
    el.querySelectorAll('[data-m]').forEach(function (b) {
      b.onclick = function () { mi = +b.dataset.m; sec = -1; only = false; ix = 0; st = null; save(); draw(); window.scrollTo(0, 0); };
    });
    hint.textContent = mode().hint || '';
    hint.style.display = mode().hint ? '' : 'none';
  }

  function drawChips() {
    var el = $('chips');
    var scs = sections();
    if (scs.length < 2) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    var h = '<button class="chip' + (sec < 0 ? ' on' : '') + '" data-s="-1">ぜんぶ</button>';
    scs.forEach(function (sc, si) {
      h += '<button class="chip' + (si === sec ? ' on' : '') + '" data-s="' + si + '">' +
        E(sc.label || sc.title) + '<small>' + sc.items.length + '</small></button>';
    });
    el.innerHTML = h;
    el.querySelectorAll('[data-s]').forEach(function (b) {
      b.onclick = function () { sec = +b.dataset.s; ix = 0; st = null; draw(); window.scrollTo(0, 0); };
    });
  }

  function drawHud() {
    var t = tally();
    var hud = $('hud'), track = $('track');
    if (view === 'list' || mode().kind === 'read') { hud.style.display = 'none'; track.style.display = 'none'; return; }
    hud.style.display = ''; track.style.display = '';
    var pos = Math.min(ix + 1, t.total);
    hud.innerHTML = t.total
      ? '<span class="n">' + pos + ' / ' + t.total + ' 問</span><span class="sp"></span>' +
        '<span class="ok">○ ' + t.ok + '</span><span class="ng">✕ ' + (t.done - t.ok) + '</span>'
      : '';
    track.querySelector('i').style.width = (t.total ? Math.round(t.done / t.total * 100) : 0) + '%';
  }

  // 出題ビューでは「いま解いている範囲」のノートを出す（「ぜんぶ」でも問題に合わせて切り替わる）
  var noteAt = -1;
  function drawNote(si) {
    var el = $('note');
    var scs = sections();
    var at = (si === undefined || si < 0) ? sec : si;
    var note = (at >= 0 && scs[at] && scs[at].note) ? scs[at].note : '';
    if (!note || view === 'list') { el.innerHTML = ''; noteAt = -1; return; }
    if (noteAt === at) return; // 同じ範囲を解いている間は開閉状態を保つ
    noteAt = at;
    el.innerHTML = '<details class="note"><summary>要点ノート（' +
      E(scs[at].label || '') + '）</summary><div class="body">' + note + '</div></details>';
  }

  /* ---------------- 描画：本文 ---------------- */
  function draw() {
    if (sec >= sections().length) sec = -1;
    noteAt = -1;
    drawModes(); drawChips(); drawNote();
    list = build();
    if (ix >= list.length) ix = Math.max(list.length - 1, 0);
    document.body.classList.toggle('hide', false);
    if (view === 'list' || mode().kind === 'read') drawList(); else drawQuiz();
    drawHud(); drawFoot();
  }

  /* --- 出題ビュー --- */
  function drawQuiz() {
    var stage = $('stage'), nav = $('nav');
    if (!list.length) {
      stage.innerHTML = '<div class="empty">' +
        (only ? '間違えた問題はありません。' : 'この範囲に問題がありません。') + '</div>';
      nav.innerHTML = '';
      return;
    }
    if (ix >= list.length) return drawDone();

    var si = list[ix][0], qi = list[ix][1];
    var sc = sections()[si], it = sc.items[qi];
    drawNote(si);
    var rec = S[qkey(si, qi)];
    var mine = st && st.si === si && st.qi === qi ? st : null;
    var answered = (mine && mine.done) ? mine
      : (rec === 0 || rec === 1 ? { si: si, qi: qi, ok: rec === 1, pick: null, done: true } : null);
    var pending = (mine && !mine.done && mine.picks) ? mine.picks : [];
    var revealed = !!(mine && mine.reveal);

    var h = '<div class="card"><p class="src">' + E(sc.title) + '</p>';

    if (it.ty === 'wrong') {
      h += '<p class="qtext">' + sentence(it, !!answered) + '</p>';
      h += '<p class="ask">誤っているのはどれ？</p>' + choices(it, answered, pending);
    } else if (it.ty === 'mc') {
      h += '<p class="qtext">' + blanked(it.q, answered ? it.ch[it.ans].t : null) + '</p>' + choices(it, answered, pending);
    } else if (it.ty === 'ms') {
      h += '<p class="qtext">' + E(it.q) + '</p>';
      h += '<p class="ask">正しいものを2つ選んでください</p>' + choices(it, answered, pending);
    } else if (it.ty === 'recall') {
      h += '<p class="qtext">' + blanked(it.q, (answered || revealed) ? it.a : null) + '</p>';
      if (!answered && !revealed) {
        h += '<div class="btns"><button class="btn pri" data-act="reveal">答えを見る</button></div>' +
          '<p class="ask" style="margin:10px 0 0">まず頭のなかで答えてから押してください。</p>';
      } else {
        h += '<div class="fix' + (it.a.length > 40 ? ' long' : '') + '"><span class="lbl">答え</span><b>' + E(it.a) + '</b></div>';
        if (!answered) {
          h += '<div class="btns"><button class="btn y" data-mark="1">○ 言えた</button>' +
            '<button class="btn n" data-mark="0">✕ 言えなかった</button></div>';
        }
      }
    }

    if (answered) h += result(it, answered);
    h += '</div>';
    stage.innerHTML = h;

    nav.innerHTML = '<button data-go="-1"' + (ix === 0 ? ' disabled' : '') + '>← もどる</button>' +
      '<span class="sp"></span>' +
      '<button data-go="1" class="' + (answered ? 'pri' : '') + '">' +
      (ix === list.length - 1 ? '結果を見る' : 'つぎへ →') + '</button>';

    bindQuiz(it, si, qi, !!answered);
  }

  function sentence(it, reveal) {
    if (!reveal || it.badFrom < 0) return E(it.segs.join(''));
    // 誤り箇所は連続しているので、まとめて1つの <u> で囲む
    return E(it.segs.slice(0, it.badFrom).join('')) +
      '<u class="bad">' + E(it.segs.slice(it.badFrom, it.badTo + 1).join('')) + '</u>' +
      E(it.segs.slice(it.badTo + 1).join(''));
  }
  function blanked(q, fill) {
    var parts = String(q).split('（　）');
    if (parts.length < 2) return E(q);
    var b = fill === null || fill === undefined
      ? '<span class="blank">　　</span>'
      : '<span class="blank on">' + E(fill) + '</span>';
    return E(parts[0]) + b + E(parts.slice(1).join('（　）'));
  }

  function choices(it, answered, pending) {
    var multi = it.ty === 'ms';
    var picks = pending || [];
    var h = '<div class="choices">';
    it.ch.forEach(function (c, i) {
      var cls = 'ch' + (c.none ? ' none' : '');
      var mark = i + 1;
      if (answered) {
        var isAns = multi ? it.ans.indexOf(i) >= 0 : i === it.ans;
        var wasPicked = answered.picks ? answered.picks.indexOf(i) >= 0 : answered.pick === i;
        if (isAns) { cls += ' correct'; mark = '✓'; }
        else if (wasPicked) { cls += ' miss'; mark = '✕'; }
      } else if (picks.indexOf(i) >= 0) {
        cls += ' pick';
      }
      h += '<button class="' + cls + '" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' +
        '<i>' + mark + '</i><span>' + E(c.t) + '</span></button>';
    });
    h += '</div>';
    if (multi && !answered) {
      h += '<div class="btns"><button class="btn pri" data-act="grade"' +
        (picks.length === 2 ? '' : ' disabled') + '>答え合わせ</button></div>';
    }
    return h;
  }

  function result(it, a) {
    var h = '<div class="verdict ' + (a.ok ? 'y' : 'n') + '">' + (a.ok ? '正解' : '不正解') + '</div>';
    if (it.ty === 'wrong') {
      h += it.fix
        ? '<div class="fix"><span class="lbl">正しくは</span><b>' + E(it.fix) + '</b></div>'
        : '<div class="fix"><b>この文に誤りはありません。</b></div>';
    }
    if (it.e) h += '<div class="exp">' + E(it.e) + '</div>';
    return h;
  }

  function bindQuiz(it, si, qi, answered) {
    var stage = $('stage');
    stage.querySelectorAll('.ch').forEach(function (b) {
      if (answered) return;
      b.onclick = function () {
        var i = +b.dataset.i;
        if (it.ty === 'ms') {
          var picks = (st && st.si === si && st.qi === qi && !st.done && st.picks) ? st.picks.slice() : [];
          var at = picks.indexOf(i);
          if (at >= 0) picks.splice(at, 1);
          else if (picks.length < 2) picks.push(i);
          st = { si: si, qi: qi, picks: picks };
          drawQuiz();
        } else {
          grade(it, si, qi, [i]);
        }
      };
    });
    var act = stage.querySelector('[data-act="grade"]');
    if (act) act.onclick = function () { grade(it, si, qi, st.picks); };
    var rev = stage.querySelector('[data-act="reveal"]');
    if (rev) rev.onclick = function () { st = { si: si, qi: qi, reveal: true }; drawQuiz(); };
    stage.querySelectorAll('[data-mark]').forEach(function (b) {
      b.onclick = function () { grade(it, si, qi, null, +b.dataset.mark === 1); };
    });
    $('nav').querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () { step(+b.dataset.go); };
    });
  }

  function grade(it, si, qi, picks, selfOk) {
    var ok;
    if (it.ty === 'ms') {
      ok = picks.length === 2 && picks.every(function (p) { return it.ans.indexOf(p) >= 0; });
    } else if (it.ty === 'recall') {
      ok = !!selfOk;
    } else {
      ok = picks[0] === it.ans;
    }
    S[qkey(si, qi)] = ok ? 1 : 0;
    st = { si: si, qi: qi, ok: ok, pick: picks ? picks[0] : null, picks: picks || [], done: true };
    save();
    drawQuiz(); drawHud(); drawFoot();
  }

  function step(d) {
    var n = ix + d;
    if (n < 0) return;
    ix = n; st = null;
    if (ix >= list.length) { drawDone(); drawHud(); }
    else drawQuiz();
    drawHud();
    window.scrollTo(0, 0);
  }

  function drawDone() {
    $('note').innerHTML = ''; noteAt = -1;
    var t = tally();
    var rate = t.done ? Math.round(t.ok / t.done * 100) : 0;
    var wrong = wrongCount();
    var h = '<div class="done"><p class="big">' + t.ok + ' / ' + t.done + '</p>' +
      '<p class="rate">正答率 ' + rate + '％</p><div class="btns">';
    if (wrong) h += '<button class="btn pri" data-act="review">✕だった' + wrong + '問を復習</button>';
    h += '<button class="btn" data-act="restart">はじめから</button></div></div>';
    $('stage').innerHTML = h;
    $('nav').innerHTML = '<button data-go="-1">← もどる</button>';
    $('stage').querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.act === 'review') { only = true; sec = -1; }
        ix = 0; st = null; draw(); window.scrollTo(0, 0);
      };
    });
    $('nav').querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () { step(-1); };
    });
  }

  /* --- 一覧ビュー --- */
  function drawList() {
    var h = '';
    sections().forEach(function (sc, si) {
      if (sec >= 0 && si !== sec) return;
      h += '<div class="lsec"><h2>' + E(sc.title) + '</h2>';
      if (sc.note) h += '<details class="note" open><summary>要点ノート</summary><div class="body">' + sc.note + '</div></details>';
      sc.items.forEach(function (it) {
        if (it.ty === 'read') {
          h += '<div class="doc"><h3>' + E(it.h) + '</h3>' +
            (it.sub ? '<p class="why">' + E(it.sub) + '</p>' : '') +
            '<pre>' + E(it.body) + '</pre>' +
            (it.kw && it.kw.length ? '<div class="kw">' + it.kw.map(function (k) { return '<span>' + E(k) + '</span>'; }).join('') + '</div>' : '') +
            '</div>';
          return;
        }
        if (it.ty === 'wrong') {
          h += '<div class="item ' + (it.fix ? 'err' : 'clean') + '"><p class="s">' + sentence(it, true) + '</p>' +
            (it.fix
              ? '<p class="a"><span class="lbl">正しくは</span><b>' + E(it.fix) + '</b></p>'
              : '<p class="note-ok">✓ この文に誤りはありません</p>') +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        } else if (it.ty === 'recall') {
          h += '<div class="item"><p class="s">' + blanked(it.q, it.a) + '</p>' +
            (it.q.indexOf('（　）') < 0 ? '<p class="a' + (it.a.length > 40 ? ' long' : '') + '"><span class="lbl">答え</span><b>' + E(it.a) + '</b></p>' : '') +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        } else if (it.ty === 'ms') {
          h += '<div class="item"><p class="s">' + E(it.q) + '</p><p class="a"><span class="lbl">正しいもの</span><b>' +
            it.ans.map(function (i) { return E(it.ch[i].t); }).join('</b>／<b>') + '</b></p>' +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        } else {
          h += '<div class="item"><p class="s">' + blanked(it.q, it.ch[it.ans].t) + '</p>' +
            (it.q.indexOf('（　）') < 0 ? '<p class="a"><span class="lbl">答え</span><b>' + E(it.ch[it.ans].t) + '</b></p>' : '') +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        }
      });
      h += '</div>';
    });
    $('stage').innerHTML = h || '<div class="empty">表示できる項目がありません。</div>';
    $('nav').innerHTML = '';
  }

  /* ---------------- フッタの操作 ---------------- */
  function drawFoot() {
    var el = $('tools');
    var readOnly = mode().kind === 'read';
    var h = '';
    if (!readOnly) {
      h += '<button data-v="quiz" class="' + (view === 'quiz' ? 'on' : '') + '">1問ずつ解く</button>';
      h += '<button data-v="list" class="' + (view === 'list' ? 'on' : '') + '">一覧で読む</button>';
    }
    if (!readOnly && view === 'list') h += '<button data-act="hide">答えを隠す</button>';
    if (!readOnly && view === 'quiz') {
      var w = wrongCount();
      h += '<button data-act="only" class="' + (only ? 'on' : '') + '"' + (w || only ? '' : ' disabled') +
        '>✕だけ復習' + (w ? '（' + w + '）' : '') + '</button>';
      h += '<button data-act="reset">記録を消す</button>';
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () { view = b.dataset.v; only = false; ix = 0; st = null; save(); draw(); window.scrollTo(0, 0); };
    });
    el.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === 'only') { only = !only; if (only) sec = -1; ix = 0; st = null; draw(); window.scrollTo(0, 0); }
        else if (a === 'hide') {
          var on = document.body.classList.toggle('hide');
          b.textContent = on ? '答えを表示' : '答えを隠す';
          b.classList.toggle('on', on);
        } else if (a === 'reset') {
          if (!confirm('この' + mode().label + 'の解答記録を消します。よろしいですか？')) return;
          Object.keys(S).forEach(function (k) { if (k.indexOf(mode().id + '|') === 0) delete S[k]; });
          only = false; ix = 0; st = null; save(); draw();
        }
      };
    });
    $('keys').style.display = (view === 'quiz' && !readOnly) ? '' : 'none';
  }

  /* ---------------- キーボード ---------------- */
  function onKey(e) {
    if (view !== 'quiz' || mode().kind === 'read') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'Enter') { e.preventDefault(); step(1); return; }
    if (k === 'ArrowLeft') { e.preventDefault(); step(-1); return; }
    if (/^[1-9]$/.test(k)) {
      var btns = $('stage').querySelectorAll('.ch:not([disabled])');
      var i = +k - 1;
      if (btns[i]) { e.preventDefault(); btns[i].click(); }
      return;
    }
    if (k === ' ') {
      var b = $('stage').querySelector('[data-act="reveal"],[data-act="grade"]');
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  }

  /* ---------------- 起動 ---------------- */
  load();
  draw();
  active = { onKey: onKey };
  return active;

  };
})();

QUIZ(DECK);
</script>

<script id="dads-a11y">
(function(){
  'use strict';
  function all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
  function setButtonTypes(root){all('button',root).forEach(function(b){if(!b.hasAttribute('type'))b.type='button';});}
  function enhance(){
    var main=document.querySelector('.wrap')||document.body;
    if(!main.id)main.id='main-content';
    main.setAttribute('role','main');
    if(!document.querySelector('.dads-skip')){
      var skip=document.createElement('a');skip.className='dads-skip';skip.href='#'+main.id;skip.textContent='本文へ移動';
      document.body.insertBefore(skip,document.body.firstChild);
    }
    var h1=document.querySelector('h1');
    if(h1){if(!h1.id)h1.id='page-title';main.setAttribute('aria-labelledby',h1.id);}

    var modes=document.getElementById('modes');
    if(modes){
      modes.setAttribute('role','tablist');modes.setAttribute('aria-label','学習モード');
      all('button',modes).forEach(function(b,i){
        b.setAttribute('role','tab');b.setAttribute('aria-controls','stage');
        var on=b.classList.contains('on');b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;
      });
    }
    var chips=document.getElementById('chips');
    if(chips){chips.setAttribute('role','group');chips.setAttribute('aria-label','出題範囲');
      all('button',chips).forEach(function(b){b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false');});}
    var tools=document.getElementById('tools');
    if(tools){tools.setAttribute('role','group');tools.setAttribute('aria-label','表示と復習の設定');
      all('button.on',tools).forEach(function(b){b.setAttribute('aria-pressed','true');});}
    var hud=document.getElementById('hud');if(hud){hud.setAttribute('role','status');hud.setAttribute('aria-live','polite');}
    var stage=document.getElementById('stage');if(stage){stage.setAttribute('role','region');stage.setAttribute('aria-label','問題と解答');}
    var nav=document.getElementById('nav');if(nav){nav.setAttribute('aria-label','問題の移動');}
    var track=document.getElementById('track');
    if(track){
      var bar=track.querySelector('i'),pct=bar?parseFloat(bar.style.width)||0:0;
      track.setAttribute('role','progressbar');track.setAttribute('aria-label','学習の進捗');
      track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.setAttribute('aria-valuenow',String(Math.round(pct)));
    }
    all('.choices').forEach(function(c){c.setAttribute('role','group');c.setAttribute('aria-label','解答の選択肢');});
    all('.ch').forEach(function(b){
      b.setAttribute('aria-pressed',b.classList.contains('pick')?'true':'false');
      if(b.classList.contains('correct'))b.setAttribute('aria-label','正解: '+b.textContent.trim());
      if(b.classList.contains('miss'))b.setAttribute('aria-label','選択した不正解: '+b.textContent.trim());
    });
    all('details.note').forEach(function(d){var s=d.querySelector('summary');if(s)s.setAttribute('aria-label',(s.textContent||'要点ノート')+'を開閉');});
    setButtonTypes(document);
  }
  var queued=false;
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;enhance();});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){enhance();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','open']});});
  else{enhance();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','open']});}
})();
</script>
<!-- DADS-A11Y:END -->
