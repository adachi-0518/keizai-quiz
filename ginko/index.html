<div class="stat"><b id="s3" style="color:var(--ng)">0</b><span>不正解</span></div>

<p class="credit">学生が試験対策用に作成した学習ツールです。出題は一般的な学術概念にもとづき、独自の文章で作成しています。講義資料そのものの複製ではありません。誤りを見つけたら Issue でお知らせください。</p>

const S={};let cur=0,wrongOnly=false;
const ORD={},PICK={};
const TOTAL=LEC.reduce((a,l)=>a+l.qs.length,0);
const SK='gkq';
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function order(li,qi){
  const k=li+'_'+qi;
  if(!ORD[k]){const q=LEC[li].qs[qi];ORD[k]=shuf([{t:q.a,ok:1}].concat(q.d.map(t=>({t,ok:0}))));}
  return ORD[k];
}
function tabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  LEC.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'');
    let done=0;for(let q=0;q<l.qs.length;q++)if(S[i+'_'+q])done++;
    if(done===l.qs.length)b.className+=' done';
    b.innerHTML=esc(l.k)+'<small>'+done+'/'+l.qs.length+'</small>';
    b.onclick=()=>{cur=i;wrongOnly=false;rb();render();window.scrollTo(0,0);};
    el.appendChild(b);
  });
}
function rb(){document.getElementById('ba').style.display='none';document.getElementById('bw').style.display='';}
function render(){
  tabs();
  const l=LEC[cur],m=document.getElementById('main');
  let h='<h2>'+esc(l.title)+'</h2>';
  if(l.note&&!wrongOnly)h+=l.note;
  let shown=0;
  l.qs.forEach((q,qi)=>{
    const k=cur+'_'+qi,st=S[k];
    if(wrongOnly&&(!st||st.ok))return;
    shown++;
    h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">Q'+(qi+1)+'</span><span class="qt">'+esc(q.q)+'</span></div><div class="opts">';
    order(cur,qi).forEach((it,i)=>{
      let cls='o';
      if(st){if(it.ok)cls+=' c';else if(st.sel===i)cls+=' x';}
      const mk=st?(it.ok?'✓':(st.sel===i?'✕':(i+1))):(i+1);
      h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'"><i>'+mk+'</i><span>'+esc(it.t)+'</span></div>';
    });
    h+='</div>';
    if(!st)h+='<div class="act"><button data-check="'+qi+'">答え合わせ</button><span class="hint" data-cnt="'+qi+'"></span></div>';
    else h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'正解':'不正解')+'</b>　'+esc(q.e)+'</div>';
    h+='</div>';
  });
  if(!shown)h+='<div class="msg">この章に間違えた問題はありません。</div>';
  m.innerHTML=h;bind();stats();
}
function bind(){
  document.querySelectorAll('.o').forEach(el=>{
    const qi=+el.dataset.q,i=+el.dataset.i,k=cur+'_'+qi;
    if(S[k])return;
    el.onclick=()=>{PICK[k]=i;el.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
      const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='';};
  });
  document.querySelectorAll('[data-check]').forEach(b=>{
    const qi=+b.dataset.check,k=cur+'_'+qi;
    b.onclick=()=>{
      if(PICK[k]===undefined){const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='選択肢を選んでください';return;}
      S[k]={sel:PICK[k],ok:!!order(cur,qi)[PICK[k]].ok};save();render();
    };
  });
}
function stats(){
  const l=LEC[cur];let d=0,o=0;
  l.qs.forEach((q,qi)=>{const st=S[cur+'_'+qi];if(st){d++;if(st.ok)o++;}});
  document.getElementById('s1').textContent=d+' / '+l.qs.length;
  document.getElementById('s2').textContent=o;
  document.getElementById('s3').textContent=d-o;
  document.getElementById('s4').textContent=d?Math.round(o/d*100)+'%':'—';
  let ad=0,ao=0;
  LEC.forEach((L,li)=>L.qs.forEach((q,qi)=>{const st=S[li+'_'+qi];if(st){ad++;if(st.ok)ao++;}}));
  document.getElementById('pbar').style.width=Math.round(ad/TOTAL*100)+'%';
  document.getElementById('plab').textContent='全体の進捗 '+ad+' / '+TOTAL+' 問';
  document.getElementById('prate').textContent=ad?('正答率 '+Math.round(ao/ad*100)+'%'):'';
}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function load(){try{const v=localStorage.getItem(SK);if(v)Object.assign(S,JSON.parse(v));}catch(e){}}
document.getElementById('bw').onclick=function(){wrongOnly=true;this.style.display='none';document.getElementById('ba').style.display='';render();};
document.getElementById('ba').onclick=function(){wrongOnly=false;this.style.display='none';document.getElementById('bw').style.display='';render();};
document.getElementById('br').onclick=function(){LEC[cur].qs.forEach((q,qi)=>{delete S[cur+'_'+qi];delete PICK[cur+'_'+qi];delete ORD[cur+'_'+qi];});wrongOnly=false;rb();save();render();};
document.getElementById('brall').onclick=function(){
  if(!confirm('全ての解答記録を消します。よろしいですか？'))return;
  Object.keys(S).forEach(k=>delete S[k]);Object.keys(ORD).forEach(k=>delete ORD[k]);Object.keys(PICK).forEach(k=>delete PICK[k]);
  wrongOnly=false;rb();save();render();};
load();render();

</script></body></html>
