<style>

.hint{font-size:12px;color:var(--sub)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.msg{background:var(--accentbg);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7}
.credit{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);line-height:1.8}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.opts,.act,.ans,.exp{margin-left:0}.qt{font-size:15px}}

<script>
const LEC=[{"k":"1","title":"第1回 経営学説史の復習","qs":[{"q":"過去の経験や勘に頼って仕事の計画や標準を持たない管理を（　）管理という。テイラーはこれを批判した。","a":"成り行き","d":["科学的","経験的","放任"],"e":"成り行き管理＝計画も標準もない、行き当たりばったりの管理。テイラーの批判の出発点。"},{"q":"労働者が集団で申し合わせて生産量を抑えることを（　）という。","a":"組織的怠業","d":["同調圧力","自然的怠業","サボタージュ"],"e":"賃率を下げられないよう、集団で意図的に手を抜くこと。背景には同調圧力がある。"},{"q":"一流労働者の作業を要素分解し、最も効率的な方法と時間を測って課業を決める研究を（　）研究という（time motion study）。","a":"時間・動作","d":["作業能率","職務分析","動機づけ"],"e":"時間研究と動作研究の組み合わせ。これで「課業＝標準作業量」を確定する。"},{"q":"課業を達成した者には高い賃率、達成できない者には低い賃率を適用する制度を（　）という。","a":"差別的出来高給制","d":["時間給制","職能給制","年功賃金制"],"e":"アメとムチで課業達成を促す仕組み。背景に「経済合理人モデル」の人間観がある。"},{"q":"科学的管理法の3S（作業の合理化3原則）とは、単純化・（　）・専門化である。","a":"標準化","d":["組織化","効率化","分業化"],"e":"単純化(simplification)・標準化(standardization)・専門化(specialization)。"},{"q":"経営者は計画職能（管理職能）を、労働者は執行職能（作業職能）を担当するという考え方を（　）原理という。","a":"職能化","d":["分業","官僚制","専門化"],"e":"計画と執行の分離。労働者は意思決定をしない、という発想につながる。"},{"q":"科学的管理法は労働者を機械の部品のように扱うとして「（　）的人間観」と批判され、これが人間関係論を生む背景となった。","a":"機械論","d":["経済合理人","官僚制","功利主義"],"e":"機械論的人間観への反省が、次のホーソン実験・人間関係論につながる。"},{"q":"メイヨーやレスリスバーガーが参加した、シカゴ郊外の工場での一連の実験を（　）実験という。","a":"ホーソン","d":["継電器組立","ハーバード","モラール"],"e":"継電器組立実験室(1927〜1932)などの調査。人間関係論の出発点。"},{"q":"ホーソン実験で、生産性を高めた要因として注目された従業員の士気・やる気を（　）という（morale）。","a":"モラール","d":["モチベーション","コミットメント","エンゲージメント"],"e":"モラール＝集団の士気。個人の動機づけを指すモチベーションと区別する。"},{"q":"レスリスバーガーは組織を、制度上の公式組織と、自然発生的な（　）組織の2つに分類した。","a":"インフォーマル","d":["フォーマル","ライン","マトリクス"],"e":"インフォーマル（非公式）組織＝自然発生的な人間関係。公式組織だけを見る経営管理論を批判した。"},{"q":"公式組織は「（　）やコストの論理」で動くとされた。","a":"能率","d":["感情","人間関係","efficiency"],"e":"公式組織＝能率・コストの論理／非公式組織＝感情の論理。"},{"q":"テイラーの科学的管理法は、労働者を賃金という経済的誘因で動く存在とみなした。この人間観を「（　）モデル」という。","a":"経済合理人","d":["社会人","機械論","自己実現人"],"e":"経済合理人モデル。後の人間関係論では「社会人モデル」へと転換していく。"},{"q":"課業を決める際、労働者が達成すべき一日の正当な作業量を（　）という。","a":"標準作業量","d":["課業管理","差別的出来高","職務基準"],"e":"経営者が恣意的にこれを引き上げ、賃率を切り下げたことが組織的怠業の背景になった。"},{"q":"経営者は計画職能（管理職能）を、労働者は（　）職能（作業職能）を担当する。","a":"執行","d":["計画","管理","監督"],"e":"計画と執行の分離。労働者は意思決定をしないという発想につながる。"},{"q":"非公式組織は「（　）の論理」で動くとされ、公式組織の「能率やコストの論理」と対比される。","a":"感情","d":["能率","コスト","効率"],"e":"公式組織＝能率・コストの論理／非公式組織＝感情の論理。"},{"q":"生産性が向上したとき、経営者側が行っていた2つのこととは。1つは標準作業量の引き上げ、もう1つは何か。","a":"賃率の切り下げ","d":["賞与の廃止","労働時間の延長","人員の削減"],"e":"労働者が努力しても、賃率を切り下げられ標準作業量を引き上げられるので報われない。これが組織的怠業の原因になった。"},{"q":"頑張る同僚は迷惑な存在とされ、相互に頑張らないよう働く力を何というか。","a":"同調圧力","d":["集団凝集性","社会的手抜き","組織的怠業"],"e":"組織的怠業が生じる背景。集団の中で「出る杭は打たれる」状態になる。"},{"q":"科学的管理法の3つのSのうち、作業を単純な仕事に分解し、各仕事について最善の方法を確立することを何というか。","a":"単純化（simplification）","d":["標準化（standardization）","専門化（specialization）","体系化（systematization）"],"e":"3S＝単純化・標準化・専門化。単純化＝仕事を分解、標準化＝適用範囲を広げる、専門化＝適した人を選抜。"},{"q":"科学的管理法の3つのSのうち、分析された仕事を遂行するのに最も適した労働者を選抜することを何というか。","a":"専門化（specialization）","d":["単純化（simplification）","標準化（standardization）","分業化（division）"],"e":"3Sの3つ目。人を仕事に合わせて割り当てる考え方。"},{"q":"職能化原理において、経営者が担当するのは何職能か。","a":"計画職能（管理職能）","d":["執行職能（作業職能）","統制職能","調整職能"],"e":"経営者＝計画職能（管理職能）、労働者＝執行職能（作業職能）。これを「計画と執行の分離」という。"},{"q":"公式組織は「能率」と何の論理で動くとされるか。","a":"コスト","d":["感情","権威","慣習"],"e":"公式組織＝能率やコストの論理／非公式組織＝感情の論理。この対比が頻出。"},{"q":"人間関係論が想定した、社会的欲求の充足を重視する人間モデルを何というか。","a":"社会人モデル","d":["経済合理人モデル","機械人モデル","自己実現人モデル"],"e":"伝統的管理論の経済合理人モデル・機械人モデルに対置される。"},{"q":"人間関係論の人間観は何と言われるか。","a":"有機体論的人間観","d":["機械論的人間観","経済論的人間観","合理論的人間観"],"e":"科学的管理法＝機械論的人間観／人間関係論＝有機体論的人間観。この対比で覚える。"},{"q":"人間関係論は、後のリーダーシップ論やモチベーション論など、どの分野につながっていくか。","a":"組織行動論","d":["経営戦略論","管理過程論","官僚制組織論"],"e":"人間関係論 → 組織行動論・近代管理論という流れ。"},{"q":"「組織の高成果をもたらす唯一最善の組織は存在しない」とする理論を何というか。","a":"コンティンジェンシー理論","d":["管理過程論","官僚制組織論","科学的管理法"],"e":"contingency theory。状況に依存するという考え方。ファヨールの管理過程論、ウェーバーの官僚制組織論と並べて出題される。"},{"q":"人的資源マネジメントの役割のうち、人員の募集・採用から退職の世話に至るまでの一連の活動を何管理というか。","a":"雇用管理","d":["報酬管理","労使関係管理","モチベーション管理"],"e":"採用、処遇・配置・異動、労働時間管理、雇用調整、退職管理などを含む。"},{"q":"人的資源マネジメントの役割のうち、新入社員の教育から経営者育成教育までを含む活動を何と何というか。","a":"教育訓練・人材育成","d":["雇用管理・配置管理","報酬管理・評価管理","作業組織の設計・職務設計"],"e":"今日ではキャリア開発として具体的な制度が設計されている。"},{"q":"人的資源マネジメントの役割のうち、従業員のモラールを高め、高いモラールを維持するための諸方策を何管理というか。","a":"モチベーション管理","d":["雇用管理","報酬管理","労使関係管理"],"e":"④にあたる。⑤の報酬管理と混同しやすい。"},{"q":"人的資源マネジメントの役割のうち、報酬の与え方・決め方を工夫することでモチベーションや業績を高める諸方策を何管理というか。","a":"報酬管理","d":["モチベーション管理","雇用管理","福利厚生制度"],"e":"人事考課、処遇（昇進管理）、賃金管理を含む。"},{"q":"人的資源マネジメントの役割のうち、労働組合との団体交渉や労使協議制度の運営を何管理というか。","a":"労使関係管理","d":["雇用管理","報酬管理","モチベーション管理"],"e":"有名なのは「春闘」。⑦にあたる。"},{"q":"人的資源マネジメントの機能のうち、従業員を組織に引き留め、組織との一体感を高め、組織と個人のコンフリクトを少なくする機能を何というか。","a":"組織統合機能","d":["作業能率促進機能","変化適応機能","福利厚生機能"],"e":"理論的背景は組織行動論。3機能＝作業能率促進・組織統合・変化適応。"},{"q":"人的資源マネジメントの機能のうち、経営環境が変化した場合にその変化を吸収する機能を何というか。","a":"変化適応機能","d":["組織統合機能","作業能率促進機能","雇用調整機能"],"e":"非正規労働者の活用などが例として挙げられる。"},{"q":"人的資源マネジメントの機能のうち、個人やチームの生産性を高める機能の理論的背景となるものはどれか。","a":"テイラーの科学的管理法","d":["メイヨーの人間関係論","ウェーバーの官僚制組織論","ファヨールの管理過程論"],"e":"作業能率促進機能の背景。組織統合機能の背景が組織行動論であるのと対で押さえる。"}]},{"k":"2","title":"第2回 日本企業の採用","qs":[{"q":"アベグレン『日本の経営』(1958)を受け、OECD対日労働報告書が示した「日本的経営の（　）」とは、年功序列・終身雇用・企業別組合を指す。","a":"三種の神器","d":["三本柱","三大特徴","三原則"],"e":"アベグレン1958年、OECD報告書は邦訳1972年。"},{"q":"組合員資格が企業内の正規従業員に限定される労働組合を（　）という。欧米の横断的な職業別労働組合と対比される。","a":"企業別組合","d":["職業別組合","産業別組合","混合組合"],"e":"日本＝企業の中に組合がある／欧米＝企業の外に職業別に組織される。"},{"q":"企業単位で新卒を一括して定期採用し、入社後に各部署へ配置する方式を（　）という。","a":"新卒一括定期採用","d":["部門別採用","職種別採用","通年採用"],"e":"海外や外資系では部門別採用が多い、という対比で覚える。"},{"q":"入社時の配属先を経理・法務・企画など専門性の高い職種に予め限定して採用する方式を（　）採用という。","a":"職種別","d":["事業所別","地域限定","縁故"],"e":"職種別（部門別）採用。その分野のプロとして採る。"},{"q":"本社が一括採用するのではなく、事業所ごと・支店ごとに採用する方式を（　）採用という。","a":"事業所別","d":["職種別","地域限定","本社"],"e":"原則として事業所間の異動がないため、仕事の幅や昇進が限定される。"},{"q":"勤務地や勤務時間、職種の条件を限定して契約した正社員を（　）正社員（エリア限定正社員）という。","a":"地域限定","d":["事業所別","限定","専門職"],"e":"転居を伴う転勤がないタイプの正社員区分。"},{"q":"従業員の家族や親戚など、何らかのかかわりがある人物を採用することを（　）採用という（俗に言うコネ入社）。","a":"縁故","d":["リファラル","アルムナイ","内部"],"e":"知人紹介による採用はリファラル(referral)採用、退職者の再雇用はアルムナイ(alumni)採用。"},{"q":"一度退職した元従業員を再び採用することを（　）採用という（alumni）。","a":"アルムナイ","d":["リファラル","縁故","出戻り"],"e":"alumni＝卒業生・同窓生。退職者ネットワークからの再雇用。"},{"q":"学生が在学中に企業で就業体験をする制度を企業（　）制度という。目的は企業と学生のマッチングとリアリティショックの回避。","a":"インターンシップ","d":["トライアル","OJT","メンタリング"],"e":"リアリティショック＝入社前の期待と入社後の現実のギャップによる衝撃。"}]},{"k":"3","title":"第3回 日本企業の評価制度","qs":[{"q":"組織に属している従業員の貢献を秩序的・体系的に決定する手続きを（　）という。日常業務を通じて上司が部下を評価する仕組み。","a":"人事考課","d":["査定","人事評価","業績評価"],"e":"人事考課＝評価する手続きそのもの。"},{"q":"考課期間の仕事について、目標の達成度を対象として評価するものを（　）考課という（業績評価）。","a":"成績","d":["情意","能力","業績"],"e":"成績考課＝Performance Appraisal。何を達成したか。"},{"q":"勤務態度や意欲、企業が重視する価値観の体現度を評価するものを（　）考課という。","a":"情意","d":["成績","能力","態度"],"e":"情意＝意欲・態度の面。成果に結びつくよう能力発揮したかを見る。"},{"q":"知識・技能、判断力、企画力、折衝力、指導力などを評価するものを（　）考課という（能力評定）。","a":"能力","d":["成績","情意","適性"],"e":"成績・情意・能力の3考課をセットで押さえる。"},{"q":"ある一つの優れた（劣った）特徴に引きずられて、他の項目まで同じ方向に評価してしまう誤差を（　）効果という。","a":"ハロー","d":["寛大化","中心化","対比"],"e":"halo effect＝後光効果。全体印象に引きずられる。"},{"q":"評価が全体的に甘くなりがちな傾向を（　）効果といい、その逆を厳格化傾向という。","a":"寛大（寛容）","d":["中心化","ハロー","逆算化"],"e":"寛大化↔厳格化のペアで覚える。"},{"q":"評価が中央付近に集中し、優劣の差がつかなくなる傾向を（　）傾向という。","a":"中心化","d":["寛大化","厳格化","平均化"],"e":"「どちらとも言えない」に逃げてしまうエラー。"},{"q":"インプットに対する評価は（　）的要素、スループットに対する評価は仕事的要素と呼ばれる。","a":"属人","d":["仕事","成果","客観"],"e":"インプット＝能力・個人特性（属人的）／スループット＝職務行動（仕事的）／アウトプット＝業績。"},{"q":"本来は独立した別々の特性を、一貫性を気にするあまり関連づけて評価してしまう誤差を（　）という。","a":"論理誤差","d":["対比誤差","ハロー効果","中心化傾向"],"e":"「体育会で部活動をやっていたから忍耐力があるはずだ」など。ハロー効果は「明確な根拠のない論理誤差」の一形態ともいわれる。"},{"q":"評価者が自分の能力や価値観、行動スタイルを基準に評価してしまう誤差を（　）という。","a":"対比誤差","d":["論理誤差","逆算化傾向","寛大化効果"],"e":"自分の得意なことには厳しく、苦手なことは甘く評価してしまう。絶対評価で起きやすい。"},{"q":"先に全体の評価結果を決め、それに沿うように個別評価をしてしまうエラーを（　）傾向という。","a":"逆算化","d":["論理誤差","中心化","対比"],"e":"結論が先にあり、辻褄を合わせる形で個々の評価をつけてしまう。"},{"q":"人事評価の結果は従業員の行動を変える力を持つ。これを表す言葉が「（　）」である。","a":"評価される方向に人は動く","d":["人は感情で動く","評価は公正であるべき","制度が人を選ぶ"],"e":"評価制度が企業文化を形成し、組織行動を変化させるという考え方。"},{"q":"人事考課を行う際、人事部門が担う役割を表す言葉はどれか。","a":"人事参謀","d":["人事考課者","人事管理者","人事担当者"],"e":"（1）人事考課（人事評価）＝組織に属している従業員の組織に対する貢献を秩序的・体系的に決定する手続き。"},{"q":"社員の仕事ぶりに関する評価のことで、昭和のころまでよく用いられていた語は何か。","a":"査定","d":["考課","評定","審査"],"e":"人事考課とほぼ同義だが、やや古い言い方。"},{"q":"人事考課の目的のうち、昇進・昇格・昇給・賞与などを決定するものはどれか。","a":"報酬・処遇の決定","d":["配置・異動の決定","人材育成","動機付け"],"e":"①にあたる。人事考課の目的は①報酬・処遇②配置・異動③人材育成④動機付け⑤企業文化の表明など。"},{"q":"人事考課の目的のうち、従業員各人の適性を把握するために行うものはどれか。","a":"配置・異動の決定","d":["報酬・処遇の決定","人材育成","企業文化の表明"],"e":"②にあたる。誰をどこに置くかを決めるための評価。"},{"q":"人事考課の目的のうち、どのような分野の能力を開発すべきかを判断するものはどれか。","a":"人材育成（能力開発）","d":["報酬・処遇の決定","配置・異動の決定","動機付け"],"e":"③にあたる。評価を育成につなげる観点。"},{"q":"人事考課の目的のうち、従業員のモチベーションを高めることを何というか。","a":"動機付け","d":["人材育成","報酬・処遇の決定","企業文化の表明"],"e":"⑤にあたる。評価そのものが動機付けの手段になる。"},{"q":"人事考課の目的のうち、⑥にあたる「組織が何を大切にしているか」を示すものはどれか。","a":"企業文化や価値観の表明","d":["報酬・処遇の決定","配置・異動の決定","動機付け"],"e":"何を評価するかが、その組織の価値観を従業員に伝える。「評価される方向に人は動く」。"},{"q":"人事評価における能力は、顕在能力と何に分けられるか。","a":"潜在能力","d":["実効能力","基礎能力","専門能力"],"e":"ability, capability。顕在能力（発揮能力）と潜在能力（保有能力）の対。"},{"q":"インプットに対する評価は何的要素と呼ばれるか。","a":"顕在的要素","d":["仕事的要素","属人的要素","成果的要素"],"e":"インプット＝能力・個人特性（traits：責任感、判断力、積極性、協調性）。"},{"q":"スループットに対する評価は何的要素と呼ばれるか。","a":"仕事的要素","d":["顕在的要素","属人的要素","成果的要素"],"e":"スループット＝情意（労働意欲・努力）。インプット→スループット→アウトプットの3段階で評価対象を整理する。"},{"q":"評価のエラーの総称として用いられる語はどれか。","a":"認知バイアス","d":["認知的不協和","帰属エラー","評価誤差"],"e":"ハロー効果、寛大化傾向、中心化傾向などの総称。"},{"q":"寛大化傾向と対になる、実際よりも低く評価してしまう傾向を何というか。","a":"厳格化傾向","d":["中心化傾向","対比誤差","逆算化傾向"],"e":"寛大（寛容）化＝甘く、厳格化＝辛く。人事評価は一般に甘くなりがちとされる。"},{"q":"評価時期に近い業績や事柄に評価が影響を受けてしまうエラーを何というか。","a":"直近（遠近）効果","d":["ハロー効果","相似効果","中心化傾向"],"e":"⑦にあたる。期末の出来事に引きずられる誤り。"},{"q":"価値観や出身地（出身校）など、評価者と類似・共通する被評価者を良く評価してしまうエラーを何というか。","a":"相似効果","d":["ハロー効果","対比誤差","逆算化傾向"],"e":"⑧にあたる。自分と似た人を高く評価してしまう。"},{"q":"ワイナーの帰属理論において、内部属性かつ安定的な要因はどれか。","a":"能力","d":["努力","課題困難度","運"],"e":"内部×安定＝能力／内部×不安定＝努力／外部×安定＝課題困難度／外部×不安定＝運。この4象限で覚える。"},{"q":"ワイナーの帰属理論において、外部属性かつ安定的な要因はどれか。","a":"課題困難度","d":["能力","努力","運"],"e":"課題の難しさは自分の外にあり、かつ変動しにくい。"},{"q":"ワイナーの帰属理論において、内部属性かつ変動しやすい要因はどれか。","a":"努力","d":["能力","課題困難度","運"],"e":"努力は自分次第で、そのつど変わりうる。"},{"q":"ワイナーの帰属理論において、外部属性かつ変動しやすい要因はどれか。","a":"運","d":["能力","努力","課題困難度"],"e":"運は自分の外にあり、かつ変動する。4象限のうち唯一のこの組み合わせ。"},{"q":"ケリーの帰属の3基準のうち、「同じような状況に直面した人も同じ対応をとるかどうか」を見るものはどれか。","a":"合意（一致）性","d":["弁別性","一貫性","安定性"],"e":"consensus。他の人も同じ行動をとるなら状況（外的）要因が強い。"},{"q":"ケリーの帰属の3基準のうち、「状況が異なれば、その人は別の行動をとるかどうか」を見るものはどれか。","a":"弁別性","d":["合意（一致）性","一貫性","安定性"],"e":"distinctiveness。状況によって行動が変わるなら外的要因が強い。"},{"q":"ケリーの帰属の3基準のうち、「その人はいつも同じように対応しているかどうか」を見るものはどれか。","a":"一貫性","d":["合意（一致）性","弁別性","安定性"],"e":"consistency。3基準＝合意性・弁別性・一貫性。"},{"q":"事象の原因を行為者の要因に帰属させることを何というか。","a":"内的帰属","d":["外的帰属","自己帰属","状況帰属"],"e":"内的帰属＝行為者の要因／外的帰属＝環境要因。ワイナーでいえば外的は課題の難しさや運。"},{"q":"事象の原因を環境要因に帰属させることを何というか。","a":"外的帰属","d":["内的帰属","他者帰属","特性帰属"],"e":"内的・外的の対で覚える。"},{"q":"ロッター（1966）が示した「統制の所在」を英語で何というか。","a":"ローカス・オブ・コントロール","d":["セルフ・エフィカシー","アトリビューション","コンピテンシー"],"e":"Locus of control。出来事を自分の内側／外側どちらの統制と捉えるか。"},{"q":"目標管理制度の目的のうち、③にあたる「従業員の何を高め、成果の確実性を高めること」か。","a":"自主性・自立性","d":["協調性・social skill","忠誠心・帰属意識","専門性・技能"],"e":"目標を自分で立てさせることで主体性を引き出す。"},{"q":"目標管理制度において、上司と話し合う機会を増やすことで促進されるものは何か。","a":"コミュニケーション","d":["モチベーション","エンゲージメント","コンピテンシー"],"e":"⑤にあたる。面談を通じた対話そのものに意味がある。"},{"q":"上司・部下・同僚・顧客などの人々から評価を受ける方法を何というか。","a":"360度フィードバック（多面評価法）","d":["目標管理制度","コンピテンシー評価","人事考課"],"e":"多面的観察評価法ともいう。主に個人の能力開発を目的とする。"},{"q":"360度フィードバックの評価者に、上司・部下・同僚のほかに含まれうるのは誰か。","a":"顧客","d":["株主","取引銀行","監査法人"],"e":"社外の視点も含めた多面的な評価という点が特徴。"},{"q":"ある職務または状況に対し、基準に照らして効果的あるいは卓越した業績を生む原因となる特性を何というか。","a":"コンピテンシー","d":["エンプロイアビリティ","ケイパビリティ","アビリティ"],"e":"高業績者の行動特性。能力そのものではなく「成果につながる行動」に着目する。"},{"q":"組織的公正の2側面のうち、限られた資源や成果を分配する場合に要求される結果の公正を何というか。","a":"分配的公正","d":["手続き的公正","相互作用的公正","情報的公正"],"e":"分配的公正＝結果の公正／手続き的公正＝過程の公正。"},{"q":"ドイッチュの3つの分配原理のうち、経済的生産性に対応し、高い貢献をした人が高いアウトカムを得る分配方法はどれか。","a":"衡平（equity）分配","d":["平等（equality）分配","必要性（need）分配","均等分配"],"e":"Deutsch（1975）。衡平・平等・必要性の3つ。"},{"q":"ドイッチュの3つの分配原理のうち、親和的社会関係に対応し、成果を貢献した人数で均等に割る分配方法はどれか。","a":"平等（equality）分配","d":["衡平（equity）分配","必要性（need）分配","貢献度分配"],"e":"あたまわり・割り勘のイメージ。「均等」ではなく「平等」が正しい語。"},{"q":"ドイッチュの3つの分配原理のうち、福祉や個人の成長に対応し、必要性の高い人から順に高いアウトカムを得る分配方法はどれか。","a":"必要性（need）分配","d":["衡平（equity）分配","平等（equality）分配","救済分配"],"e":"3原理は衡平・平等・必要性。対応する価値（経済的生産性・親和的社会関係・福祉）とセットで押さえる。"},{"q":"アダムス（1963）が提唱した理論を何というか。","a":"公平（衡平）理論","d":["期待理論","目標設定理論","認知的不協和理論"],"e":"自分と他者のインプット／アウトカム比を比較する理論。過程理論に分類される。"},{"q":"組織的公正の2側面のうち、意思決定過程つまり手続きの公正を何というか。","a":"手続き的公正","d":["分配的公正","結果的公正","対人的公正"],"e":"分配的公正（結果）との対比で覚える。"},{"q":"レヴェンサルの手続き的公正6ルールのうち、「一定期間は変更されない手続きか」を問うものはどれか。","a":"一貫性","d":["バイアスの抑制","情報の正確性","代表性"],"e":"Leventhal（1980）。①一貫性②バイアスの抑制③情報の正確性④修正可能性⑤代表性⑥倫理性。"},{"q":"レヴェンサルの6ルールのうち、「意思決定者が偏見や利己的な考え方に影響されないか」を問うものはどれか。","a":"バイアスの抑制","d":["一貫性","情報の正確性","倫理性"],"e":"②にあたる。評価者の私心を排除できているか。"},{"q":"レヴェンサルの6ルールのうち、「意思決定のために用いられる情報が正確であるか」を問うものはどれか。","a":"情報の正確性","d":["一貫性","修正可能性","代表性"],"e":"③にあたる。"},{"q":"レヴェンサルの6ルールのうち、「最終的な分配の意思決定過程で修正の機会があるか」を問うものはどれか。","a":"修正可能性","d":["情報の正確性","代表性","倫理性"],"e":"④にあたる。異議申し立てや見直しの余地があるか。"},{"q":"レヴェンサルの6ルールのうち、「分配を受ける組織メンバーの関心や価値観が反映されているか」を問うものはどれか。","a":"代表性","d":["修正可能性","倫理性","一貫性"],"e":"⑤にあたる。当事者の声が反映されているか。"},{"q":"レヴェンサルの6ルールのうち、「一般的な道徳や倫理基準に反しないものであるか」を問うものはどれか。","a":"倫理性","d":["代表性","修正可能性","バイアスの抑制"],"e":"⑥にあたる。6つを順に言えるようにしておく。"},{"q":"フェスティンガー（1957）が提唱した、相矛盾する2つの認知が同時に存在するとき一方の認知を変化させるとする理論を何というか。","a":"認知的不協和理論","d":["公平理論","期待理論","帰属理論"],"e":"cognitive dissonance theory。矛盾を解消するために認知のほうを変えてしまう。"},{"q":"評価において最も重要なポイントとされるものは何性か。","a":"公平性","d":["効率性","客観性","継続性"],"e":"報酬決定においても同じく「公平性」が重要とされる。評価制度と報酬制度で共通する結論。"},{"q":"評価の公平性が持つ2つの側面とは、正確性と何か。","a":"納得性","d":["客観性","透明性","一貫性"],"e":"正確に測れているかだけでなく、本人が納得できるかが重要。「究極の完璧な評価制度など存在しない」という結論につながる。"}]},{"k":"4","title":"第4回 日本企業の報酬システム","qs":[{"q":"組織や第三者によって外部から与えられる報酬（賃金、昇進、地位、名声など）を（　）報酬という。","a":"外的","d":["内的","金銭的","経済的"],"e":"extrinsic rewards。対は内的報酬(intrinsic)＝達成感・成長感・有能感など。"},{"q":"職務遂行それ自体から得られる達成感・成長感・有能感などの報酬を（　）報酬という。","a":"内的","d":["外的","非金銭的","心理的"],"e":"intrinsic rewards。仕事そのものから得られる。"},{"q":"労働者が一定の仕事をなした時間を基準として賃金を支払う形態を（　）給という（定額給）。","a":"時間","d":["出来高","職務","年功"],"e":"対は出来高給（奨励給）＝遂行した仕事の数量が基準。"},{"q":"労働者が遂行した仕事の数量を基準として賃金を支払う形態を（　）給という（奨励給）。","a":"出来高","d":["時間","職能","業績"],"e":"時間給↔出来高給。何を基準に測るか（時間か量か）。"},{"q":"日本の賃金体系の元祖とされる、電気産業の労働組合が確立した賃金体系を（　）型賃金体系という。","a":"電産","d":["年功","職務","電機"],"e":"「電産」＝電気産業労働組合。生活保障を軸にした賃金体系の原型。"},{"q":"年齢とともに増加する生計費に合わせて賃金を決定するという年功賃金の論拠を（　）説（生計費維持仮説）という。","a":"生活保障給","d":["熟練","職務給","年功"],"e":"労働者の立場からの論拠。生産性と賃金の結びつきは希薄。"},{"q":"閉鎖的な労働市場では企業内の熟練が勤続年数に対応するという年功賃金の論拠を（　）仮説という。","a":"熟練","d":["生活保障給","人的資本","年功"],"e":"企業・労働者双方の立場からの論拠。勤続＝熟練という前提。"},{"q":"賃金水準を全体的に引き上げることを（　）といい、春闘の主要な交渉対象となる。","a":"ベースアップ（ベア）","d":["定期昇給","賃上げ","スライド"],"e":"定期昇給＝個人が毎年上がる仕組み／ベア＝賃金表そのものを底上げ。区別が重要。"},{"q":"職務の内容や求められる成果を明確に定義し、（　）（job description）を作成する作業を職務分析という。","a":"職務記述書","d":["職務評価表","職務明細書","業務日誌"],"e":"職務分析→職務記述書→職務評価→職務給、という流れ。"},{"q":"職務の価値を相対的に序列づける作業を（　）という（job evaluation）。","a":"職務評価","d":["職務分析","人事考課","職能評価"],"e":"職務分析（内容を明らかにする）と職務評価（価値を序列づける）を混同しない。"},{"q":"職務給の考え方の根拠となる原則を「（　）」または「同一価値労働同一賃金」という。","a":"同一労働同一賃金","d":["同一年功同一賃金","職務主義","均等待遇"],"e":"同じ仕事なら同じ賃金、という職務基準の考え方。"},{"q":"日常レベルでは賃金や給与とほぼ同じ意味で使われるが、組織行動論やモチベーション理論で用いられる用語はどれか。","a":"報酬","d":["賃金","給与","給料"],"e":"報酬は内的報酬・外的報酬を含む広い概念。賃金より広い。"},{"q":"賃金を意味することを明確にするために用いられる報酬の呼び方はどれか。","a":"金銭的（経済的）報酬","d":["外的報酬","内的報酬","付加給付"],"e":"「報酬」だけだと内的報酬も含むため、賃金に限定したいときにこう言う。"},{"q":"内的報酬に含まれるものとして正しい組み合わせはどれか。","a":"達成感・成長感・有能感・自己実現","d":["賃金・昇進・地位・名声","賞与・手当・退職金","福利厚生・住宅補助"],"e":"職務遂行それ自体から得られる報酬。外的報酬（第三者から与えられる）と対になる。"},{"q":"所得税法第28条が定義しているのは何所得か。","a":"給与所得","d":["事業所得","報酬所得","雑所得"],"e":"俸給、給料、賃金、歳費及び賞与並びにこれらの性質を有するものに係る所得。"},{"q":"健康保険法第3条5項が定義している、労働の対償として受けるすべてのものを指す語はどれか。","a":"報酬","d":["賃金","給与","賞与"],"e":"賃金、給料、俸給、手当、賞与その他いかなる名称であるかを問わない。法律によって用語の定義が異なる点に注意。"},{"q":"報酬制度の目的のうち、②にあたるものはどれか。","a":"従業員のモラールを高める","d":["優秀な人材の獲得と維持","ヒトに関する全社レベルのコスト管理","企業文化の表明"],"e":"①優秀な人材の獲得と維持②モラールを高める③コスト管理、の3つ。"},{"q":"人件費÷付加価値総額で求められる指標を何というか。","a":"労働分配率","d":["売上高人件費比率","労働生産性","付加価値率"],"e":"付加価値総額は売上総利益で近似される。全社レベルのコスト管理に用いる。"},{"q":"企業内部において、個々の労働者に支払われる賃金を決定する際の基準・構成を何というか。","a":"賃金体系","d":["賃金形態","賃金水準","賃金制度"],"e":"体系＝何を基準に決めるか（年功給・職務給・職能給など）。"},{"q":"労働の対価として従業員に支払われる賃金の支払形態ないし支払単位のことを何というか。","a":"賃金形態","d":["賃金体系","賃金水準","賃金構成"],"e":"形態＝どう払うか（時間給・出来高給など）。体系との違いが問われる。"},{"q":"年齢・勤続年数などの個人属性によって賃金額を決定する賃金を何というか。","a":"年功給（年功賃金）","d":["職務給","職能給","業績給"],"e":"日本企業独特のものとされる。電産型賃金体系がその原型。"},{"q":"年功賃金のメリットとして挙げられるものはどれか。","a":"長期的視野に立った能力開発（人材育成）が行いやすい","d":["短期的な成果を反映しやすい","人件費を抑制しやすい","ポスト不足に対応しやすい"],"e":"長く勤める前提なので、時間をかけた育成が可能になる。"},{"q":"年功賃金のデメリットとして、中高年齢者の増加による人件費増大のほかに挙げられるものはどれか。","a":"ポスト（役職）不足に対応できない","d":["若手の賃金が高すぎる","評価が複雑になる","労働時間が長くなる"],"e":"年功で上がっても、与えるポストがないという問題。職能資格制度導入の背景になる。"},{"q":"賃金表そのものを書き換えて全体を底上げすることを何というか。","a":"ベースアップ（ベア）","d":["定期昇給","昇格","昇進"],"e":"定期昇給は同じ賃金表の中で号俸が上がること。ベアは表自体が上がること。この違いが頻出。"},{"q":"職務給の決定プロセスの第1段階で、職務の内容や求められる成果を明確に定義することを何というか。","a":"職務分析（job analysis）","d":["職務評価（job evaluation）","職務設計（job design）","職務記述（job description）"],"e":"①職務分析→②職務評価→③賃金への結びつけ、という順序。"},{"q":"職務分析の結果として作成される文書を何というか。","a":"職務記述書（job description）","d":["職務明細書","職務評価表","賃金表"],"e":"それぞれの職務の内容や求められる成果を明確に定義したもの。"},{"q":"職務給の決定プロセスの第2段階で、職務価値の相対的序列づけを行うことを何というか。","a":"職務評価（job evaluation）","d":["職務分析（job analysis）","人事考課","コンピテンシー評価"],"e":"②にあたる。人ではなく仕事に値段をつける作業。"},{"q":"性別や雇用形態に関わらず、同一価値の職務には同一の賃金を支払うべきとする原則を何というか。","a":"同一価値労働同一賃金","d":["同一労働同一賃金","均等待遇原則","公正賃金原則"],"e":"「同一労働同一賃金」が全く同じ仕事を指すのに対し、「同一価値労働」は異なる仕事でも価値が同等なら同じ賃金とする考え方。"},{"q":"能力や情意などの個人属性によって賃金額を決定する賃金を何というか。","a":"職能給（職能資格給）","d":["職務給","年功給","業績給"],"e":"職能資格制度に対応する賃金。人（能力）基準である点が職務給（仕事基準）と異なる。"},{"q":"社内の役職とは別に、職務遂行能力によって格づけされた資格をもとに評価・報酬決定・育成・処遇を行う制度を何というか。","a":"職能資格制度","d":["職務等級制度","役割等級制度","コース別人事制度"],"e":"昇格（資格が上がる）と昇進（役職が上がる）が分離している点が特徴。"},{"q":"職能資格制度が導入された現実的な背景として挙げられるものはどれか。","a":"団塊の世代のポスト不足","d":["高度成長期の人手不足","バブル崩壊後の人員削減","グローバル化への対応"],"e":"役職は足りないが処遇はしたい、という要請に応えた制度。"},{"q":"職能資格制度のメリットとして、昇格と昇進が分離していることで容易になるものはどれか。","a":"異動（ローテーション）","d":["降格","賃下げ","人員削減"],"e":"役職を外れても資格は下がらないので、組織内部の柔軟性が高まる。"},{"q":"職能資格制度のもとで生まれやすいとされる人材はどれか。","a":"ゼネラリスト","d":["スペシャリスト","プロフェッショナル","エキスパート"],"e":"幅広い職能分野を経験させるため。逆にスペシャリストの養成が難しいのがデメリット。"},{"q":"職能資格制度のデメリットとして挙げられるものはどれか。","a":"降格が難しく、賃下げも難しい","d":["異動がしにくい","評価基準が仕事基準になる","ポスト不足に対応できない"],"e":"理念としては仕事給だが、運用が属人給になってしまいがちという問題もある。"},{"q":"業績ないし仕事の成果によって賃金額を決定する賃金を何というか。","a":"業績給（成果給）","d":["職務給","職能給","年功給"],"e":"何を基準に賃金を決めるか、という軸で年功給・職務給・職能給・業績給・役割給を整理する。"},{"q":"職務における「役割」の大きさを序列化して処遇を行い、賃金額に反映させる賃金を何というか。","a":"役割給","d":["業績給","職務給","職能給"],"e":"職務等級制度と職能資格制度の中間的な性格を持つ。"},{"q":"報酬決定において最も重要なポイントとされるものは何性か。","a":"公平性","d":["効率性","客観性","競争性"],"e":"評価制度と同じ結論。何に対して報酬を支払うのかが問題になる。"},{"q":"報酬制度を設計する際、従業員から引き出したい行動と報酬制度との間に必要とされるものは何性か。","a":"整合性","d":["公平性","透明性","一貫性"],"e":"報酬制度は従業員の認知と行動に大きな影響を与えるため。"},{"q":"報酬制度を変更する際に重要になる、総額で捉える観点を何というか。","a":"生涯（獲得）賃金","d":["年収","月例賃金","時間賃金"],"e":"総額で考えると中高年齢者の賃金は下がるため、単年度ではなく生涯で見る視点が必要になる。"},{"q":"報酬制度について導かれる結論として正しいものはどれか。","a":"唯一最善の普遍的な報酬制度は存在しない","d":["職務給が最も優れている","職能給が最も優れている","業績給が最も優れている"],"e":"コンティンジェンシー理論と同じ発想。企業の状況によって最適な制度は変わる。"},{"q":"同じ賃金表の中で、年齢や勤続に応じて号俸が上がることを何というか。","a":"定期昇給","d":["ベースアップ（ベア）","昇格","昇進"],"e":"定期昇給＝表の中で上がる／ベースアップ＝賃金表そのものが上がる。この2つはセットで問われる。"},{"q":"職務分析・職務記述書・職務評価の英語表記の組み合わせとして正しいものはどれか。","a":"job analysis／job description／job evaluation","d":["job design／job specification／job grading","work analysis／work sheet／work rating","task analysis／task list／task scoring"],"e":"職務給の決定プロセス①職務分析（job analysis）→職務記述書（job description）作成→②職務評価（job evaluation）。"}]},{"k":"5","title":"第5回 従業員格付け制度","qs":[{"q":"従業員を職務遂行能力に応じて等級に位置づけ、その序列を報酬などの決定に用いる制度を（　）制度という。","a":"職能資格","d":["職務等級","役割等級","資格"],"e":"人（能力）基準。対応する賃金は職能給。"},{"q":"職務の価値によって従業員を格付けする制度を（　）制度という（job grade）。ヘイ・システムの影響が大きい。","a":"職務等級","d":["職能資格","役割等級","職掌"],"e":"仕事（職務価値）基準。対応する賃金は職務給。"},{"q":"職務の価値ではなく、役割の価値や役割の遂行度によって従業員を格付けする制度を（　）制度という。","a":"役割等級","d":["職能資格","職務等級","専門職"],"e":"職務等級の大括り版。日本企業で近年増えている。"},{"q":"ポストに限りがある中で、能力の高い従業員を上位の役職に就けるために行うことを（　）という。","a":"選抜","d":["昇進","動機付け","配置"],"e":"昇進管理の3つの機能＝配置・選抜・動機付け。"},{"q":"昇進スピードを速めるとモチベーションは向上するが、（　）が追いつかないというデメリットがある。","a":"能力開発","d":["選抜","動機付け","人員配置"],"e":"速い＝モチベ↑だが能力開発が追いつかない／緩い＝能力開発できるがモチベ↓。トレードオフ。"},{"q":"入社後しばらくは同期が同時に昇進する昇進格差のつけ方を（　）昇進型という。","a":"同期同時","d":["同期時間差","選抜","トーナメント"],"e":"一律年功型。日本企業のキャリア初期（1〜8年目あたり）に見られる。"},{"q":"日本企業は同期同時→同期時間差→選抜を組み合わせた「（　）選抜方式」を採用しているとされる。","a":"遅い","d":["早い","段階的","トーナメント"],"e":"欧米の早期選抜に対し、日本は長く横並びで競わせてから絞る。"},{"q":"優秀な人材を早期に選抜して幹部候補として育成する仕組みを（　）という（fast track）。","a":"ファースト・トラック","d":["トーナメント","複線型人事","専門職制度"],"e":"将来の幹部候補生を入社後早い段階から養成するキャリア・ルート。欧米企業では珍しくないが、日本企業ではほとんどみられない。"},{"q":"総合職・専門職・一般職など異なる職掌をコース別に運用する制度を（　）人事制度という。","a":"複線型（コース別）","d":["専門職","職能資格","複合型"],"e":"1986年4月施行の男女雇用機会均等法が背景にある。"},{"q":"日本企業の資格制度のポイントは、（　）と職位を切り離すことにある。","a":"資格","d":["職務","職能","等級"],"e":"資格（等級）が上がる＝昇格／職位（役職）が上がる＝昇進。ポストがなくても処遇を上げられる。"},{"q":"下位の職級に属する職務から上位の職級に属する職務へ異動すること（職位・役職が上がること）を（　）という。","a":"昇進","d":["昇格","昇級","異動"],"e":"昇進＝役職昇進。対して昇格は資格昇格（職能資格が上がること）。"},{"q":"下位の資格から上位の資格に上がること（職能資格が上がること）を（　）という。","a":"昇格","d":["昇進","昇給","登用"],"e":"日本企業の資格制度のポイントは、資格と職位を切り離すこと。ポストがなくても処遇を上げられる。"},{"q":"管理職の年齢に達した人数が多く、ポスト不足を招いた世代を「（　）」という。","a":"団塊の世代","d":["ロスジェネ世代","バブル世代","新人類世代"],"e":"役職昇進中心の昇進管理が1970年代半ばごろから行き詰まる背景となった。"},{"q":"女性の昇進を阻む、目に見えないが確かに存在する壁を（　）という。","a":"グラス・シーリング","d":["ファースト・トラック","ガラスの崖","複線型人事"],"e":"glass ceiling＝ガラスの天井。「課長職以上の管理職は男性が占めている」といった性差の解消が課題。"},{"q":"職能資格制度に対応する賃金を何というか。","a":"職能給","d":["職務給","役割給","業績給"],"e":"従業員を職務遂行能力に応じて職能資格等級に位置づける制度。人（能力）基準。"},{"q":"職務等級制度（job grade）に対応する賃金を何というか。","a":"職務給","d":["職能給","役割給","年功給"],"e":"職務等級制度はコンサルティング会社の影響（ヘイ・システム）が大きい。仕事基準。"},{"q":"役割等級制度は、どの制度を大括りにしたものと位置づけられるか。","a":"職務等級制度","d":["職能資格制度","コース別人事制度","専門職制度"],"e":"職務を細かく分けず、役割の大きさでまとめた制度。"},{"q":"職能資格制度が生まれた背景として、管理職の年齢になり不足が発生したのは何か。","a":"ポスト（役割）","d":["人材","賃金原資","労働時間"],"e":"「団塊の世代」が管理職の年齢に達し、ポスト不足が発生した。"},{"q":"資格等級ごとに設定されている、次の等級に上がるまでに必要な在籍年数を何というか。","a":"必要停留年数","d":["標準昇格年数","最低勤続年数","昇進待機期間"],"e":"これが年功的な運用につながり、実質的な「年功賃金」になっているという指摘がある。"},{"q":"昇進管理の目的のうち、①にあたるものはどれか。","a":"人材育成（能力開発）","d":["動機付け","選抜","賃金管理"],"e":"①人材育成②選抜③動機付け、が昇進管理の目的。"},{"q":"昇進管理の目的のうち、賃金に大きな格差がつかないため、能力や業績向上の報酬として昇進を用いることを何というか。","a":"動機付け","d":["人材育成","選抜","処遇"],"e":"③にあたる。賃金で差をつけにくい日本企業では、昇進が重要な報酬になる。"},{"q":"昇進スピードを速めた場合のデメリットは何か。","a":"能力開発が追いつかない","d":["モチベーションが低下する","選抜が難しくなる","人件費が増大する"],"e":"Good：モチベーションが向上する／Bad：能力開発が追いつかない。"},{"q":"昇進スピードを遅くした場合のデメリットは何か。","a":"モチベーションが低下する可能性がある","d":["能力開発が追いつかない","選抜が不正確になる","人件費が増大する"],"e":"がんばったのになかなか昇進できないため。Good：能力開発や選抜を確実に行いやすい。"},{"q":"キャリア中期に昇進する速さに差をつける昇進のあり方を何というか。","a":"同期時間差昇進","d":["同期同時昇進","トーナメント型昇進","ファースト・トラック"],"e":"①同期同時（差を一切つけない）②同期時間差（速さに差をつける）③選抜という段階を踏む。"},{"q":"総合職・専門職・一般職などをコース別に運用する、変形の職能資格制度を何というか。","a":"複線型（コース別）人事制度","d":["職務等級制度","専門職制度","役割等級制度"],"e":"1986年4月施行の男女雇用機会均等法が契機となった。"},{"q":"複線型人事制度における、総合職・一般職などの区分を何というか。","a":"職掌","d":["職位","職種","職能"],"e":"職掌・職位・職種・職能は混同しやすいので区別して覚える。"},{"q":"複線型（コース別）人事制度の導入契機となった、1986年4月施行の法律は何か。","a":"男女雇用機会均等法","d":["労働基準法","育児・介護休業法","次世代育成支援対策推進法"],"e":"正式名称は「雇用の分野における男女の均等な機会及び待遇の確保等女子労働者の福祉の増進に関する法律」。"},{"q":"専門的な経験や知識のある人材を、管理職としてではなく処遇する制度を何というか。","a":"専門職制度","d":["複線型人事制度","職務等級制度","役割等級制度"],"e":"ポスト不足への対応策のひとつでもある。"},{"q":"日本企業の資格制度のポイントは、資格と何を切り離すことか。","a":"職位・役職","d":["職種・職掌","賃金・賞与","評価・処遇"],"e":"資格（職能資格）と職位（役職）を分離することで、昇格と昇進を別に扱える。"},{"q":"昇格や昇進のことを、方向を表す語で何の異動と呼ぶか。","a":"タテの異動（垂直方向への異動）","d":["ヨコの異動（水平方向への異動）","ナナメの異動","外部への異動"],"e":"昇格・昇進を伴わない異動は「ヨコの異動（水平方向への異動）」と呼ぶ。"},{"q":"昇格や昇進を伴わない異動のことを何と呼ぶか。","a":"ヨコの異動（水平方向への異動）","d":["タテの異動（垂直方向への異動）","出向","転籍"],"e":"タテとヨコの対で覚える。"},{"q":"企業が採用した労働者を最初の職場や仕事に割り当てることを何というか。","a":"配属（初任配属）","d":["異動","配置転換","ジョブ・ローテーション"],"e":"（2）にあたる。その後の異動と区別する。"},{"q":"従業員が現在従事している職務から別の職務へ移ることを何というか。","a":"異動（人事異動）","d":["配属","出向","転籍"],"e":"（3）にあたる。異動には転勤・ジョブローテーション・配置転換などが含まれる。"},{"q":"主に同じ職場内（職能部門内）で、担当する職務が変わることを何というか。","a":"ジョブ・ローテーション","d":["転勤","配置転換","出向"],"e":"例：人事部採用担当から人事部研修担当への異動。"},{"q":"個人の能力と担当する職務がアンバランス（ミスマッチ）になった場合に行う異動を何というか。","a":"配置転換","d":["ジョブ・ローテーション","転勤","出向"],"e":"③にあたる。ミスマッチの解消が目的。"},{"q":"異動の目的のうち、①にあたるものはどれか。","a":"適性の発見機会を提供すること","d":["経験の幅を拡げること","能力の伸長をはかること","公正な評価を行うこと"],"e":"①適性の発見②経験の幅③能力の伸長④公正な評価⑤人的交流⑥労働需給ギャップの修正。"},{"q":"異動の目的のうち、ある特定の上司との相性が悪い社員を埋もれさせないために行うものはどれか。","a":"公正な評価を行うこと","d":["適性の発見","経験の幅の拡大","人脈づくり"],"e":"④にあたる。評価者が変わることで救済される。"},{"q":"異動の目的のうち、⑤の人的交流によって社内に築かれるものは何か。","a":"人脈づくり（人的ネットワーク）","d":["適性の発見","能力の伸長","労働需給ギャップの修正"],"e":"異なる職能部門や職能部門内の人的交流をはかること。"},{"q":"異動の目的のうち、部門間の仕事量のアンバランスを修正・解消することを何というか。","a":"労働需給ギャップの修正","d":["人脈づくり","適性の発見","能力の伸長"],"e":"⑥にあたる。組織全体で人員配置を最適化する。"},{"q":"もともと在籍していた企業との雇用関係を残したまま、出向先とも雇用関係を結ぶことを何というか。","a":"出向","d":["転籍","派遣","異動"],"e":"雇用関係が2つある状態。中高年の従業員に対して行われる出向は、のちに転籍に移行する場合が多い。"},{"q":"もともと在籍していた企業との雇用関係を終了させ、新たに雇用契約を結ぶことを何というか。","a":"転籍","d":["出向","派遣","配置転換"],"e":"雇用関係が移る。出向との違いは「元の企業との関係が残るかどうか」。"},{"q":"会社が必要とするポストや職種の要件をあらかじめ社内に公開し、応募者を募る制度を何というか。","a":"社内公募制度","d":["社内FA制度","ジョブ・ローテーション","複線型人事制度"],"e":"通常は外部に対して行う人材公募を社内で行うもの。"},{"q":"社員が自らの経歴や能力、希望する職種を登録して売り込む制度を何というか。","a":"社内FA（フリーエージェント）制度","d":["社内公募制度","自己申告制度","キャリア面談制度"],"e":"社内公募は会社側から募集、社内FAは社員側から売り込む。方向が逆である点が重要。"},{"q":"日本の労働市場で少しずつ進み、外部労働市場の形成につながっているものは何か。","a":"労働力の流動化","d":["労働時間の柔軟化","雇用の多様化","賃金の個別化"],"e":"ただし個人属性や職務遂行能力を基準とした雇用がおおむね維持されている。"},{"q":"個人属性や職務遂行能力を基準とした日本型の雇用を何型雇用というか。","a":"メンバーシップ型雇用","d":["ジョブ型雇用","タスク型雇用","プロジェクト型雇用"],"e":"人を採用してから仕事を割り当てる。職務を基準とした雇用が「ジョブ型」。"},{"q":"職務を基準とした雇用を何型雇用というか。","a":"ジョブ型雇用","d":["メンバーシップ型雇用","メリット型雇用","スキル型雇用"],"e":"仕事に人をつける方式。日本では実践するには未だ不十分とされる。"},{"q":"組織メンバーに割り当てられた職務の遂行に必要な権限と責任を示す組織上の地位を何というか。","a":"職位（役職）","d":["職掌","職種","職能"],"e":"position。職掌（コース区分）・職種（業務内容）と混同しやすい。"},{"q":"一般に職業の種類を指し、具体的な業務内容として捉えられるものを何というか。","a":"職種","d":["職位","職掌","職能"],"e":"（4）にあたる。営業職・技術職・事務職など。"},{"q":"一般職・総合職といった区分を指す語として、この講義で挙げられているものはどれか。","a":"職掌","d":["職種","職位","職能"],"e":"（7）にあたる。企業によって呼び名は異なる。複線型人事制度における区分。"},{"q":"職能資格制度において、昇格と昇進の違いとして正しいものはどれか。","a":"昇格＝資格等級が上がる／昇進＝職位・役職が上がる","d":["昇格＝役職が上がる／昇進＝資格が上がる","どちらも役職が上がること","どちらも賃金が上がること"],"e":"この2つを切り離すのが日本企業の資格制度のポイント。"},{"q":"職能資格制度において、昇進スピードの3類型として正しい順序はどれか。","a":"同期同時 → 同期時間差 → 選抜","d":["選抜 → 同期同時 → 同期時間差","同期時間差 → 同期同時 → 選抜","同期同時 → 選抜 → 同期時間差"],"e":"キャリア初期は差をつけず、中期で速さに差をつけ、後期で選抜する。日本企業の「遅い昇進」の特徴。"},{"q":"日本企業の昇進の特徴を表す言葉はどれか。","a":"遅い昇進","d":["早い選抜","飛び級昇進","年次無視型昇進"],"e":"長期間かけて選抜するため、モチベーション維持と能力開発の両立が図られる。"},{"q":"女性の昇進を阻む見えない壁を何というか。","a":"グラス・シーリング","d":["ファースト・トラック","ガラスの崖","スティッキー・フロア"],"e":"ファースト・トラック（早期選抜コース）と対で出題される。"}]},{"k":"6","title":"第6回 人材育成","qs":[{"q":"知識や技術を計画的に習得させることによって人材の育成を図るものを（　）という。","a":"教育訓練","d":["能力開発","キャリア開発","人材育成"],"e":"人材育成＝教育訓練＋キャリア開発、という関係。"},{"q":"個人がさまざまな経験や訓練を通じて、自分の職業人としての価値を高めていくことを（　）という。","a":"キャリア開発","d":["能力開発","教育訓練","自己啓発"],"e":"教育訓練（企業が施す）とキャリア開発（個人が高める）の組み合わせ。"},{"q":"日本企業ではキャリアの幅が広い（　）が多く、幅が狭いスペシャリストは少ないと言われる。","a":"ゼネラリスト","d":["スペシャリスト","マネジャー","プロフェッショナル"],"e":"幅広い異動でさまざまな仕事を経験させるのが日本型。"},{"q":"職場で実際の仕事を通じて行う教育訓練を（　）という（On the Job Training）。","a":"OJT","d":["off-JT","自己啓発","メンタリング"],"e":"職場内訓練。対はoff-JT（職場外訓練）。"},{"q":"年齢・職位などの階層ごとに、それぞれの教育ニーズにそって行う教育を（　）別教育という（新入社員研修・管理者研修など）。","a":"階層","d":["職能","部門","職種"],"e":"off-JTの分類。階層別（タテ）と職能別（ヨコ）。"},{"q":"各職能に求められる専門的知識や実務的知識の習得を目的として実施される教育を（　）別教育という。","a":"職能","d":["階層","専門","部門"],"e":"営業研修・技術者研修など。"},{"q":"社員の自発的な学習を会社としてサポートするもので、基本的には就業時間外に行われるものを（　）という。","a":"自己啓発","d":["off-JT","OJT","メンタリング"],"e":"OJT・off-JT・自己啓発が能力開発の3本柱。"},{"q":"組織の境界を越えて展開されるキャリアのあり方を（　）キャリアという。","a":"バウンダーリーレス","d":["プロティアン","ゼネラリスト","内部労働市場"],"e":"企業内特殊技能だけではエンプロイアビリティ（雇用され得る力）が高まらないという問題意識が背景。"},{"q":"経験豊かな年長者が若手の成長を支援する関係を（　）といい、支援する側をメンターという。","a":"メンタリング","d":["コーチング","OJT","カウンセリング"],"e":"メンター（mentor）＝助言者・支援者。"},{"q":"実際に発揮された能力を発揮能力、持っているが発揮されていない能力を（　）という。","a":"保有能力","d":["発揮能力","潜在能力","基礎能力"],"e":"職能資格制度では保有能力も評価対象になるため、賃金が下がりにくいという特徴がある。"},{"q":"職場を離れて行う集合研修を（　）という（職場外訓練）。","a":"off-JT","d":["OJT","自己啓発","メンタリング"],"e":"OJT（職場内訓練）・off-JT（職場外訓練）・自己啓発が能力開発の3本柱。"},{"q":"人材育成に関する用語のうち、職務遂行能力を高めることを何というか。","a":"能力開発","d":["教育訓練","キャリア開発","人材開発"],"e":"教育訓練＝知識や技術を計画的に習得させること、能力開発＝職務遂行能力を高めること。"},{"q":"教育訓練とキャリア開発を合わせたものを何というか。","a":"人材育成","d":["能力開発","人材開発","組織開発"],"e":"Human Resource Development（人的資源開発・人材開発）とも呼ばれる。"},{"q":"資源としての「ヒト」の特性の1つ目、頻繁な取引が難しいのはどこにおいてか。","a":"市場","d":["組織","職場","社会"],"e":"部品を替えるのと同じ感覚で、簡単に人を雇ったりクビにしたりできない。"},{"q":"人材育成において、長期的で計画的な人材活動を行うために高めるべき2つは、モラールと何か。","a":"モチベーション","d":["エンプロイアビリティ","コンピテンシー","キャリア自律"],"e":"③モチベーションやモラールを高め、長期的で計画的な人材活動を行うこと。"},{"q":"キャリアの幅が狭い人材を何というか。","a":"スペシャリスト","d":["ゼネラリスト","エキスパート","プロフェッショナル"],"e":"日本企業はゼネラリストが多いと言われるが、実際には特定の職能分野内でキャリア形成が行われることが多い。"},{"q":"組織的な顕在能力（発揮能力）を英語で何というか。","a":"core competence","d":["competency","capability","ability"],"e":"組織的×顕在＝core competence／個人的×顕在＝competency／組織的×潜在＝capability／個人的×潜在＝ability。"},{"q":"個人的な顕在能力（発揮能力）を英語で何というか。","a":"competency","d":["core competence","capability","ability"],"e":"個人が実際に発揮している能力。コンピテンシー評価につながる概念。"},{"q":"組織的な潜在能力（保有能力）を英語で何というか。","a":"capability","d":["core competence","competency","ability"],"e":"組織が持っているが、まだ発揮されていない能力。"},{"q":"個人的な潜在能力（保有能力）を英語で何というか。","a":"ability","d":["core competence","competency","capability"],"e":"個人が持っているが、まだ発揮されていない能力。4象限をセットで覚える。"},{"q":"労働市場において雇用され得る能力のことを何というか。","a":"エンプロイアビリティ","d":["コンピテンシー","キャリア・アンカー","エンゲージメント"],"e":"employability。転職可能性を含む、個人が持つ雇用され続ける力。"},{"q":"能力開発の手法のうち、対話を通じて本人の自発的な行動を引き出すものを何というか。","a":"コーチング","d":["メンタリング","ティーチング","カウンセリング"],"e":"coaching。メンタリング（mentoring）と対で出題される。"},{"q":"メンタリングにおいて、指導する立場の人を何というか。","a":"メンター","d":["メンティー","プロテジェ","コーチ"],"e":"mentor。指導を受ける側はメンティー（mentee）またはプロテジェ（protege）。"},{"q":"メンタリングにおいて、指導を受ける立場の人の呼び方として正しいものはどれか。","a":"メンティーまたはプロテジェ","d":["メンターまたはコーチ","トレーナーまたはチューター","スーパーバイザー"],"e":"mentee／protege。両方の呼び方があることが問われる。"},{"q":"能力開発・教育訓練の体系のうち、職場を離れて行う集合研修を何というか。","a":"off-JT（職場外訓練）","d":["OJT（職場内訓練）","自己啓発","CDP"],"e":"On the Job Training＝OJT（職場内訓練）と対になる。"},{"q":"能力開発・教育訓練の体系のうち、個人が自発的に行うものを何というか。","a":"自己啓発","d":["OJT","off-JT","階層別研修"],"e":"OJT・off-JT・自己啓発の3本柱。"}]},{"k":"7","title":"第7回 働き方の多様化","qs":[{"q":"「雇用の分野における男女の均等な機会及び待遇の確保等に関する法律」を（　）法という。","a":"男女雇用機会均等","d":["育児・介護休業","次世代育成支援対策推進","労働基準"],"e":"平成29年1月1日改正。1986年4月施行。"},{"q":"「育児休業、介護休業等育児又は家族介護を行う労働者の福祉に関する法律」を（　）法という。","a":"育児・介護休業","d":["男女雇用機会均等","次世代育成支援対策推進","労働者派遣"],"e":"労働者数1,000人超の事業主は育児休業取得状況の公表が義務化。"},{"q":"情報通信技術を活用し、場所にとらわれずに働く形態の中心となる概念を（　）という。","a":"テレワーク","d":["フレックスタイム","時短","在宅勤務"],"e":"時間軸の施策（時短・フレックス）に対し、空間軸の施策。"},{"q":"企業に雇用されず、個人事業主として請け負う形のテレワークを（　）テレワークという（旧SOHO）。","a":"自営型","d":["雇用型","在宅","企業"],"e":"対は雇用型テレワーク（企業テレワーク）≒在宅勤務。"},{"q":"労働時間の統計上の減少には、（　）の増大や非正規雇用者の増加というトリックもあるとされる。","a":"サービス残業","d":["時短","フレックスタイム","有給休暇"],"e":"2021年には1777時間まで減少したが、統計の見かけ上の要素がある。"},{"q":"女性の能力発揮や男女格差の解消を目指した積極的差別是正措置を（　）という（和製英語）。","a":"ポジティブ・アクション","d":["アファーマティブ・アクション","ダイバーシティ","CSR"],"e":"アメリカ発のアファーマティブ・アクションに相当する日本での呼称。"},{"q":"「課長職以上の管理職は男性が占めている」というような、women の昇進を阻む見えない壁を（　）という。","a":"グラス・シーリング","d":["ガラスの崖","ポジティブ・アクション","M字カーブ"],"e":"glass ceiling＝ガラスの天井。見えないが確かに存在する昇進の壁。"},{"q":"「企業の社会的責任」と訳される概念を（　）という（Corporate Social Responsibility）。","a":"CSR","d":["CSV","コンプライアンス","ダイバーシティ"],"e":"関連語としてコンプライアンス（compliance；法令の遵守）がある。"},{"q":"仕事と家庭の両立支援に積極的な企業を（　）企業（ファミフレ）という。主な関心は「働く女性への支援」。","a":"ファミリー・フレンドリー","d":["ダイバーシティ","ポジティブ・アクション","CSR"],"e":"ファミフレ＝働く女性への支援が主眼。多様性全般を扱うダイバーシティ・マネジメントとは関心が異なる。"},{"q":"性別・民族・宗教などの多様性を活かす経営を（　）という。主な関心・課題は「格差是正」。","a":"ダイバーシティ・マネジメント","d":["ファミリー・フレンドリー","ポジティブ・アクション","コンプライアンス"],"e":"マイノリティの処遇に関するアメリカ発の概念で、性差だけを想定しているわけではない。最近は「ダイバーシティ＆インクルージョン（D＆I）」とも呼ばれる。"},{"q":"法令の遵守を意味する語を（　）という（compliance）。","a":"コンプライアンス","d":["CSR","ガバナンス","ディスクロージャー"],"e":"CSR（企業の社会的責任）に関連する概念。"},{"q":"育児・介護休業法の改正で、男性の育児休業取得促進とともに防止が図られたハラスメントは何か。","a":"マタニティ・ハラスメント","d":["セクシャル・ハラスメント","パワー・ハラスメント","モラル・ハラスメント"],"e":"妊娠・出産・育児休業などを理由とする不利益取扱いや嫌がらせ。"},{"q":"101人以上を雇用する事業主に、子育て支援に関する「行動計画」の届け出を義務づけた法律は何か。","a":"次世代育成支援対策推進法","d":["男女雇用機会均等法","育児・介護休業法","労働施策総合推進法"],"e":"子育て支援の行動計画の策定・届出を義務づけている。"},{"q":"以前SOHOと呼ばれていた形態に対し、企業に雇用されて行うテレワークを何というか。","a":"雇用型テレワーク","d":["自営型テレワーク","在宅勤務","モバイルワーク"],"e":"自営型（SOHO＝Small Office Home Office）と雇用型（企業テレワーク）の区別。"},{"q":"1992年の「労働時間の短縮の促進に関する臨時措置法」を略して何というか。","a":"時短促進法","d":["労働時間法","働き方改革法","労基法特例"],"e":"（1）労働時間短縮（時短）に関する法律。"},{"q":"ポジティブ・アクションは和製英語だが、英語では何というか。","a":"アファーマティブ・アクション","d":["ダイバーシティ・マネジメント","エクイティ・アクション","イコール・オポチュニティ"],"e":"affirmative action。主な関心・課題は「女性の能力発揮」や「男女格差 const S={};
let cur=0,wrongOnly=false,mode='sel';
const ORD={},PICK={},SHOWN={};
const TOTAL=LEC.reduce((a,l)=>a+l.qs.length,0);
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function K(li,qi){return mode+'_'+li+'_'+qi;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function order(li,qi){
  const k=li+'_'+qi;
  if(!ORD[k]){const q=LEC[li].qs[qi];ORD[k]=shuf([{t:q.a,ok:1}].concat(q.d.map(t=>({t,ok:0}))));}
  return ORD[k];
}
function tabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  LEC.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' on':'');
    let done=0;for(let q=0;q<l.qs.length;q++)if(S[K(i,q)])done++;
    if(done===l.qs.length)b.className+=' done';
    b.innerHTML='第'+l.k+'回<small>'+done+'/'+l.qs.length+'</small>';
    b.onclick=()=>{cur=i;wrongOnly=false;rb();render();window.scrollTo(0,0);};
    el.appendChild(b);
  });
}
function rb(){document.getElementById('ba').style.display='none';document.getElementById('bw').style.display='';}
function render(){
  tabs();
  const l=LEC[cur],m=document.getElementById('main');
  let h='<h2>'+esc(l.title)+'</h2>',shown=0;
  l.qs.forEach((q,qi)=>{
    const k=K(cur,qi),st=S[k];
    if(wrongOnly&&(!st||st.ok))return;
    shown++;
    const reveal=st||SHOWN[k];
    const blank=reveal?'<em class="filled">'+esc(q.a)+'</em>':'<em></em>';
    h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">Q'+(qi+1)+'</span><span class="qt">'+esc(q.q).replace('（　）',blank)+'</span></div>';
    if(mode==='sel'){
      h+='<div class="opts">';
      order(cur,qi).forEach((it,i)=>{
        let cls='o';
        if(st){if(it.ok)cls+=' c';else if(st.sel===i)cls+=' x';}
        const mk=st?(it.ok?'✓':(st.sel===i?'✕':(i+1))):(i+1);
        h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'"><i>'+mk+'</i><span>'+esc(it.t)+'</span></div>';
      });
      h+='</div>';
      if(!st)h+='<div class="act"><button data-check="'+qi+'">答え合わせ</button><span class="hint" data-cnt="'+qi+'"></span></div>';
    }else{
      if(!st&&!SHOWN[k])h+='<div class="act"><button data-show="'+qi+'">答えを見る</button><span class="hint">まず頭の中で答えてから押す</span></div>';
      else if(!st){
        h+='<div class="ans">答え：<b>'+esc(q.a)+'</b></div>';
        h+='<div class="act"><span class="hint">言えた？</span><button class="mk" data-mark="'+qi+'" data-v="1">○ 言えた</button><button class="mx" data-mark="'+qi+'" data-v="0">✕ 言えなかった</button></div>';
      }
    }
    if(st)h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'正解':'不正解')+'</b>　'+esc(q.e)+'</div>';
    h+='</div>';
  });
  if(!shown)h+='<div class="msg">この回に間違えた問題はありません。</div>';
  m.innerHTML=h;bind();stats();
}
function bind(){
  document.querySelectorAll('.o').forEach(el=>{
    const qi=+el.dataset.q,i=+el.dataset.i,k=K(cur,qi);
    if(S[k])return;
    el.onclick=()=>{
      PICK[k]=i;
      el.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='';
    };
  });
  document.querySelectorAll('[data-check]').forEach(b=>{
    const qi=+b.dataset.check,k=K(cur,qi);
    b.onclick=()=>{
      if(PICK[k]===undefined){const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='選択肢を選んでください';return;}
      S[k]={sel:PICK[k],ok:!!order(cur,qi)[PICK[k]].ok};save();render();
    };
  });
  document.querySelectorAll('[data-show]').forEach(b=>{
    const qi=+b.dataset.show;b.onclick=()=>{SHOWN[K(cur,qi)]=1;render();};
  });
  document.querySelectorAll('[data-mark]').forEach(b=>{
    const qi=+b.dataset.mark,v=+b.dataset.v;
    b.onclick=()=>{S[K(cur,qi)]={sel:-1,ok:!!v};save();render();};
  });
}
function stats(){
  const l=LEC[cur];let d=0,o=0;
  l.qs.forEach((q,qi)=>{const st=S[K(cur,qi)];if(st){d++;if(st.ok)o++;}});
  document.getElementById('s1').textContent=d+' / '+l.qs.length;
  document.getElementById('s2').textContent=o;
  document.getElementById('s3').textContent=d-o;
  document.getElementById('s4').textContent=d?Math.round(o/d*100)+'%':'—';
  let ad=0,ao=0;
  LEC.forEach((L,li)=>L.qs.forEach((q,qi)=>{const st=S[K(li,qi)];if(st){ad++;if(st.ok)ao++;}}));
  document.getElementById('pbar').style.width=Math.round(ad/TOTAL*100)+'%';
  document.getElementById('plab').textContent='全体の進捗 '+ad+' / '+TOTAL+' 問';
  document.getElementById('prate').textContent=ad?('正答率 '+Math.round(ao/ad*100)+'%'):'';
}
function save(){try{localStorage.setItem('hmq2',JSON.stringify(S));}catch(e){}}
function load(){try{const v=localStorage.getItem('hmq2');if(v)Object.assign(S,JSON.parse(v));}catch(e){}}
document.getElementById('m1').onclick=function(){
  mode='sel';this.classList.add('on');document.getElementById('m2').classList.remove('on');
  document.getElementById('mh').textContent='選択モード：4つの候補から選びます。まず用語に慣れる最初の1周向け。';
  wrongOnly=false;rb();render();
};
document.getElementById('m2').onclick=function(){
  mode='rec';this.classList.add('on');document.getElementById('m1').classList.remove('on');
  document.getElementById('mh').textContent='穴埋めモード：空欄を見て頭の中で答え、「答えを見る」で確認して自己採点。本番はこの形式です。成績は選択モードとは別に記録されます。';
  wrongOnly=false;rb();render();
};
document.getElementById('bw').onclick=function(){wrongOnly=true;this.style.display='none';document.getElementById('ba').style.display='';render();};
document.getElementById('ba').onclick=function(){wrongOnly=false;this.style.display='none';document.getElementById('bw').style.display='';render();};
document.getElementById('br').onclick=function(){
  LEC[cur].qs.forEach((q,qi)=>{const k=K(cur,qi);delete S[k];delete PICK[k];delete SHOWN[k];delete ORD[cur+'_'+qi];});
  wrongOnly=false;rb();save();render();
};
document.getElementById('brall').onclick=function(){
  if(!confirm('全ての回の解答記録を消します。よろしいですか？'))return;
  Object.keys(S).forEach(k=>delete S[k]);
  Object.keys(SHOWN).forEach(k=>delete SHOWN[k]);
  Object.keys(PICK).forEach(k=>delete PICK[k]);
  Object.keys(ORD).forEach(k=>delete ORD[k]);
  wrongOnly=false;rb();save();render();
};
load();render();

</script></body></html>
