<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人的マネジメント | 試験対策クイズ</title>
<meta name="description" content="日本企業の採用・評価・報酬・格付け・人材育成・働き方の多様化。用語の穴埋めで確認します。まず4択で用語に慣れ、慣れたら自己採点モードで自分の言葉で思い出す練習を。論述13テーマの答案の骨格も収録しています。">
<style>
:root{
 --bg:#fbfaf8;--card:#fff;--line:#e5e2da;--txt:#22211e;--sub:#6d6a63;--soft:#f4f2ed;
 --ok:#1d7a4f;--okbg:#e7f4ec;--ng:#b3312e;--ngbg:#fbeaea;
 --accent:#7a4b22;--accentbg:#f5efe7;--on:#fff;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#1a1917;--card:#242320;--line:#3a3833;--txt:#ecebe5;--sub:#a6a39b;--soft:#2c2b27;
 --ok:#6cc79a;--okbg:#1e3a2c;--ng:#e88a88;--ngbg:#3c2322;
 --accent:#d4a574;--accentbg:#33291f;--on:#161513;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);line-height:1.85;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 font-feature-settings:"palt"}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 60px}

/* ---- header ---- */
h1{font-size:22px;font-weight:600;margin:0 0 6px;line-height:1.45;letter-spacing:.01em}
.lead{color:var(--sub);font-size:13.5px;line-height:1.8;margin:0 0 4px}
.meta{font-size:12px;color:var(--sub);margin:6px 0 22px}
.meta b{color:var(--accent);font-weight:600}

/* ---- 共通パーツ ---- */
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{font-family:inherit;font-size:13px;line-height:1.5;padding:7px 14px;border-radius:99px;
 border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;transition:border-color .12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.chip small{font-size:10.5px;opacity:.62;margin-left:5px;font-weight:400}
.chip.on small{opacity:.8}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--card);flex-wrap:wrap}
.seg button{font-family:inherit;font-size:13.5px;padding:9px 18px;border:none;background:transparent;
 color:var(--sub);cursor:pointer;line-height:1.5;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600}
.modehint{font-size:12.5px;color:var(--sub);margin:-6px 0 16px;line-height:1.75}

/* ---- 進捗 ---- */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0 6px;font-size:12.5px;color:var(--sub)}
.hud .n{font-variant-numeric:tabular-nums}
.hud .ok{color:var(--ok);font-weight:600}
.hud .ng{color:var(--ng);font-weight:600}
.hud .sp{flex:1}
.track{height:5px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:20px}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

/* ---- 要点ノート ---- */
details.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
 border-radius:0 11px 11px 0;margin-bottom:16px;font-size:14px;line-height:1.85}
details.note>summary{cursor:pointer;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none}
details.note>summary::-webkit-details-marker{display:none}
details.note>summary::before{content:"▸ ";font-size:11px}
details.note[open]>summary::before{content:"▾ "}
.note .body{padding:0 15px 14px}
.note h3{margin:12px 0 5px;font-size:14px;font-weight:600}
.note h3:first-child{margin-top:0}
.note p{margin:5px 0}
.note ul{margin:5px 0;padding-left:20px}
.note li{margin-bottom:3px}
.note .kwlist{font-size:13px;color:var(--sub);background:var(--soft);border-radius:8px;padding:9px 12px;line-height:2}

/* ---- 問題カード ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;margin-bottom:14px}
.src{font-size:11.5px;color:var(--sub);margin:0 0 12px;letter-spacing:.02em}
.qtext{font-size:18px;line-height:1.95;margin:0 0 18px;font-weight:400}
.qtext .blank{display:inline-block;min-width:78px;border-bottom:2px solid var(--accent);
 background:var(--accentbg);border-radius:3px;padding:0 8px;text-align:center;color:transparent}
.qtext .blank.on{color:var(--ok);font-weight:600;background:var(--okbg);border-bottom-color:var(--ok);min-width:0}
u.bad{text-decoration:none;background:var(--ngbg);color:var(--ng);font-weight:600;
 border-bottom:2px solid var(--ng);border-radius:3px;padding:0 3px;
 -webkit-box-decoration-break:clone;box-decoration-break:clone}
.ask{font-size:13px;color:var(--sub);margin:0 0 11px}

.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
 font-family:inherit;font-size:15.5px;line-height:1.7;padding:13px 15px;
 border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--txt);cursor:pointer;transition:border-color .12s,background .12s}
.ch:hover{border-color:var(--accent)}
.ch i{flex-shrink:0;width:23px;height:23px;margin-top:2px;border-radius:7px;background:var(--soft);
 color:var(--sub);font-style:normal;font-size:12px;font-weight:600;
 display:flex;align-items:center;justify-content:center}
.ch.pick{border-color:var(--accent);background:var(--accentbg)}
.ch.pick i{background:var(--accent);color:var(--on)}
.ch.correct{border-color:var(--ok);background:var(--okbg)}
.ch.correct i{background:var(--ok);color:var(--on)}
.ch.miss{border-color:var(--ng);background:var(--ngbg)}
.ch.miss i{background:var(--ng);color:var(--on)}
.ch.none{color:var(--sub)}
.ch.none.correct,.ch.none.miss{color:var(--txt)}
.ch[disabled]{cursor:default}

/* ---- 判定・解説 ---- */
.verdict{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 13px;border-radius:99px;margin:18px 0 0}
.verdict.y{background:var(--okbg);color:var(--ok)}
.verdict.n{background:var(--ngbg);color:var(--ng)}
.fix{margin-top:11px;padding:12px 15px;background:var(--okbg);border-radius:10px;font-size:15.5px;line-height:1.8}
.fix b{color:var(--ok)}
.fix .lbl{font-size:12px;color:var(--sub);display:block;margin-bottom:1px}
.fix.long{font-size:14.5px;background:var(--soft)}
.fix.long b{color:var(--txt);font-weight:400}
.item .a.long b{color:var(--txt);font-weight:400}
.exp{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:13.5px;color:var(--sub);line-height:1.9}

/* ---- 操作ボタン ---- */
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:120px;font-family:inherit;font-size:14.5px;padding:12px 16px;border-radius:11px;
 border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;line-height:1.5}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.y{border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.n{border-color:var(--ng);color:var(--ng);font-weight:600}
.btn[disabled]{opacity:.38;cursor:default}
.btn[disabled]:hover{border-color:var(--line)}

.nav{display:flex;gap:9px;align-items:center;margin-top:4px}
.nav button{font-family:inherit;font-size:13.5px;padding:10px 18px;border-radius:10px;
 border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
.nav button:hover{border-color:var(--accent)}
.nav button[disabled]{opacity:.35;cursor:default}
.nav button[disabled]:hover{border-color:var(--line)}
.nav .sp{flex:1}

/* ---- 一覧ビュー ---- */
.lsec{margin:0 0 30px}
.lsec:first-child{margin-top:16px}
.lsec h2{font-size:15px;font-weight:600;margin:0 0 13px;padding-bottom:8px;border-bottom:2px solid var(--accent);line-height:1.55}
.item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.item.err{border-left:3px solid var(--ng)}
.item.clean{border-left:3px solid var(--ok)}
.item .s{font-size:15.5px;margin:0;line-height:1.9}
.item .a{margin:9px 0 0;font-size:15px;background:var(--okbg);border-radius:8px;padding:8px 12px;line-height:1.8}
.item .a b{color:var(--ok)}
.item .a .lbl{font-size:11.5px;color:var(--sub);margin-right:8px}
.item .note-ok{margin:8px 0 0;font-size:13px;color:var(--ok)}
.item .ex{margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.9}
body.hide .item .a,body.hide .item .ex,body.hide .item .note-ok{display:none}
body.hide .item .s u.bad{background:transparent;color:inherit;font-weight:400;border-bottom:none;padding:0}
body.hide .item .s .blank.on{color:transparent;background:var(--accentbg);border-bottom-color:var(--accent);min-width:78px}

/* ---- 読み物 ---- */
.doc{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:15px}
.doc h3{font-size:16.5px;margin:0 0 5px;line-height:1.6;font-weight:600}
.doc .why{font-size:13px;color:var(--sub);margin:0 0 13px;line-height:1.85}
.doc pre{background:var(--soft);border-radius:10px;padding:14px 15px;margin:0;
 font-size:13.5px;line-height:2;white-space:pre-wrap;font-family:inherit;overflow-x:auto}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.kw span{font-size:12px;padding:3px 10px;background:var(--accentbg);color:var(--accent);border-radius:99px;line-height:1.7}

/* ---- 結果 ---- */
.done{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center}
.done .big{font-size:38px;font-weight:600;line-height:1.3;margin:0;font-variant-numeric:tabular-nums}
.done .rate{font-size:14px;color:var(--sub);margin:4px 0 0}
.done .btns{margin-top:22px}

.empty{background:var(--soft);border-radius:11px;padding:16px 18px;font-size:14px;color:var(--sub);line-height:1.8}

/* ---- footer ---- */
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
 font-size:12px;color:var(--sub);line-height:1.9}
.foot .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.foot .tools button{font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:99px;
 border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;line-height:1.5}
.foot .tools button:hover{border-color:var(--accent);color:var(--accent)}
.foot .tools button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.foot a{color:var(--accent)}
.keys{margin-top:10px;font-size:11.5px}
.keys kbd{display:inline-block;padding:1px 6px;margin:0 1px;border:1px solid var(--line);
 border-radius:4px;background:var(--card);font-family:inherit;font-size:11px}

@media(max-width:560px){
 .wrap{padding:20px 14px 50px}
 h1{font-size:19.5px}
 .card{padding:16px 15px 15px}
 .qtext{font-size:16.5px}
 .ch{font-size:15px;padding:12px 13px}
 .keys{display:none}
}

<div class="wrap">
<h1>人的マネジメント</h1>
<p class="lead">日本企業の採用・評価・報酬・格付け・人材育成・働き方の多様化。用語の穴埋めで確認します。まず4択で用語に慣れ、慣れたら自己採点モードで自分の言葉で思い出す練習を。論述13テーマの答案の骨格も収録しています。</p>
<p class="meta"><b>全8回 ・ 穴埋め292問 ・ 論述13テーマ</b></p>
<div class="seg" id="modes"></div>
<p class="modehint" id="modehint"></p>
<div class="row" id="chips"></div>
<div class="hud" id="hud"></div>
<div class="track" id="track"><i></i></div>
<div id="note"></div>
<div id="stage"></div>
<div class="nav" id="nav"></div>
<div class="foot">
<div class="tools" id="tools"></div>
<p>学生が講義の復習用に作成した学習ツールです。出題は一般的な学術概念にもとづき、独自の文章で作成しています。講義資料そのものの複製ではありません。解答の記録はお使いのブラウザにだけ保存されます。</p>

は全部を受け取れる。","ch":[{"t":"諭旨"},{"t":"整理"},{"t":"懲戒"},{"t":"普通"}],"ans":0,"e":"法令で定められた解雇方法ではなく、懲戒解雇を雇用主が温情的に運用しているもの。"},{"ty":"mc","q":"経営上の理由による人員整理を（　）解雇といい、解雇権濫用法理の4要件を満たす必要がある。","ch":[{"t":"懲戒"},{"t":"整理"},{"t":"普通"},{"t":"諭旨"}],"ans":1,"e":"4要件＝①人員整理の必要性 ②解雇回避の努力義務 ③被解雇者の選定基準の妥当性 ④手続きの妥当性。"},{"ty":"mc","q":"ストレスチェック制度は、労働安全衛生法により一定規模の事業所に（　）されている。","ch":[{"t":"推奨"},{"t":"禁止"},{"t":"任意化"},{"t":"義務化"}],"ans":3,"e":"メンタルヘルス対策の一環として実施が義務づけられている。"},{"ty":"mc","q":"2015年から事業者に義務化された、労働者の心理的な負担の程度を把握する検査を何というか。","ch":[{"t":"ストレスチェック"},{"t":"適性検査"},{"t":"健康診断"},{"t":"人事考課"}],"ans":0,"e":"（5）ストレスチェックの義務化。メンタルヘルス対策の一環。"},{"ty":"mc","q":"職場において、労働者の意に反する性的な言動が行われるハラスメントを何というか。","ch":[{"t":"モラル・ハラスメント"},{"t":"パワー・ハラスメント"},{"t":"セクシャル・ハラスメント"},{"t":"マタニティ・ハラスメント"}],"ans":2,"e":"それを拒否するなどの対応により不利益を受けることを含む。パワハラ・マタハラと並べて押さえる。"},{"ty":"mc","q":"「リストラ」のもとの言葉は何か。","ch":[{"t":"リダクション"},{"t":"リストラクチャリング"},{"t":"リフォーメーション"},{"t":"リエンジニアリング"}],"ans":1,"e":"restructuring。もとは「事業の再構築」を意味する言葉で、人員削減だけを指す言葉ではない。"},{"ty":"mc","q":"リストラクチャリングの本来の意味として正しいものはどれか。","ch":[{"t":"賃金の引き下げ"},{"t":"事業の再構築"},{"t":"従業員の解雇"},{"t":"労働時間の短縮"}],"ans":1,"e":"不採算部門からの撤退、M&A、事業所の統廃合、分社化などを含む。日本では人員削減の意味で使われることが多い。"},{"ty":"mc","q":"もとは再雇用を条件とした一時解雇のことを指した言葉は何か。","ch":[{"t":"解雇"},{"t":"リストラ"},{"t":"レイオフ"},{"t":"懲戒免職"}],"ans":2,"e":"layoff（一時解雇または一時帰休）。現在では単なる大規模な解雇を指すこともある。"}]}]},{"id":"essay","label":"論述","kind":"read","hint":"各テーマの答案の骨格です。読みものなので採点はありません。","sections":[{"label":"第1回","title":"第1回の論述テーマ","note":"","items":[{"ty":"read","h":"テイラーの科学的管理法","sub":"テイラーの科学的管理法について、それが生まれた時代背景・具体的内容・後世への影響（限界を含む）を説明しなさい。","body":"・【背景・経営者側】成り行き管理＝過去の経験や勘に頼り、計画も手続きもない管理。能率を上げようと出来高給を導入したが、生産性が上がると経営者が賃率切り下げや標準作業量の引き上げを行った\n・【背景・従業員側】自然的怠業（本能からの怠け）と組織的怠業（意識的・集団的な生産制限）。組織的怠業の原因は①失業への懸念と同調圧力 ②標準作業量が恣意的で賃率も引き下げられた ③作業上の責任がすべて労働者任せ\n・テイラーは①は教育で改善できるが、②③は経営者側の問題だと考えた\n・【課業管理】①時間・動作研究（一流労働者の作業を要素分解し最適な動作を求め、一日の公正な作業量＝課業を確定）②作業条件の標準化 ③差別的出来高給制（達成者に高い賃率、未達成者に罰則的に低い賃率）\n・【3つのS】単純化（simplification）・標準化（standardization）・専門化（specialization）。若年未熟練労働者の生産性向上という当時の課題に応えるもの\n・【職能化原理】経営者が計画職能、労働者が執行職能を担当する＝「計画と執行の分離」\n・【人間観】経済合理人モデル。人は経済的動機のみで動くという前提\n・【限界】労働者は意思決定をしない「機械のように働くだけの人」となる。機械論的人間観と呼ばれ、この批判が後の人間関係論につながる\n・【意義】労働者は公正（justice）な条件のもとでより高い賃率を得られ、経営者は生産性向上と効率的管理を得た\n\n【書き方】\n「背景→内容→人間観→限界→次への接続」の順で書く。組織的怠業の3つの原因と課業管理の3本柱は、数を明示して箇条書き的に書くと情報量が伝わる。最後に必ず人間関係論への橋渡しで締めること。","kw":[]},{"ty":"read","h":"人間関係論とホーソン実験","sub":"ホーソン実験の経緯と発見事実を述べ、そこから導かれた人間関係論の主張を、科学的管理法と対比しながら説明しなさい。","body":"・【経緯】1924〜1932年、アメリカWestern Electric社のホーソン工場。当初は照明度という作業条件が生産性を左右すると予測されたが、照明実験では照明度と生産性に明確な相関は見つからなかった\n・続く継電器組立実験室の調査（1927〜1932）にハーバード大学のメイヨーとレスリスバーガーが参加。休憩時間・間食・労働時間短縮など作業条件を変えても生産高は上がり続けた\n・【発見事実】参加した女子工員のモラール（morale）が非常に高かった。モラールを高めた要因は、実験のために選ばれたというプライド、作業の分担やペースが自分たちの決定に任されていたこと、その決定過程を通じて相互の意思疎通がはかられ良好な人間関係が形成されたこと\n・【結論】モラールという心理的要因が生産性に関係し、モラールを決める重要な要因が人間関係である\n・【レスリスバーガーの指摘】組織をフォーマル（公式）とインフォーマル（非公式）に分類。公式組織は能率やコストの論理で動き、非公式組織は感情の論理で動く。自然発生的な非公式組織を意識した管理が必要\n・【人間観】社会人モデル。人は賃金だけでなく友情・安定感・帰属感を求める。有機体論的人間観と呼ばれる\n・【対比】科学的管理法＝経済合理人モデル／機械論的人間観／定量的要素（時間・動作研究と賃率）で生産性が決まる。人間関係論＝社会人モデル／有機体論的人間観／定性的要素（人間関係とコミュニケーション）とモラールで生産性が決まる\n・【接続】人間関係論は後の組織行動論（リーダーシップ論・モチベーション論）や近代管理論につながる\n\n【書き方】\n対比を表のように整理して書けると強い。「照明実験では相関が見つからなかった」という失敗から出発している点を落とさないこと。両者とも『働く人々の幸せ』を考えていた点は同じ、と締めると講義の趣旨に沿う。","kw":[]}]},{"label":"第2回","title":"第2回の論述テーマ","note":"","items":[{"ty":"read","h":"日本的経営と採用","sub":"日本企業の伝統的な人的資源管理の特徴を述べ、採用方法にどのような変化が生じているかを説明しなさい。","body":"・【三種の神器】Abegglen『日本の経営』(1958)、OECD対日労働報告書（邦訳1972）で「日本的経営の三種の神器」＝終身雇用・年功序列・企業別労働組合\n・【新卒一括定期採用】学校卒業予定者を毎年一括して採用し、内部で育成する。海外企業や外資系企業では部門別採用が多い\n・【変化】通年採用、職種別採用（専門職として早期に育成）、経験者（中途）採用＝教育コストが最小限で新しい経験や価値観をもたらす、アルムナイ採用（出戻り・カムバック）、リファラル採用（ツテ）などが増加\n・ただし⑦⑧（縁故・ツテ）にはメリット・デメリット双方が指摘される。とはいえ日本企業ではまだ新卒一括定期採用が中心\n・【採用計画の決定方法】欠員補充、売上高人件費比率や労働分配率に基づく算出（日本企業の労働分配率は60〜70%）、要員計画（定年退職者数や育成・昇進予定を組み込む＝戦略との関係が深い）\n・正社員は簡単に解雇できないため、非正規社員をバッファーとして用いる\n・【見ているポイント】共感する力を含む総合的な人物評価。自社の企業文化や雰囲気に合うかを短期間で判断するため、学生からは決め手が分かりにくい\n\n【書き方】\n「特徴→変化→なぜ変化したか」で構成する。三種の神器は出典（Abegglen／OECD報告書）と年号まで書けると情報量で差がつく。労働分配率60〜70%のような数字も入れる。","kw":[]}]},{"label":"第3回","title":"第3回の論述テーマ","note":"","items":[{"ty":"read","h":"評価制度の目的と危険性","sub":"日本企業における評価制度の目的を述べ、短期的な業績のみを評価することの危険性について論じなさい。","body":"・【前提】多くの日本企業では長期雇用を前提とした人材育成（能力開発）を主な目的として評価制度が設計されている\n・【目的6つ】①報酬・処遇の決定（昇進・昇格・昇給・賞与）②配置・異動の決定（適性の把握）③能力開発（人材育成）④後継者の発掘⑤従業員の動機付け⑥企業文化や価値観の表明（＝評価される方向に人は動く）\n・【危険性①】個人のコントロールの範囲かどうか分からない。組織活動の結果である業績が本当にその人の業績といえるのか。業績は環境条件の変化や配置によっても左右される\n・【危険性②】短期的な視野になってしまう。長期的な視野に立った能力の蓄積への関心が失われ、組織メンバーの協調性が失われる可能性がある\n・【危険性③】適切な人事施策を行うことが難しくなる。業績情報だけでは各人の能力や適性が分からない\n・【結論】だからこそ日本企業は成績考課・情意考課・能力考課を組み合わせ、能力考課を昇格・昇給や能力開発計画に用いている\n\n【書き方】\n目的6つは全部書く。危険性は3つとも「なぜそれが問題か」を一言添える。最後に「だから3つの考課を組み合わせている」と制度設計につなげると論述らしくなる。","kw":[]},{"ty":"read","h":"人事考課の3つの内容","sub":"人事考課の内容を3つに分けて説明し、それぞれがどのような場面で用いられるかを述べなさい。","body":"・①成績考課（業績評価；Performance Appraisal）……考課期間（通常は半年または一年）の仕事について目標の達成度を評価する。仕事の質と量、目標管理による業績評価。公務員では勤務評定と呼ばれることもある\n・②情意考課……組織メンバーとしての自覚や意欲など、考課期間における仕事への取り組み姿勢を評価する。協調性・積極性・責任感・規律を守るなど\n・③能力考課（能力評定）……職能資格制度を前提として、資格等級にふさわしい能力をどれだけ身につけたか（修得要件と習熟要件）、あるいはどの程度開発されたか（前期よりも伸びたか）を評価する。知識・技能、判断力、企画力、折衝力、指導力など\n・【使い分け】成績考課と情意考課は半年ごとの賞与決定に、能力考課は昇格・昇給の決定や能力開発計画の策定に用いられることが多い\n・上位の役職に進むにつれて、求められる能力や評価内容が変化する\n・【関連】行動評価（成果に関連する職務行動をとったか）、バリュー評価（経営理念をどのくらい体現しているか）\n・【評価要素】インプット＝属人的要素（能力＝顕在能力と潜在能力、個人特性）／スループット＝仕事的要素（情意、職務関連行動・コンピテンシー）／アウトプット＝業績\n\n【書き方】\n3つの定義だけで終わらず、「賞与か昇格か」という使い分けまで書くこと。インプット・スループット・アウトプットの整理を添えると評価要素の理解も示せる。","kw":[]},{"ty":"read","h":"対人認知の誤り","sub":"人事評価において生じる対人認知の誤りを複数挙げて説明し、それがなぜ問題となるのかを述べなさい。","body":"・ハロー効果（halo effect）……他者の一次元についての評価が、他の次元についての評価に影響すること。明確な根拠のない論理誤差の一形態ともいわれる\n・寛大（寛容）効果と厳格化傾向……ある部下、あるいは複数の部下を一貫して実際よりも高く評価してしまうこと（＝人事評価は甘くなりがち）。厳格化傾向はその逆\n・中心化傾向……実際の姿と関係なく評価が尺度の中央に集まる（ABC三段階でBに集中）\n・論理誤差（論理的誤謬）……本来は独立した別々の特性なのに、一貫性を気にしすぎて似た事柄を関連づける（体育会だから忍耐力があるはずだ）\n・ステレオタイプ化……広く浸透した固定観念や思い込みに引きずられる\n・対比誤差……評価者が自分の能力や価値観・行動スタイルを基準に評価する。得意なことには厳しく苦手なことには甘い。絶対評価の場合に発生しやすい\n・逆算化傾向……先に全体の評価結果を決め、それに沿う個別評価をしてしまう\n・直近（遠近）効果……評価時期に近い業績に評価が影響される\n・相似効果……価値観や出身地・出身校が評価者と類似する者を良く評価してしまう\n・初期印象効果……初期の印象的な事柄で評価が偏る\n・【問題性】評価の目的（処遇決定・配置・能力開発・動機付け）が達成できなくなる。とくに「評価される方向に人は動く」以上、誤った評価は従業員の行動を誤った方向に導く\n・【対応】評価者訓練、多面評価（360度評価）、手続き的公正の確保\n\n【書き方】\n全部書く必要はないが、5つ以上は挙げて定義を添える。似ているもの（ハロー効果と論理誤差、対比誤差と相似効果）は違いが分かるように書き分ける。最後に「なぜ問題か」を評価制度の目的に結びつけて締める。","kw":[]},{"ty":"read","h":"目標管理制度（MBO）","sub":"目標管理制度（MBO）の目的と問題点について説明しなさい。","body":"・【定義】考課者（直属上司）と被考課者（従業員）との間で業績目標に関する合意を期初に取り、その達成度を期末に評価する制度\n・【出自】Drucker（1954）が提唱。そもそも評価制度としてではなく、動機づけのためのシステムとして位置づけられていた\n・【目的】①組織目標と個人目標を統合する ②目標を定量化して測定しやすくする ③従業員の自主性・自立性を高め成果の確実性を高める ④業績評価を通じて個人の責任を明確化し能力開発を進める ⑤上司と話し合う機会を増やしコミュニケーションを促進する\n・【問題点】①個人目標の設定が難しい部門（職務）がある ②個人目標の難易度をそろえるのが難しい ③目標達成が運・不運や同僚の協力に影響される場合がある ④目標以外のことに関心を寄せなくなってしまう\n・【関連】360度多面評価法など他の評価制度と組み合わせて運用されることがある\n\n【書き方】\nDruckerが「評価制度ではなく動機づけの仕組みとして」提唱した点は落としやすいので必ず入れる。問題点④は、評価制度全般の「評価される方向に人は動く」という論点と同じ構造なので、そこに結びつけると深く見える。","kw":[]}]},{"label":"第4回","title":"第4回の論述テーマ","note":"","items":[{"ty":"read","h":"年功給・職務給・職能給の比較","sub":"基本給の決定基準である年功給・職務給・職能給について、それぞれの特徴とメリット・デメリットを比較しながら説明しなさい。","body":"・【前提】賃金は大きく、仕事の価値・成果に対する「仕事給」と、人の属性・能力に対する「属人給」に分かれる\n・【年功給】年齢・勤続年数などの個人属性で賃金額を決定。メリット＝①長期的視野に立った能力開発が行いやすい ②従業員が定着しやすい ③協調性を高めやすい。デメリット＝①能力や業績で差がつかずモチベーション低下 ②中高年齢者が増えると人件費が増大 ③ポスト不足に対応できない ④終身雇用前提のため中途採用者の処遇が難しい\n・【年功増大の論拠】①生活保障給説・生計費維持仮説（労働者の立場）②熟練仮説（企業・労働者双方の立場。勤続年数に応じて熟練と賃金が増大）③職場秩序仮説（長幼の序という社会規範。経営との関係は弱い）\n・【職務給】職務分析・職務評価により職務の価値・重要度・困難度に基づいて賃金を決定。プロセスは①職務分析（job analysis）→職務記述書（job description）の作成 ②職務評価（job evaluation）→価値の相対的序列づけ ③賃金への結びつけ。同一労働同一賃金の原則\n・【職務給のメリット】①基準が明確で上司の恣意が入りにくい ②中途採用者の処遇が容易で外部から人材を獲得しやすい ③コスト増になりにくい（仕事が変わらなければ賃金は同じ）\n・【職務給のデメリット】①職務分析・職務評価にコストがかかる ②環境変化が激しいと頻繁な見直しが必要 ③異動やローテーションが行いにくい ④職務が明確なため協力関係が希薄になり、担当が不明確な仕事に誰も取り組まない ⑤生計費が考慮されにくい\n・【職能給（能力給）】職能資格や情意などの個人属性で賃金を決定。メリット＝①昇格と昇進が分離し組織の柔軟性が高く異動が容易 ②共通尺度で公平に評価できる ③能力開発が促進される ④ゼネラリストが生まれやすい ⑤ポスト不足でも賃上げ可能。デメリット＝①職能要件があいまいで運用が年功的になりやすく高資格者が増えると人件費高騰 ②給与と生産性のギャップ ③降格が難しく賃下げも難しい ④スペシャリストの養成が難しい\n・【まとめ】職能給は理念としては仕事給だが、運用が属人給になってしまいがち\n\n【書き方】\n3つを並べるだけでなく、「日本企業がなぜ職能給を選んだのか」（ポスト不足への対処・異動のしやすさ）まで書くと論述になる。定期昇給とベースアップ（ベア）の区別、電産型賃金体系にも触れられると良い。","kw":[]}]},{"label":"第5回","title":"第5回の論述テーマ","note":"","items":[{"ty":"read","h":"職能資格制度","sub":"職能資格制度の仕組みを説明し、それが日本企業に広く導入された理由と、運用上の問題点を論じなさい。","body":"・【定義】社内の役職とは別に、職務遂行能力（＝職能）によって格づけされた資格をもとに、従業員の評価・報酬決定・育成・処遇を行う制度。1960年代半ばから1990年代にかけて大企業を中心に導入\n・【実践的意味】企業内の職能資格と職位（役職）を切り離す＝役職が上がらなくても賃上げができる。正規社員のみに適用され、転職しても他社では通用しない\n・【ポイント】①各資格等級に職務遂行能力要件（職能要件）が定められ全従業員がいずれかの等級に格づけされる ②必要滞留年数が定められ、職能要件を満たしても年数を経なければ昇格候補にならない ③等級によっては昇格試験を実施 ④職能資格等級と昇進は緩やかにリンク ⑤給与は職能資格等級に応じて支払われ昇進とは分離\n・【導入理由】団塊の世代が管理職年齢に達しポスト（役割）不足が発生したため、役職で処遇できない優秀な従業員を資格昇格によって処遇する必要があった\n・【昇進と昇格の区別】昇進＝職位・役職が上がること（役職昇進）／昇格＝職能資格が上がること（資格昇格）\n・【問題点】職能要件があいまいになりがちで測定・評価が難しく、必要滞留年数と相まって運用が年功的（年功賃金）になりやすい。降格もほとんどなく、高資格者が増えると人件費が高騰する。スペシャリストの養成が難しい\n・【評価】理念としては能力に基づく仕事給だが、運用面では属人給に近づいてしまう\n\n【書き方】\n「なぜ導入されたか＝ポスト不足」がこの問いの核心。必要滞留年数と降格の少なさが年功賃金化の原因、という因果を明示すること。昇進と昇格の区別は用語問題としても頻出。","kw":[]},{"ty":"read","h":"日本企業の昇進管理","sub":"日本企業の昇進管理の特徴を、昇進格差のつけ方の3類型に触れながら説明し、その長所と短所を論じなさい。","body":"・【昇進管理の目的】①人材育成（能力開発）＝OJTを効率的に行うため易しい仕事から難しい仕事へ担当職務を変えていく ②選抜＝ポストには限りがあり上位役職ほど企業業績への影響が大きい ③動機付け＝賃金に大きな格差がつかないため昇進で動機づける\n・【昇進のスピード】速めるとモチベーションは向上するが能力開発が追いつかず従業員が疲弊する。緩めると能力開発や選抜を確実に行えるがモチベーションが低下する可能性がある\n・【3類型】①一律年功型＝同期同時昇進（キャリア初期1〜8年目あたり、格差を一切つけない）②昇進スピード競争型＝同期時間差昇進（キャリア中期、昇進の速さに差をつけるが遅れてもいずれ同じ役職に昇進する＝敗者復活あり）③トーナメント競争型＝選抜（キャリア後期のサバイバル・レース。トップ組で昇進できなければ次の昇進競争に参加できない）\n・【日本企業のパターン】①〜③を組み合わせた「遅い選抜方式」\n・【昇進の基準】係長相当以下は能力評価、課長相当以上は業績評価を基準とする企業が多い。職位が上がると企業業績に直結する責任を負うため\n・【メリット】①各キャリア時期で必要な機能を果たしている（人材育成・能力開発→選抜）②長期にわたりモチベーションが維持されるよう合理的に設計されている ③早期に選抜しないため、さまざまな上司による評価の機会がありより正確な評価ができる\n・【デメリット】①長期にわたる厳しい競争で従業員が疲弊する ②同期で大きな差がつかずに昇進するため人件費負担が大きい ③長期雇用（終身雇用）を前提とするため、雇用の流動性が高まると成立しなくなる\n・【変化】ファースト・トラック（将来の幹部候補を入社後早期から養成するキャリア・ルート）は欧米では珍しくないが日本企業ではほとんどみられない\n\n【書き方】\n3類型はキャリアの時期（初期・中期・後期）と対応させて書くこと。「遅い選抜」という語をキーワードとして必ず使う。デメリット③（流動性が高まると成立しない）は、働き方の多様化の回とつなげられる。","kw":[]}]},{"label":"第6回","title":"第6回の論述テーマ","note":"","items":[{"ty":"read","h":"OJTとOff-JT","sub":"OJT・Off-JT・自己啓発について説明し、OJTとOff-JTのメリット・デメリットを比較しなさい。","body":"・【OJT】On the Job Training（職場内訓練）。日常業務を通じて上司や先輩が指導する\n・【OJTのメリット】①集合研修と比べてコストが安く時間をかけて行える ②社員の個性や能力・現状に沿ってきめ細やかな指導ができる ③職場内での後継者育成に適している\n・【OJTのデメリット】①仕事中心のため短期志向に陥りやすい ②上司や先輩の経験・知識による制約が大きい ③上下関係（タテの関係）のもとで展開されるためヨコへの広がりを持った組織行動の改善には適さない\n・【Off-JT】職場外訓練。仕事や職場を離れ、外部講師や教育担当者による集合教育の形で行われる。入社時や昇進時などキャリアの節目で行われることが多い\n・【Off-JTのメリット】①同じ階層や職能の労働者に同じプログラムを提供するため公平な教育ができる ②日常業務と間接的な関係をもつ知識・技能の習得により視野を拡げられる ③リフレッシュでき、研修を通じて社内の人的ネットワークが形成できる\n・【Off-JTのデメリット】①教育効果を正確に把握できない ②業務多忙により管理者が部下の派遣や自分の参加に消極的になる可能性 ③直接的・間接的にコストがかかる（研修開催のコストと、抜けている間に失う生産性）\n・【Off-JTの分類】①階層別教育（新入社員研修・管理者研修など）②職能別教育（営業研修・技術者研修など）\n・【自己啓発】社員の自発的な学習を会社がサポートするもので、基本的には就業時間外に行う。資格講座・通信教育・社会人大学院（MBA）など。企業が金銭的補助や時間を与えて支援する場合もある\n・【関連】日本企業はキャリアの幅が広いゼネラリストが多く、幅の狭いスペシャリストは少ないと言われる\n\n【書き方】\nメリット・デメリットが3つずつきれいに対応しているので、対比の形で書くと情報量が伝わりやすい。OJTのデメリット③（タテの関係でヨコに広がらない）とOff-JTのメリット③（人的ネットワーク）が補完関係にある、と書けると理解を示せる。","kw":[]}]},{"label":"第7回","title":"第7回の論述テーマ","note":"","items":[{"ty":"read","h":"働き方の多様化","sub":"働き方の多様化について、どのような軸で多様化が進んでいるかを整理し、それぞれの内容を説明しなさい。","body":"・【属性軸】就労者の多様化。男性正社員（正規従業員）を前提とした人的資源管理から脱却する必要。高年齢者雇用安定法（令和3年4月改正で70歳までの就業機会確保が努力義務、平成25年4月改正で65歳までの雇用機会確保が義務）、男女雇用機会均等法、女性活躍推進法、くるみんマーク・プラチナくるみん認定など\n・【正規・非正規軸】雇用形態の多様化。正社員＝企業と雇用契約を結び就業規則に従って働く。パートタイム・有期雇用労働法（令和3年4月1日施行）で「短時間労働者」＝一週間の所定労働時間が同一事業所の通常の労働者より短い者、「有期雇用労働者」＝期間の定めのある労働契約を締結している労働者と定義される\n・【時間・空間軸】勤務形態の多様化。従来は時短やフレックスタイム制度のような時間軸の施策が中心で、空間軸の施策はあまり検討されてこなかったが、新型コロナ感染症の拡大により大企業を中心に在宅勤務制度の本格導入が急速に進んだ。中心概念はテレワーク（Tele＝離れた場所で＋Work＝働く、リモートワークとも）\n・【雇用・非雇用軸】就労形態の多様化。自営型テレワーク＝ICTを用いて小規模オフィスまたは自宅で業務を遂行する個人事業者ないし10人以下の小規模事業者（以前はSOHOと呼ばれた）。⇔雇用型テレワーク（企業テレワーク）≒在宅勤務\n・【労働時間短縮】1992年 時短促進法、1994年 労働基準法改正で原則週40時間労働、2008年 労働時間等設定改善特別措置法。年間総実労働時間はバブルピーク時（1987年度）の2120時間から2021年には1777時間まで減少したが、サービス残業の増大や非正規雇用者の増加という統計上のトリックもある\n・【関連概念】ダイバーシティ・マネジメント（主な関心・課題は格差是正。マイノリティの処遇に関するアメリカ発の概念で性差だけを想定するものではない。近年はD＆I）、CSR＝企業の社会的責任（コンプライアンス、アカウンタビリティ、環境への取り組み、ワーク・ライフ・バランス）\n\n【書き方】\n4軸（属性／正規非正規／時間空間／雇用非雇用）を最初に提示してから各論に入ると読みやすい。年号と数字（2120時間→1777時間、70歳、65歳）を入れると情報量で差がつく。「統計上のトリック」への言及は批判的視点を示せる。","kw":[]}]},{"label":"第8回","title":"第8回の論述テーマ","note":"","items":[{"ty":"read","h":"福利厚生とメンタルヘルス","sub":"福利厚生の分類と目的を説明し、あわせて職場のメンタルヘルス対策について述べなさい。","body":"・【福利厚生の定義】従業員およびその家族の福祉の向上のために、現金給与以外のかたちで支給される報酬の総称。フリンジ・ベネフィット（付加給付）＝給与所得者が給与以外に受ける経済的利益\n・【分類】法定福利厚生＝健康保険や厚生年金保険などの社会保険制度に基づき法的に義務づけられた保険料負担など、公的な社会保障システムの一翼を担う／法定外福利厚生＝企業が任意に行うもの\n・【目的】従業員の生活の安定を保障することで人材の確保と定着および労使関係の安定を図る。職位や業績・成果に関係なく、従業員の生活のニーズに応じて提供される点が報酬と異なる\n・【カフェテリアプラン】従業員が用意されたメニューから必要なものを選択する福利厚生制度。必要な福利厚生は勤務地域・年齢・性別・家族構成などにより異なるため\n・【組織ストレスのモデル】ストレッサ＝ストレスの原因となる刺激（家庭の問題、経済的困窮など）／ストレイン＝ストレスの結果としての反応／モデレータ＝ストレスの緩衝要因（buffer）／コーピング＝ストレスへの対処（情動焦点型は問題そのものの処理ではなく自分の気持ちを変化させる努力）\n・【現状】厚生労働省の調査では仕事や職場でストレスを感じている者は60%を超える。メンタルヘルスの悪化はパフォーマンスに影響し企業業績を悪化させる。人をじっくり育てる余裕がない企業、組織や職場とのつながりが希薄な企業などで心の病が生じやすい\n・【ストレスチェックの義務化】労働安全衛生法の改正による。高ストレス者は本人の申出により企業が面接指導を実施しなければならない。面接指導はストレスその他の心身や勤務の状況を確認し、適切な措置につなげるためのもの\n\n【書き方】\n福利厚生とメンタルヘルスは別テーマに見えるが、どちらも「賃金以外で従業員の生活と健康を支える仕組み」という点で共通する。組織ストレスのモデル（ストレッサ・ストレイン・モデレータ・コーピング）は組織行動論の第5章とまったく同じなので、そちらの知識がそのまま使える。","kw":[]}]}]},{"id":"rec","label":"自己採点","kind":"quiz","hint":"空欄を見て頭のなかで答え、「答えを見る」で確認して自分で○✕をつけます。記録は4択とは別に残ります。","sections":[{"label":"第1回","title":"第1回 経営学説史の復習","note":"","items":[{"ty":"recall","q":"過去の経験や勘に頼って仕事の計画や標準を持たない管理を（　）管理という。テイラーはこれを批判した。","a":"成り行き","e":"成り行き管理＝計画も標準もない、行き当たりばったりの管理。テイラーの批判の出発点。"},{"ty":"recall","q":"労働者が集団で申し合わせて生産量を抑えることを（　）という。","a":"組織的怠業","e":"賃率を下げられないよう、集団で意図的に手を抜くこと。背景には同調圧力がある。"},{"ty":"recall","q":"一流労働者の作業を要素分解し、最も効率的な方法と時間を測って課業を決める研究を（　）研究という（time motion study）。","a":"時間・動作","e":"時間研究と動作研究の組み合わせ。これで「課業＝標準作業量」を確定する。"},{"ty":"recall","q":"課業を達成した者には高い賃率、達成できない者には低い賃率を適用する制度を（　）という。","a":"差別的出来高給制","e":"アメとムチで課業達成を促す仕組み。背景に「経済合理人モデル」の人間観がある。"},{"ty":"recall","q":"科学的管理法の3S（作業の合理化3原則）とは、単純化・（　）・専門化である。","a":"標準化","e":"単純化(simplification)・標準化(standardization)・専門化(specialization)。"},{"ty":"recall","q":"経営者は計画職能（管理職能）を、労働者は執行職能（作業職能）を担当するという考え方を（　）原理という。","a":"職能化","e":"計画と執行の分離。労働者は意思決定をしない、という発想につながる。"},{"ty":"recall","q":"科学的管理法は労働者を機械の部品のように扱うとして「（　）的人間観」と批判され、これが人間関係論を生む背景となった。","a":"機械論","e":"機械論的人間観への反省が、次のホーソン実験・人間関係論につながる。"},{"ty":"recall","q":"メイヨーやレスリスバーガーが参加した、シカゴ郊外の工場での一連の実験を（　）実験という。","a":"ホーソン","e":"継電器組立実験室(1927〜1932)などの調査。人間関係論の出発点。"},{"ty":"recall","q":"ホーソン実験で、生産性を高めた要因として注目された従業員の士気・やる気を（　）という（morale）。","a":"モラール","e":"モラール＝集団の士気。個人の動機づけを指すモチベーションと区別する。"},{"ty":"recall","q":"レスリスバーガーは組織を、制度上の公式組織と、自然発生的な（　）組織の2つに分類した。","a":"インフォーマル","e":"インフォーマル（非公式）組織＝自然発生的な人間関係。公式組織だけを見る経営管理論を批判した。"},{"ty":"recall","q":"公式組織は「（　）やコストの論理」で動くとされた。","a":"能率","e":"公式組織＝能率・コストの論理／非公式組織＝感情の論理。"},{"ty":"recall","q":"テイラーの科学的管理法は、労働者を賃金という経済的誘因で動く存在とみなした。この人間観を「（　）モデル」という。","a":"経済合理人","e":"経済合理人モデル。後の人間関係論では「社会人モデル」へと転換していく。"},{"ty":"recall","q":"課業を決める際、労働者が達成すべき一日の正当な作業量を（　）という。","a":"標準作業量","e":"経営者が恣意的にこれを引き上げ、賃率を切り下げたことが組織的怠業の背景になった。"},{"ty":"recall","q":"経営者は計画職能（管理職能）を、労働者は（　）職能（作業職能）を担当する。","a":"執行","e":"計画と執行の分離。労働者は意思決定をしないという発想につながる。"},{"ty":"recall","q":"非公式組織は「（　）の論理」で動くとされ、公式組織の「能率やコストの論理」と対比される。","a":"感情","e":"公式組織＝能率・コストの論理／非公式組織＝感情の論理。"},{"ty":"recall","q":"生産性が向上したとき、経営者側が行っていた2つのこととは。1つは標準作業量の引き上げ、もう1つは何か。","a":"賃率の切り下げ","e":"労働者が努力しても、賃率を切り下げられ標準作業量を引き上げられるので報われない。これが組織的怠業の原因になった。"},{"ty":"recall","q":"頑張る同僚は迷惑な存在とされ、相互に頑張らないよう働く力を何というか。","a":"同調圧力","e":"組織的怠業が生じる背景。集団の中で「出る杭は打たれる」状態になる。"},{"ty":"recall","q":"科学的管理法の3つのSのうち、作業を単純な仕事に分解し、各仕事について最善の方法を確立することを何というか。","a":"単純化（simplification）","e":"3S＝単純化・標準化・専門化。単純化＝仕事を分解、標準化＝適用範囲を広げる、専門化＝適した人を選抜。"},{"ty":"recall","q":"科学的管理法の3つのSのうち、分析された仕事を遂行するのに最も適した労働者を選抜することを何というか。","a":"専門化（specialization）","e":"3Sの3つ目。人を仕事に合わせて割り当てる考え方。"},{"ty":"recall","q":"職能化原理において、経営者が担当するのは何職能か。","a":"計画職能（管理職能）","e":"経営者＝計画職能（管理職能）、労働者＝執行職能（作業職能）。これを「計画と執行の分離」という。"},{"ty":"recall","q":"公式組織は「能率」と何の論理で動くとされるか。","a":"コスト","e":"公式組織＝能率やコストの論理／非公式組織＝感情の論理。この対比が頻出。"},{"ty":"recall","q":"人間関係論が想定した、社会的欲求の充足を重視する人間モデルを何というか。","a":"社会人モデル","e":"伝統的管理論の経済合理人モデル・機械人モデルに対置される。"},{"ty":"recall","q":"人間関係論の人間観は何と言われるか。","a":"有機体論的人間観","e":"科学的管理法＝機械論的人間観／人間関係論＝有機体論的人間観。この対比で覚える。"},{"ty":"recall","q":"人間関係論は、後のリーダーシップ論やモチベーション論など、どの分野につながっていくか。","a":"組織行動論","e":"人間関係論 → 組織行動論・近代管理論という流れ。"},{"ty":"recall","q":"「組織の高成果をもたらす唯一最善の組織は存在しない」とする理論を何というか。","a":"コンティンジェンシー理論","e":"contingency theory。状況に依存するという考え方。ファヨールの管理過程論、ウェーバーの官僚制組織論と並べて出題される。"},{"ty":"recall","q":"人的資源マネジメントの役割のうち、人員の募集・採用から退職の世話に至るまでの一連の活動を何管理というか。","a":"雇用管理","e":"採用、処遇・配置・異動、労働時間管理、雇用調整、退職管理などを含む。"},{"ty":"recall","q":"人的資源マネジメントの役割のうち、新入社員の教育から経営者育成教育までを含む活動を何と何というか。","a":"教育訓練・人材育成","e":"今日ではキャリア開発として具体的な制度が設計されている。"},{"ty":"recall","q":"人的資源マネジメントの役割のうち、従業員のモラールを高め、高いモラールを維持するための諸方策を何管理というか。","a":"モチベーション管理","e":"④にあたる。⑤の報酬管理と混同しやすい。"},{"ty":"recall","q":"人的資源マネジメントの役割のうち、報酬の与え方・決め方を工夫することでモチベーションや業績を高める諸方策を何管理というか。","a":"報酬管理","e":"人事考課、処遇（昇進管理）、賃金管理を含む。"},{"ty":"recall","q":"人的資源マネジメントの役割のうち、労働組合との団体交渉や労使協議制度の運営を何管理というか。","a":"労使関係管理","e":"有名なのは「春闘」。⑦にあたる。"},{"ty":"recall","q":"人的資源マネジメントの機能のうち、従業員を組織に引き留め、組織との一体感を高め、組織と個人のコンフリクトを少なくする機能を何というか。","a":"組織統合機能","e":"理論的背景は組織行動論。3機能＝作業能率促進・組織統合・変化適応。"},{"ty":"recall","q":"人的資源マネジメントの機能のうち、経営環境が変化した場合にその変化を吸収する機能を何というか。","a":"変化適応機能","e":"非正規労働者の活用などが例として挙げられる。"},{"ty":"recall","q":"人的資源マネジメントの機能のうち、個人やチームの生産性を高める機能の理論的背景となるものはどれか。","a":"テイラーの科学的管理法","e":"作業能率促進機能の背景。組織統合機能の背景が組織行動論であるのと対で押さえる。"}]},{"label":"第2回","title":"第2回 日本企業の採用","note":"","items":[{"ty":"recall","q":"アベグレン『日本の経営』(1958)を受け、OECD対日労働報告書が示した「日本的経営の（　）」とは、年功序列・終身雇用・企業別組合を指す。","a":"三種の神器","e":"アベグレン1958年、OECD報告書は邦訳1972年。"},{"ty":"recall","q":"組合員資格が企業内の正規従業員に限定される労働組合を（　）という。欧米の横断的な職業別労働組合と対比される。","a":"企業別組合","e":"日本＝企業の中に組合がある／欧米＝企業の外に職業別に組織される。"},{"ty":"recall","q":"企業単位で新卒を一括して定期採用し、入社後に各部署へ配置する方式を（　）という。","a":"新卒一括定期採用","e":"海外や外資系では部門別採用が多い、という対比で覚える。"},{"ty":"recall","q":"入社時の配属先を経理・法務・企画など専門性の高い職種に予め限定して採用する方式を（　）採用という。","a":"職種別","e":"職種別（部門別）採用。その分野のプロとして採る。"},{"ty":"recall","q":"本社が一括採用するのではなく、事業所ごと・支店ごとに採用する方式を（　）採用という。","a":"事業所別","e":"原則として事業所間の異動がないため、仕事の幅や昇進が限定される。"},{"ty":"recall","q":"勤務地や勤務時間、職種の条件を限定して契約した正社員を（　）正社員（エリア限定正社員）という。","a":"地域限定","e":"転居を伴う転勤がないタイプの正社員区分。"},{"ty":"recall","q":"従業員の家族や親戚など、何らかのかかわりがある人物を採用することを（　）採用という（俗に言うコネ入社）。","a":"縁故","e":"知人紹介による採用はリファラル(referral)採用、退職者の再雇用はアルムナイ(alumni)採用。"},{"ty":"recall","q":"一度退職した元従業員を再び採用することを（　）採用という（alumni）。","a":"アルムナイ","e":"alumni＝卒業生・同窓生。退職者ネットワークからの再雇用。"},{"ty":"recall","q":"学生が在学中に企業で就業体験をする制度を企業（　）制度という。目的は企業と学生のマッチングとリアリティショックの回避。","a":"インターンシップ","e":"リアリティショック＝入社前の期待と入社後の現実のギャップによる衝撃。"}]},{"label":"第3回","title":"第3回 日本企業の評価制度","note":"","items":[{"ty":"recall","q":"組織に属している従業員の貢献を秩序的・体系的に決定する手続きを（　）という。日常業務を通じて上司が部下を評価する仕組み。","a":"人事考課","e":"人事考課＝評価する手続きそのもの。"},{"ty":"recall","q":"考課期間の仕事について、目標の達成度を対象として評価するものを（　）考課という（業績評価）。","a":"成績","e":"成績考課＝Performance Appraisal。何を達成したか。"},{"ty":"recall","q":"勤務態度や意欲、企業が重視する価値観の体現度を評価するものを（　）考課という。","a":"情意","e":"情意＝意欲・態度の面。成果に結びつくよう能力発揮したかを見る。"},{"ty":"recall","q":"知識・技能、判断力、企画力、折衝力、指導力などを評価するものを（　）考課という（能力評定）。","a":"能力","e":"成績・情意・能力の3考課をセットで押さえる。"},{"ty":"recall","q":"ある一つの優れた（劣った）特徴に引きずられて、他の項目まで同じ方向に評価してしまう誤差を（　）効果という。","a":"ハロー","e":"halo effect＝後光効果。全体印象に引きずられる。"},{"ty":"recall","q":"評価が全体的に甘くなりがちな傾向を（　）効果といい、その逆を厳格化傾向という。","a":"寛大（寛容）","e":"寛大化↔厳格化のペアで覚える。"},{"ty":"recall","q":"評価が中央付近に集中し、優劣の差がつかなくなる傾向を（　）傾向という。","a":"中心化","e":"「どちらとも言えない」に逃げてしまうエラー。"},{"ty":"recall","q":"インプットに対する評価は（　）的要素、スループットに対する評価は仕事的要素と呼ばれる。","a":"属人","e":"インプット＝能力・個人特性（属人的）／スループット＝職務行動（仕事的）／アウトプット＝業績。"},{"ty":"recall","q":"本来は独立した別々の特性を、一貫性を気にするあまり関連づけて評価してしまう誤差を（　）という。","a":"論理誤差","e":"「体育会で部活動をやっていたから忍耐力があるはずだ」など。ハロー効果は「明確な根拠のない論理誤差」の一形態ともいわれる。"},{"ty":"recall","q":"評価者が自分の能力や価値観、行動スタイルを基準に評価してしまう誤差を（　）という。","a":"対比誤差","e":"自分の得意なことには厳しく、苦手なことは甘く評価してしまう。絶対評価で起きやすい。"},{"ty":"recall","q":"先に全体の評価結果を決め、それに沿うように個別評価をしてしまうエラーを（　）傾向という。","a":"逆算化","e":"結論が先にあり、辻褄を合わせる形で個々の評価をつけてしまう。"},{"ty":"recall","q":"人事評価の結果は従業員の行動を変える力を持つ。これを表す言葉が「（　）」である。","a":"評価される方向に人は動く","e":"評価制度が企業文化を形成し、組織行動を変化させるという考え方。"},{"ty":"recall","q":"人事考課を行う際、人事部門が担う役割を表す言葉はどれか。","a":"人事参謀","e":"（1）人事考課（人事評価）＝組織に属している従業員の組織に対する貢献を秩序的・体系的に決定する手続き。"},{"ty":"recall","q":"社員の仕事ぶりに関する評価のことで、昭和のころまでよく用いられていた語は何か。","a":"査定","e":"人事考課とほぼ同義だが、やや古い言い方。"},{"ty":"recall","q":"人事考課の目的のうち、昇進・昇格・昇給・賞与などを決定するものはどれか。","a":"報酬・処遇の決定","e":"①にあたる。人事考課の目的は①報酬・処遇②配置・異動③人材育成④動機付け⑤企業文化の表明など。"},{"ty":"recall","q":"人事考課の目的のうち、従業員各人の適性を把握するために行うものはどれか。","a":"配置・異動の決定","e":"②にあたる。誰をどこに置くかを決めるための評価。"},{"ty":"recall","q":"人事考課の目的のうち、どのような分野の能力を開発すべきかを判断するものはどれか。","a":"人材育成（能力開発）","e":"③にあたる。評価を育成につなげる観点。"},{"ty":"recall","q":"人事考課の目的のうち、従業員のモチベーションを高めることを何というか。","a":"動機付け","e":"⑤にあたる。評価そのものが動機付けの手段になる。"},{"ty":"recall","q":"人事考課の目的のうち、⑥にあたる「組織が何を大切にしているか」を示すものはどれか。","a":"企業文化や価値観の表明","e":"何を評価するかが、その組織の価値観を従業員に伝える。「評価される方向に人は動く」。"},{"ty":"recall","q":"人事評価における能力は、顕在能力と何に分けられるか。","a":"潜在能力","e":"ability, capability。顕在能力（発揮能力）と潜在能力（保有能力）の対。"},{"ty":"recall","q":"インプットに対する評価は何的要素と呼ばれるか。","a":"顕在的要素","e":"インプット＝能力・個人特性（traits：責任感、判断力、積極性、協調性）。"},{"ty":"recall","q":"スループットに対する評価は何的要素と呼ばれるか。","a":"仕事的要素","e":"スループット＝情意（労働意欲・努力）。インプット→スループット→アウトプットの3段階で評価対象を整理する。"},{"ty":"recall","q":"評価のエラーの総称として用いられる語はどれか。","a":"認知バイアス","e":"ハロー効果、寛大化傾向、中心化傾向などの総称。"},{"ty":"recall","q":"寛大化傾向と対になる、実際よりも低く評価してしまう傾向を何というか。","a":"厳格化傾向","e":"寛大（寛容）化＝甘く、厳格化＝辛く。人事評価は一般に甘くなりがちとされる。"},{"ty":"recall","q":"評価時期に近い業績や事柄に評価が影響を受けてしまうエラーを何というか。","a":"直近（遠近）効果","e":"⑦にあたる。期末の出来事に引きずられる誤り。"},{"ty":"recall","q":"価値観や出身地（出身校）など、評価者と類似・共通する被評価者を良く評価してしまうエラーを何というか。","a":"相似効果","e":"⑧にあたる。自分と似た人を高く評価してしまう。"},{"ty":"recall","q":"ワイナーの帰属理論において、内部属性かつ安定的な要因はどれか。","a":"能力","e":"内部×安定＝能力／内部×不安定＝努力／外部×安定＝課題困難度／外部×不安定＝運。この4象限で覚える。"},{"ty":"recall","q":"ワイナーの帰属理論において、外部属性かつ安定的な要因はどれか。","a":"課題困難度","e":"課題の難しさは自分の外にあり、かつ変動しにくい。"},{"ty":"recall","q":"ワイナーの帰属理論において、内部属性かつ変動しやすい要因はどれか。","a":"努力","e":"努力は自分次第で、そのつど変わりうる。"},{"ty":"recall","q":"ワイナーの帰属理論において、外部属性かつ変動しやすい要因はどれか。","a":"運","e":"運は自分の外にあり、かつ変動する。4象限のうち唯一のこの組み合わせ。"},{"ty":"recall","q":"ケリーの帰属の3基準のうち、「同じような状況に直面した人も同じ対応をとるかどうか」を見るものはどれか。","a":"合意（一致）性","e":"consensus。他の人も同じ行動をとるなら状況（外的）要因が強い。"},{"ty":"recall","q":"ケリーの帰属の3基準のうち、「状況が異なれば、その人は別の行動をとるかどうか」を見るものはどれか。","a":"弁別性","e":"distinctiveness。状況によって行動が変わるなら外的要因が強い。"},{"ty":"recall","q":"ケリーの帰属の3基準のうち、「その人はいつも同じように対応しているかどうか」を見るものはどれか。","a":"一貫性","e":"consistency。3基準＝合意性・弁別性・一貫性。"},{"ty":"recall","q":"事象の原因を行為者の要因に帰属させることを何というか。","a":"内的帰属","e":"内的帰属＝行為者の要因／外的帰属＝環境要因。ワイナーでいえば外的は課題の難しさや運。"},{"ty":"recall","q":"事象の原因を環境要因に帰属させることを何というか。","a":"外的帰属","e":"内的・外的の対で覚える。"},{"ty":"recall","q":"ロッター（1966）が示した「統制の所在」を英語で何というか。","a":"ローカス・オブ・コントロール","e":"Locus of control。出来事を自分の内側／外側どちらの統制と捉えるか。"},{"ty":"recall","q":"目標管理制度の目的のうち、③にあたる「従業員の何を高め、成果の確実性を高めること」か。","a":"自主性・自立性","e":"目標を自分で立てさせることで主体性を引き出す。"},{"ty":"recall","q":"目標管理制度において、上司と話し合う機会を増やすことで促進されるものは何か。","a":"コミュニケーション","e":"⑤にあたる。面談を通じた対話そのものに意味がある。"},{"ty":"recall","q":"上司・部下・同僚・顧客などの人々から評価を受ける方法を何というか。","a":"360度フィードバック（多面評価法）","e":"多面的観察評価法ともいう。主に個人の能力開発を目的とする。"},{"ty":"recall","q":"360度フィードバックの評価者に、上司・部下・同僚のほかに含まれうるのは誰か。","a":"顧客","e":"社外の視点も含めた多面的な評価という点が特徴。"},{"ty":"recall","q":"ある職務または状況に対し、基準に照らして効果的あるいは卓越した業績を生む原因となる特性を何というか。","a":"コンピテンシー","e":"高業績者の行動特性。能力そのものではなく「成果につながる行動」に着目する。"},{"ty":"recall","q":"組織的公正の2側面のうち、限られた資源や成果を分配する場合に要求される結果の公正を何というか。","a":"分配的公正","e":"分配的公正＝結果の公正／手続き的公正＝過程の公正。"},{"ty":"recall","q":"ドイッチュの3つの分配原理のうち、経済的生産性に対応し、高い貢献をした人が高いアウトカムを得る分配方法はどれか。","a":"衡平（equity）分配","e":"Deutsch（1975）。衡平・平等・必要性の3つ。"},{"ty":"recall","q":"ドイッチュの3つの分配原理のうち、親和的社会関係に対応し、成果を貢献した人数で均等に割る分配方法はどれか。","a":"平等（equality）分配","e":"あたまわり・割り勘のイメージ。「均等」ではなく「平等」が正しい語。"},{"ty":"recall","q":"ドイッチュの3つの分配原理のうち、福祉や個人の成長に対応し、必要性の高い人から順に高いアウトカムを得る分配方法はどれか。","a":"必要性（need）分配","e":"3原理は衡平・平等・必要性。対応する価値（経済的生産性・親和的社会関係・福祉）とセットで押さえる。"},{"ty":"recall","q":"アダムス（1963）が提唱した理論を何というか。","a":"公平（衡平）理論","e":"自分と他者のインプット／アウトカム比を比較する理論。過程理論に分類される。"},{"ty":"recall","q":"組織的公正の2側面のうち、意思決定過程つまり手続きの公正を何というか。","a":"手続き的公正","e":"分配的公正（結果）との対比で覚える。"},{"ty":"recall","q":"レヴェンサルの手続き的公正6ルールのうち、「一定期間は変更されない手続きか」を問うものはどれか。","a":"一貫性","e":"Leventhal（1980）。①一貫性②バイアスの抑制③情報の正確性④修正可能性⑤代表性⑥倫理性。"},{"ty":"recall","q":"レヴェンサルの6ルールのうち、「意思決定者が偏見や利己的な考え方に影響されないか」を問うものはどれか。","a":"バイアスの抑制","e":"②にあたる。評価者の私心を排除できているか。"},{"ty":"recall","q":"レヴェンサルの6ルールのうち、「意思決定のために用いられる情報が正確であるか」を問うものはどれか。","a":"情報の正確性","e":"③にあたる。"},{"ty":"recall","q":"レヴェンサルの6ルールのうち、「最終的な分配の意思決定過程で修正の機会があるか」を問うものはどれか。","a":"修正可能性","e":"④にあたる。異議申し立てや見直しの余地があるか。"},{"ty":"recall","q":"レヴェンサルの6ルールのうち、「分配を受ける組織メンバーの関心や価値観が反映されているか」を問うものはどれか。","a":"代表性","e":"⑤にあたる。当事者の声が反映されているか。"},{"ty":"recall","q":"レヴェンサルの6ルールのうち、「一般的な道徳や倫理基準に反しないものであるか」を問うものはどれか。","a":"倫理性","e":"⑥にあたる。6つを順に言えるようにしておく。"},{"ty":"recall","q":"フェスティンガー（1957）が提唱した、相矛盾する2つの認知が同時に存在するとき一方の認知を変化させるとする理論を何というか。","a":"認知的不協和理論","e":"cognitive dissonance theory。矛盾を解消するために認知のほうを変えてしまう。"},{"ty":"recall","q":"評価において最も重要なポイントとされるものは何性か。","a":"公平性","e":"報酬決定においても同じく「公平性」が重要とされる。評価制度と報酬制度で共通する結論。"},{"ty":"recall","q":"評価の公平性が持つ2つの側面とは、正確性と何か。","a":"納得性","e":"正確に測れているかだけでなく、本人が納得できるかが重要。「究極の完璧な評価制度など存在しない」という結論につながる。"}]},{"label":"第4回","title":"第4回 日本企業の報酬システム","note":"","items":[{"ty":"recall","q":"組織や第三者によって外部から与えられる報酬（賃金、昇進、地位、名声など）を（　）報酬という。","a":"外的","e":"extrinsic rewards。対は内的報酬(intrinsic)＝達成感・成長感・有能感など。"},{"ty":"recall","q":"職務遂行それ自体から得られる達成感・成長感・有能感などの報酬を（　）報酬という。","a":"内的","e":"intrinsic rewards。仕事そのものから得られる。"},{"ty":"recall","q":"労働者が一定の仕事をなした時間を基準として賃金を支払う形態を（　）給という（定額給）。","a":"時間","e":"対は出来高給（奨励給）＝遂行した仕事の数量が基準。"},{"ty":"recall","q":"労働者が遂行した仕事の数量を基準として賃金を支払う形態を（　）給という（奨励給）。","a":"出来高","e":"時間給↔出来高給。何を基準に測るか（時間か量か）。"},{"ty":"recall","q":"日本の賃金体系の元祖とされる、電気産業の労働組合が確立した賃金体系を（　）型賃金体系という。","a":"電産","e":"「電産」＝電気産業労働組合。生活保障を軸にした賃金体系の原型。"},{"ty":"recall","q":"年齢とともに増加する生計費に合わせて賃金を決定するという年功賃金の論拠を（　）説（生計費維持仮説）という。","a":"生活保障給","e":"労働者の立場からの論拠。生産性と賃金の結びつきは希薄。"},{"ty":"recall","q":"閉鎖的な労働市場では企業内の熟練が勤続年数に対応するという年功賃金の論拠を（　）仮説という。","a":"熟練","e":"企業・労働者双方の立場からの論拠。勤続＝熟練という前提。"},{"ty":"recall","q":"賃金水準を全体的に引き上げることを（　）といい、春闘の主要な交渉対象となる。","a":"ベースアップ（ベア）","e":"定期昇給＝個人が毎年上がる仕組み／ベア＝賃金表そのものを底上げ。区別が重要。"},{"ty":"recall","q":"職務の内容や求められる成果を明確に定義し、（　）（job description）を作成する作業を職務分析という。","a":"職務記述書","e":"職務分析→職務記述書→職務評価→職務給、という流れ。"},{"ty":"recall","q":"職務の価値を相対的に序列づける作業を（　）という（job evaluation）。","a":"職務評価","e":"職務分析（内容を明らかにする）と職務評価（価値を序列づける）を混同しない。"},{"ty":"recall","q":"職務給の考え方の根拠となる原則を「（　）」または「同一価値労働同一賃金」という。","a":"同一労働同一賃金","e":"同じ仕事なら同じ賃金、という職務基準の考え方。"},{"ty":"recall","q":"日常レベルでは賃金や給与とほぼ同じ意味で使われるが、組織行動論やモチベーション理論で用いられる用語はどれか。","a":"報酬","e":"報酬は内的報酬・外的報酬を含む広い概念。賃金より広い。"},{"ty":"recall","q":"賃金を意味することを明確にするために用いられる報酬の呼び方はどれか。","a":"金銭的（経済的）報酬","e":"「報酬」だけだと内的報酬も含むため、賃金に限定したいときにこう言う。"},{"ty":"recall","q":"内的報酬に含まれるものとして正しい組み合わせはどれか。","a":"達成感・成長感・有能感・自己実現","e":"職務遂行それ自体から得られる報酬。外的報酬（第三者から与えられる）と対になる。"},{"ty":"recall","q":"所得税法第28条が定義しているのは何所得か。","a":"給与所得","e":"俸給、給料、賃金、歳費及び賞与並びにこれらの性質を有するものに係る所得。"},{"ty":"recall","q":"健康保険法第3条5項が定義している、労働の対償として受けるすべてのものを指す語はどれか。","a":"報酬","e":"賃金、給料、俸給、手当、賞与その他いかなる名称であるかを問わない。法律によって用語の定義が異なる点に注意。"},{"ty":"recall","q":"報酬制度の目的のうち、②にあたるものはどれか。","a":"従業員のモラールを高める","e":"①優秀な人材の獲得と維持②モラールを高める③コスト管理、の3つ。"},{"ty":"recall","q":"人件費÷付加価値総額で求められる指標を何というか。","a":"労働分配率","e":"付加価値総額は売上総利益で近似される。全社レベルのコスト管理に用いる。"},{"ty":"recall","q":"企業内部において、個々の労働者に支払われる賃金を決定する際の基準・構成を何というか。","a":"賃金体系","e":"体系＝何を基準に決めるか（年功給・職務給・職能給など）。"},{"ty":"recall","q":"労働の対価として従業員に支払われる賃金の支払形態ないし支払単位のことを何というか。","a":"賃金形態","e":"形態＝どう払うか（時間給・出来高給など）。体系との違いが問われる。"},{"ty":"recall","q":"年齢・勤続年数などの個人属性によって賃金額を決定する賃金を何というか。","a":"年功給（年功賃金）","e":"日本企業独特のものとされる。電産型賃金体系がその原型。"},{"ty":"recall","q":"年功賃金のメリットとして挙げられるものはどれか。","a":"長期的視野に立った能力開発（人材育成）が行いやすい","e":"長く勤める前提なので、時間をかけた育成が可能になる。"},{"ty":"recall","q":"年功賃金のデメリットとして、中高年齢者の増加による人件費増大のほかに挙げられるものはどれか。","a":"ポスト（役職）不足に対応できない","e":"年功で上がっても、与えるポストがないという問題。職能資格制度導入の背景になる。"},{"ty":"recall","q":"賃金表そのものを書き換えて全体を底上げすることを何というか。","a":"ベースアップ（ベア）","e":"定期昇給は同じ賃金表の中で号俸が上がること。ベアは表自体が上がること。この違いが頻出。"},{"ty":"recall","q":"職務給の決定プロセスの第1段階で、職務の内容や求められる成果を明確に定義することを何というか。","a":"職務分析（job analysis）","e":"①職務分析→②職務評価→③賃金への結びつけ、という順序。"},{"ty":"recall","q":"職務分析の結果として作成される文書を何というか。","a":"職務記述書（job description）","e":"それぞれの職務の内容や求められる成果を明確に定義したもの。"},{"ty":"recall","q":"職務給の決定プロセスの第2段階で、職務価値の相対的序列づけを行うことを何というか。","a":"職務評価（job evaluation）","e":"②にあたる。人ではなく仕事に値段をつける作業。"},{"ty":"recall","q":"性別や雇用形態に関わらず、同一価値の職務には同一の賃金を支払うべきとする原則を何というか。","a":"同一価値労働同一賃金","e":"「同一労働同一賃金」が全く同じ仕事を指すのに対し、「同一価値労働」は異なる仕事でも価値が同等なら同じ賃金とする考え方。"},{"ty":"recall","q":"能力や情意などの個人属性によって賃金額を決定する賃金を何というか。","a":"職能給（職能資格給）","e":"職能資格制度に対応する賃金。人（能力）基準である点が職務給（仕事基準）と異なる。"},{"ty":"recall","q":"社内の役職とは別に、職務遂行能力によって格づけされた資格をもとに評価・報酬決定・育成・処遇を行う制度を何というか。","a":"職能資格制度","e":"昇格（資格が上がる）と昇進（役職が上がる）が分離している点が特徴。"},{"ty":"recall","q":"職能資格制度が導入された現実的な背景として挙げられるものはどれか。","a":"団塊の世代のポスト不足","e":"役職は足りないが処遇はしたい、という要請に応えた制度。"},{"ty":"recall","q":"職能資格制度のメリットとして、昇格と昇進が分離していることで容易になるものはどれか。","a":"異動（ローテーション）","e":"役職を外れても資格は下がらないので、組織内部の柔軟性が高まる。"},{"ty":"recall","q":"職能資格制度のもとで生まれやすいとされる人材はどれか。","a":"ゼネラリスト","e":"幅広い職能分野を経験させるため。逆にスペシャリストの養成が難しいのがデメリット。"},{"ty":"recall","q":"職能資格制度のデメリットとして挙げられるものはどれか。","a":"降格が難しく、賃下げも難しい","e":"理念としては仕事給だが、運用が属人給になってしまいがちという問題もある。"},{"ty":"recall","q":"業績ないし仕事の成果によって賃金額を決定する賃金を何というか。","a":"業績給（成果給）","e":"何を基準に賃金を決めるか、という軸で年功給・職務給・職能給・業績給・役割給を整理する。"},{"ty":"recall","q":"職務における「役割」の大きさを序列化して処遇を行い、賃金額に反映させる賃金を何というか。","a":"役割給","e":"職務等級制度と職能資格制度の中間的な性格を持つ。"},{"ty":"recall","q":"報酬決定において最も重要なポイントとされるものは何性か。","a":"公平性","e":"評価制度と同じ結論。何に対して報酬を支払うのかが問題になる。"},{"ty":"recall","q":"報酬制度を設計する際、従業員から引き出したい行動と報酬制度との間に必要とされるものは何性か。","a":"整合性","e":"報酬制度は従業員の認知と行動に大きな影響を与えるため。"},{"ty":"recall","q":"報酬制度を変更する際に重要になる、総額で捉える観点を何というか。","a":"生涯（獲得）賃金","e":"総額で考えると中高年齢者の賃金は下がるため、単年度ではなく生涯で見る視点が必要になる。"},{"ty":"recall","q":"報酬制度について導かれる結論として正しいものはどれか。","a":"唯一最善の普遍的な報酬制度は存在しない","e":"コンティンジェンシー理論と同じ発想。企業の状況によって最適な制度は変わる。"},{"ty":"recall","q":"同じ賃金表の中で、年齢や勤続に応じて号俸が上がることを何というか。","a":"定期昇給","e":"定期昇給＝表の中で上がる／ベースアップ＝賃金表そのものが上がる。この2つはセットで問われる。"},{"ty":"recall","q":"職務分析・職務記述書・職務評価の英語表記の組み合わせとして正しいものはどれか。","a":"job analysis／job description／job evaluation","e":"職務給の決定プロセス①職務分析（job analysis）→職務記述書（job description）作成→②職務評価（job evaluation）。"}]},{"label":"第5回","title":"第5回 従業員格付け制度","note":"","items":[{"ty":"recall","q":"従業員を職務遂行能力に応じて等級に位置づけ、その序列を報酬などの決定に用いる制度を（　）制度という。","a":"職能資格","e":"人（能力）基準。対応する賃金は職能給。"},{"ty":"recall","q":"職務の価値によって従業員を格付けする制度を（　）制度という（job grade）。ヘイ・システムの影響が大きい。","a":"職務等級","e":"仕事（職務価値）基準。対応する賃金は職務給。"},{"ty":"recall","q":"職務の価値ではなく、役割の価値や役割の遂行度によって従業員を格付けする制度を（　）制度という。","a":"役割等級","e":"職務等級の大括り版。日本企業で近年増えている。"},{"ty":"recall","q":"ポストに限りがある中で、能力の高い従業員を上位の役職に就けるために行うことを（　）という。","a":"選抜","e":"昇進管理の3つの機能＝配置・選抜・動機付け。"},{"ty":"recall","q":"昇進スピードを速めるとモチベーションは向上するが、（　）が追いつかないというデメリットがある。","a":"能力開発","e":"速い＝モチベ↑だが能力開発が追いつかない／緩い＝能力開発できるがモチベ↓。トレードオフ。"},{"ty":"recall","q":"入社後しばらくは同期が同時に昇進する昇進格差のつけ方を（　）昇進型という。","a":"同期同時","e":"一律年功型。日本企業のキャリア初期（1〜8年目あたり）に見られる。"},{"ty":"recall","q":"日本企業は同期同時→同期時間差→選抜を組み合わせた「（　）選抜方式」を採用しているとされる。","a":"遅い","e":"欧米の早期選抜に対し、日本は長く横並びで競わせてから絞る。"},{"ty":"recall","q":"優秀な人材を早期に選抜して幹部候補として育成する仕組みを（　）という（fast track）。","a":"ファースト・トラック","e":"将来の幹部候補生を入社後早い段階から養成するキャリア・ルート。欧米企業では珍しくないが、日本企業ではほとんどみられない。"},{"ty":"recall","q":"総合職・専門職・一般職など異なる職掌をコース別に運用する制度を（　）人事制度という。","a":"複線型（コース別）","e":"1986年4月施行の男女雇用機会均等法が背景にある。"},{"ty":"recall","q":"日本企業の資格制度のポイントは、（　）と職位を切り離すことにある。","a":"資格","e":"資格（等級）が上がる＝昇格／職位（役職）が上がる＝昇進。ポストがなくても処遇を上げられる。"},{"ty":"recall","q":"下位の職級に属する職務から上位の職級に属する職務へ異動すること（職位・役職が上がること）を（　）という。","a":"昇進","e":"昇進＝役職昇進。対して昇格は資格昇格（職能資格が上がること）。"},{"ty":"recall","q":"下位の資格から上位の資格に上がること（職能資格が上がること）を（　）という。","a":"昇格","e":"日本企業の資格制度のポイントは、資格と職位を切り離すこと。ポストがなくても処遇を上げられる。"},{"ty":"recall","q":"管理職の年齢に達した人数が多く、ポスト不足を招いた世代を「（　）」という。","a":"団塊の世代","e":"役職昇進中心の昇進管理が1970年代半ばごろから行き詰まる背景となった。"},{"ty":"recall","q":"女性の昇進を阻む、目に見えないが確かに存在する壁を（　）という。","a":"グラス・シーリング","e":"glass ceiling＝ガラスの天井。「課長職以上の管理職は男性が占めている」といった性差の解消が課題。"},{"ty":"recall","q":"職能資格制度に対応する賃金を何というか。","a":"職能給","e":"従業員を職務遂行能力に応じて職能資格等級に位置づける制度。人（能力）基準。"},{"ty":"recall","q":"職務等級制度（job grade）に対応する賃金を何というか。","a":"職務給","e":"職務等級制度はコンサルティング会社の影響（ヘイ・システム）が大きい。仕事基準。"},{"ty":"recall","q":"役割等級制度は、どの制度を大括りにしたものと位置づけられるか。","a":"職務等級制度","e":"職務を細かく分けず、役割の大きさでまとめた制度。"},{"ty":"recall","q":"職能資格制度が生まれた背景として、管理職の年齢になり不足が発生したのは何か。","a":"ポスト（役割）","e":"「団塊の世代」が管理職の年齢に達し、ポスト不足が発生した。"},{"ty":"recall","q":"資格等級ごとに設定されている、次の等級に上がるまでに必要な在籍年数を何というか。","a":"必要停留年数","e":"これが年功的な運用につながり、実質的な「年功賃金」になっているという指摘がある。"},{"ty":"recall","q":"昇進管理の目的のうち、①にあたるものはどれか。","a":"人材育成（能力開発）","e":"①人材育成②選抜③動機付け、が昇進管理の目的。"},{"ty":"recall","q":"昇進管理の目的のうち、賃金に大きな格差がつかないため、能力や業績向上の報酬として昇進を用いることを何というか。","a":"動機付け","e":"③にあたる。賃金で差をつけにくい日本企業では、昇進が重要な報酬になる。"},{"ty":"recall","q":"昇進スピードを速めた場合のデメリットは何か。","a":"能力開発が追いつかない","e":"Good：モチベーションが向上する／Bad：能力開発が追いつかない。"},{"ty":"recall","q":"昇進スピードを遅くした場合のデメリットは何か。","a":"モチベーションが低下する可能性がある","e":"がんばったのになかなか昇進できないため。Good：能力開発や選抜を確実に行いやすい。"},{"ty":"recall","q":"キャリア中期に昇進する速さに差をつける昇進のあり方を何というか。","a":"同期時間差昇進","e":"①同期同時（差を一切つけない）②同期時間差（速さに差をつける）③選抜という段階を踏む。"},{"ty":"recall","q":"総合職・専門職・一般職などをコース別に運用する、変形の職能資格制度を何というか。","a":"複線型（コース別）人事制度","e":"1986年4月施行の男女雇用機会均等法が契機となった。"},{"ty":"recall","q":"複線型人事制度における、総合職・一般職などの区分を何というか。","a":"職掌","e":"職掌・職位・職種・職能は混同しやすいので区別して覚える。"},{"ty":"recall","q":"複線型（コース別）人事制度の導入契機となった、1986年4月施行の法律は何か。","a":"男女雇用機会均等法","e":"正式名称は「雇用の分野における男女の均等な機会及び待遇の確保等女子労働者の福祉の増進に関する法律」。"},{"ty":"recall","q":"専門的な経験や知識のある人材を、管理職としてではなく処遇する制度を何というか。","a":"専門職制度","e":"ポスト不足への対応策のひとつでもある。"},{"ty":"recall","q":"日本企業の資格制度のポイントは、資格と何を切り離すことか。","a":"職位・役職","e":"資格（職能資格）と職位（役職）を分離することで、昇格と昇進を別に扱える。"},{"ty":"recall","q":"昇格や昇進のことを、方向を表す語で何の異動と呼ぶか。","a":"タテの異動（垂直方向への異動）","e":"昇格・昇進を伴わない異動は「ヨコの異動（水平方向への異動）」と呼ぶ。"},{"ty":"recall","q":"昇格や昇進を伴わない異動のことを何と呼ぶか。","a":"ヨコの異動（水平方向への異動）","e":"タテとヨコの対で覚える。"},{"ty":"recall","q":"企業が採用した労働者を最初の職場や仕事に割り当てることを何というか。","a":"配属（初任配属）","e":"（2）にあたる。その後の異動と区別する。"},{"ty":"recall","q":"従業員が現在従事している職務から別の職務へ移ることを何というか。","a":"異動（人事異動）","e":"（3）にあたる。異動には転勤・ジョブローテーション・配置転換などが含まれる。"},{"ty":"recall","q":"主に同じ職場内（職能部門内）で、担当する職務が変わることを何というか。","a":"ジョブ・ローテーション","e":"例：人事部採用担当から人事部研修担当への異動。"},{"ty":"recall","q":"個人の能力と担当する職務がアンバランス（ミスマッチ）になった場合に行う異動を何というか。","a":"配置転換","e":"③にあたる。ミスマッチの解消が目的。"},{"ty":"recall","q":"異動の目的のうち、①にあたるものはどれか。","a":"適性の発見機会を提供すること","e":"①適性の発見②経験の幅③能力の伸長④公正な評価⑤人的交流⑥労働需給ギャップの修正。"},{"ty":"recall","q":"異動の目的のうち、ある特定の上司との相性が悪い社員を埋もれさせないために行うものはどれか。","a":"公正な評価を行うこと","e":"④にあたる。評価者が変わることで救済される。"},{"ty":"recall","q":"異動の目的のうち、⑤の人的交流によって社内に築かれるものは何か。","a":"人脈づくり（人的ネットワーク）","e":"異なる職能部門や職能部門内の人的交流をはかること。"},{"ty":"recall","q":"異動の目的のうち、部門間の仕事量のアンバランスを修正・解消することを何というか。","a":"労働需給ギャップの修正","e":"⑥にあたる。組織全体で人員配置を最適化する。"},{"ty":"recall","q":"もともと在籍していた企業との雇用関係を残したまま、出向先とも雇用関係を結ぶことを何というか。","a":"出向","e":"雇用関係が2つある状態。中高年の従業員に対して行われる出向は、のちに転籍に移行する場合が多い。"},{"ty":"recall","q":"もともと在籍していた企業との雇用関係を終了させ、新たに雇用契約を結ぶことを何というか。","a":"転籍","e":"雇用関係が移る。出向との違いは「元の企業との関係が残るかどうか」。"},{"ty":"recall","q":"会社が必要とするポストや職種の要件をあらかじめ社内に公開し、応募者を募る制度を何というか。","a":"社内公募制度","e":"通常は外部に対して行う人材公募を社内で行うもの。"},{"ty":"recall","q":"社員が自らの経歴や能力、希望する職種を登録して売り込む制度を何というか。","a":"社内FA（フリーエージェント）制度","e":"社内公募は会社側から募集、社内FAは社員側から売り込む。方向が逆である点が重要。"},{"ty":"recall","q":"日本の労働市場で少しずつ進み、外部労働市場の形成につながっているものは何か。","a":"労働力の流動化","e":"ただし個人属性や職務遂行能力を基準とした雇用がおおむね維持されている。"},{"ty":"recall","q":"個人属性や職務遂行能力を基準とした日本型の雇用を何型雇用というか。","a":"メンバーシップ型雇用","e":"人を採用してから仕事を割り当てる。職務を基準とした雇用が「ジョブ型」。"},{"ty":"recall","q":"職務を基準とした雇用を何型雇用というか。","a":"ジョブ型雇用","e":"仕事に人をつける方式。日本では実践するには未だ不十分とされる。"},{"ty":"recall","q":"組織メンバーに割り当てられた職務の遂行に必要な権限と責任を示す組織上の地位を何というか。","a":"職位（役職）","e":"position。職掌（コース区分）・職種（業務内容）と混同しやすい。"},{"ty":"recall","q":"一般に職業の種類を指し、具体的な業務内容として捉えられるものを何というか。","a":"職種","e":"（4）にあたる。営業職・技術職・事務職など。"},{"ty":"recall","q":"一般職・総合職といった区分を指す語として、この講義で挙げられているものはどれか。","a":"職掌","e":"（7）にあたる。企業によって呼び名は異なる。複線型人事制度における区分。"},{"ty":"recall","q":"職能資格制度において、昇格と昇進の違いとして正しいものはどれか。","a":"昇格＝資格等級が上がる／昇進＝職位・役職が上がる","e":"この2つを切り離すのが日本企業の資格制度のポイント。"},{"ty":"recall","q":"職能資格制度において、昇進スピードの3類型として正しい順序はどれか。","a":"同期同時 → 同期時間差 → 選抜","e":"キャリア初期は差をつけず、中期で速さに差をつけ、後期で選抜する。日本企業の「遅い昇進」の特徴。"},{"ty":"recall","q":"日本企業の昇進の特徴を表す言葉はどれか。","a":"遅い昇進","e":"長期間かけて選抜するため、モチベーション維持と能力開発の両立が図られる。"},{"ty":"recall","q":"女性の昇進を阻む見えない壁を何というか。","a":"グラス・シーリング","e":"ファースト・トラック（早期選抜コース）と対で出題される。"}]},{"label":"第6回","title":"第6回 人材育成","note":"","items":[{"ty":"recall","q":"知識や技術を計画的に習得させることによって人材の育成を図るものを（　）という。","a":"教育訓練","e":"人材育成＝教育訓練＋キャリア開発、という関係。"},{"ty":"recall","q":"個人がさまざまな経験や訓練を通じて、自分の職業人としての価値を高めていくことを（　）という。","a":"キャリア開発","e":"教育訓練（企業が施す）とキャリア開発（個人が高める）の組み合わせ。"},{"ty":"recall","q":"日本企業ではキャリアの幅が広い（　）が多く、幅が狭いスペシャリストは少ないと言われる。","a":"ゼネラリスト","e":"幅広い異動でさまざまな仕事を経験させるのが日本型。"},{"ty":"recall","q":"職場で実際の仕事を通じて行う教育訓練を（　）という（On the Job Training）。","a":"OJT","e":"職場内訓練。対はoff-JT（職場外訓練）。"},{"ty":"recall","q":"年齢・職位などの階層ごとに、それぞれの教育ニーズにそって行う教育を（　）別教育という（新入社員研修・管理者研修など）。","a":"階層","e":"off-JTの分類。階層別（タテ）と職能別（ヨコ）。"},{"ty":"recall","q":"各職能に求められる専門的知識や実務的知識の習得を目的として実施される教育を（　）別教育という。","a":"職能","e":"営業研修・技術者研修など。"},{"ty":"recall","q":"社員の自発的な学習を会社としてサポートするもので、基本的には就業時間外に行われるものを（　）という。","a":"自己啓発","e":"OJT・off-JT・自己啓発が能力開発の3本柱。"},{"ty":"recall","q":"組織の境界を越えて展開されるキャリアのあり方を（　）キャリアという。","a":"バウンダーリーレス","e":"企業内特殊技能だけではエンプロイアビリティ（雇用され得る力）が高まらないという問題意識が背景。"},{"ty":"recall","q":"経験豊かな年長者が若手の成長を支援する関係を（　）といい、支援する側をメンターという。","a":"メンタリング","e":"メンター（mentor）＝助言者・支援者。"},{"ty":"recall","q":"実際に発揮された能力を発揮能力、持っているが発揮されていない能力を（　）という。","a":"保有能力","e":"職能資格制度では保有能力も評価対象になるため、賃金が下がりにくいという特徴がある。"},{"ty":"recall","q":"職場を離れて行う集合研修を（　）という（職場外訓練）。","a":"off-JT","e":"OJT（職場内訓練）・off-JT（職場外訓練）・自己啓発が能力開発の3本柱。"},{"ty":"recall","q":"人材育成に関する用語のうち、職務遂行能力を高めることを何というか。","a":"能力開発","e":"教育訓練＝知識や技術を計画的に習得させること、能力開発＝職務遂行能力を高めること。"},{"ty":"recall","q":"教育訓練とキャリア開発を合わせたものを何というか。","a":"人材育成","e":"Human Resource Development（人的資源開発・人材開発）とも呼ばれる。"},{"ty":"recall","q":"資源としての「ヒト」の特性の1つ目、頻繁な取引が難しいのはどこにおいてか。","a":"市場","e":"部品を替えるのと同じ感覚で、簡単に人を雇ったりクビにしたりできない。"},{"ty":"recall","q":"人材育成において、長期的で計画的な人材活動を行うために高めるべき2つは、モラールと何か。","a":"モチベーション","e":"③モチベーションやモラールを高め、長期的で計画的な人材活動を行うこと。"},{"ty":"recall","q":"キャリアの幅が狭い人材を何というか。","a":"スペシャリスト","e":"日本企業はゼネラリストが多いと言われるが、実際には特定の職能分野内でキャリア形成が行われることが多い。"},{"ty":"recall","q":"組織的な顕在能力（発揮能力）を英語で何というか。","a":"core competence","e":"組織的×顕在＝core competence／個人的×顕在＝competency／組織的×潜在＝capability／個人的×潜在＝ability。"},{"ty":"recall","q":"個人的な顕在能力（発揮能力）を英語で何というか。","a":"competency","e":"個人が実際に発揮している能力。コンピテンシー評価につながる概念。"},{"ty":"recall","q":"組織的な潜在能力（保有能力）を英語で何というか。","a":"capability","e":"組織が持っているが、まだ発揮されていない能力。"},{"ty":"recall","q":"個人的な潜在能力（保有能力）を英語で何というか。","a":"ability","e":"個人が持っているが、まだ発揮されていない能力。4象限をセットで覚える。"},{"ty":"recall","q":"労働市場において雇用され得る能力のことを何というか。","a":"エンプロイアビリティ","e":"employability。転職可能性を含む、個人が持つ雇用され続ける力。"},{"ty":"recall","q":"能力開発の手法のうち、対話を通じて本人の自発的な行動を引き出すものを何というか。","a":"コーチング","e":"coaching。メンタリング（mentoring）と対で出題される。"},{"ty":"recall","q":"メンタリングにおいて、指導する立場の人を何というか。","a":"メンター","e":"mentor。指導を受ける側はメンティー（mentee）またはプロテジェ（protege）。"},{"ty":"recall","q":"メンタリングにおいて、指導を受ける立場の人の呼び方として正しいものはどれか。","a":"メンティーまたはプロテジェ","e":"mentee／protege。両方の呼び方があることが問われる。"},{"ty":"recall","q":"能力開発・教育訓練の体系のうち、職場を離れて行う集合研修を何というか。","a":"off-JT（職場外訓練）","e":"On the Job Training＝OJT（職場内訓練）と対になる。"},{"ty":"recall","q":"能力開発・教育訓練の体系のうち、個人が自発的に行うものを何というか。","a":"自己啓発","e":"OJT・off-JT・自己啓発の3本柱。"}]},{"label":"第7回","title":"第7回 働き方の多様化","note":"","items":[{"ty":"recall","q":"「雇用の分野における男女の均等な機会及び待遇の確保等に関する法律」を（　）法という。","a":"男女雇用機会均等","e":"平成29年1月1日改正。1986年4月施行。"},{"ty":"recall","q":"「育児休業、介護休業等育児又は家族介護を行う労働者の福祉に関する法律」を（　）法という。","a":"育児・介護休業","e":"労働者数1,000人超の事業主は育児休業取得状況の公表が義務化。"},{"ty":"recall","q":"情報通信技術を活用し、場所にとらわれずに働く形態の中心となる概念を（　）という。","a":"テレワーク","e":"時間軸の施策（時短・フレックス）に対し、空間軸の施策。"},{"ty":"recall","q":"企業に雇用されず、個人事業主として請け負う形のテレワークを（　）テレワークという（旧SOHO）。","a":"自営型","e":"対は雇用型テレワーク（企業テレワーク）≒在宅勤務。"},{"ty":"recall","q":"労働時間の統計上の減少には、（　）の増大や非正規雇用者の増加というトリックもあるとされる。","a":"サービス残業","e":"2021年には1777時間まで減少したが、統計の見かけ上の要素がある。"},{"ty":"recall","q":"女性の能力発揮や男女格差の解消を目指した積極的差別是正措置を（　）という（和製英語）。","a":"ポジティブ・アクション","e":"アメリカ発のアファーマティブ・アクションに相当する日本での呼称。"},{"ty":"recall","q":"「課長職以上の管理職は男性が占めている」というような、women の昇進を阻む見えない壁を（　）という。","a":"グラス・シーリング","e":"glass ceiling＝ガラスの天井。見えないが確かに存在する昇進の壁。"},{"ty":"recall","q":"「企業の社会的責任」と訳される概念を（　）という（Corporate Social Responsibility）。","a":"CSR","e":"関連語としてコンプライアンス（compliance；法令の遵守）がある。"},{"ty":"recall","q":"仕事と家庭の両立支援に積極的な企業を（　）企業（ファミフレ）という。主な関心は「働く女性への支援」。","a":"ファミリー・フレンドリー","e":"ファミフレ＝働く女性への支援が主眼。多様性全般を扱うダイバーシティ・マネジメントとは関心が異なる。"},{"ty":"recall","q":"性別・民族・宗教などの多様性を活かす経営を（　）という。主な関心・課題は「格差是正」。","a":"ダイバーシティ・マネジメント","e":"マイノリティの処遇に関するアメリカ発の概念で、性差だけを想定しているわけではない。最近は「ダイバーシティ＆インクルージョン（D＆I）」とも呼ばれる。"},{"ty":"recall","q":"法令の遵守を意味する語を（　）という（compliance）。","a":"コンプライアンス","e":"CSR（企業の社会的責任）に関連する概念。"},{"ty":"recall","q":"育児・介護休業法の改正で、男性の育児休業取得促進とともに防止が図られたハラスメントは何か。","a":"マタニティ・ハラスメント","e":"妊娠・出産・育児休業などを理由とする不利益取扱いや嫌がらせ。"},{"ty":"recall","q":"101人以上を雇用する事業主に、子育て支援に関する「行動計画」の届け出を義務づけた法律は何か。","a":"次世代育成支援対策推進法","e":"子育て支援の行動計画の策定・届出を義務づけている。"},{"ty":"recall","q":"以前SOHOと呼ばれていた形態に対し、企業に雇用されて行うテレワークを何というか。","a":"雇用型テレワーク","e":"自営型（SOHO＝Small Office Home Office）と雇用型（企業テレワーク）の区別。"},{"ty":"recall","q":"1992年の「労働時間の短縮の促進に関する臨時措置法」を略して何というか。","a":"時短促進法","e":"（1）労働時間短縮（時短）に関する法律。"},{"ty":"recall","q":"ポジティブ・アクションは和製英語だが、英語では何というか。","a":"アファーマティブ・アクション","e":"affirmative action。主な関心・課題は「女性の能力発揮」や「男女格差の解消」。"},{"ty":"recall","q":"ポジティブ・アクションの主な関心・課題として正しいものはどれか。","a":"女性の能力発揮と男女格差の解消","e":"ファミリー・フレンドリー企業（働く女性への支援）、ダイバーシティ（格差是正）と区別する。"},{"ty":"recall","q":"ファミリー・フレンドリー企業の略称と、その主な関心・課題の組み合わせとして正しいものはどれか。","a":"ファミフレ／働く女性への支援","e":"（4）にあたる。仕事と家庭の両立支援が中心。"},{"ty":"recall","q":"ダイバーシティ・マネジメントの主な関心・課題はどれか。","a":"格差是正","e":"マイノリティの処遇に関するアメリカ発の概念。近年はDE&I（多様性・公平性・包摂性）と呼ばれる。"},{"ty":"recall","q":"近年、ダイバーシティに公平性と包摂性を加えた概念を何と略すか。","a":"DE&I","e":"Diversity, Equity & Inclusion。"},{"ty":"recall","q":"Corporate Social Responsibility の日本語訳はどれか。","a":"企業の社会的責任","e":"CSR。その一環としてコンプライアンス（法令の遵守）がある。"},{"ty":"recall","q":"世界経済フォーラム（WEF）が毎年発表する、世界各国の男女平等の度合いを示す指数を何というか。","a":"ジェンダーギャップ指数","e":"日本は先進国の中で低位にあることが問題とされる。"},{"ty":"recall","q":"仕事と生活の調和を意味する概念を何というか。","a":"ワーク・ライフ・バランス","e":"Work-life balance。仕事と生活の相反関係を前提とした語である点に注意。"},{"ty":"recall","q":"一方の状況が他方にも影響すると考えるモデルを何というか。","a":"スピルオーバー（流出）モデル","e":"spillover。一方の不満足を他方の満足で補うのが補償モデル（「釣りバカ日誌」）。"},{"ty":"recall","q":"仕事と生活が互いに衝突している状態を何というか。","a":"ワーク・ライフ・コンフリクト","e":"バランスが取れていない状態。"},{"ty":"recall","q":"仕事と生活を対立させず統合して捉えようとする考え方を何というか。","a":"ワーク・ライフ・インテグレーション","e":"「バランス」という語が仕事と生活の相反関係を前提としているため提唱された概念。"},{"ty":"recall","q":"ワーク・ライフ・バランスについて、企業側の関心はどこにあるか。","a":"生産性向上、モチベーション・職務満足の向上、人材の確保・定着","e":"行政（厚生労働省）は少子高齢化対策、労働者は豊かな働き方、と立場によって関心が異なる（「同床異夢」）。"},{"ty":"recall","q":"労働者がワーク・ライフ・バランスに求めるものとして挙げられているものはどれか。","a":"豊かな働き方の希求（ブラック企業で働くのはイヤだ）","e":"企業・行政・労働者で目的が異なる点が「同床異夢」と表現されている。"},{"ty":"recall","q":"ワーク・ライフ・バランスについて、企業や労働者にとって重要なのは何か。","a":"男性社員や正規雇用者を含めた仕事と働き方の見直し","e":"女性ないし母親だけの問題ではない、という点が結論。"},{"ty":"recall","q":"時期によって業務の繁閑差が大きい場合に、一定期間を平均して法定労働時間内に収める制度を何というか。","a":"変形労働時間制","e":"（1）労働時間の柔軟化①にあたる。"},{"ty":"recall","q":"一日の始業時刻と終業時刻を労働者が自由に選択できる制度を何というか。","a":"フレックスタイム制","e":"②にあたる。ただし「コアタイム」が存在する場合が多い。"},{"ty":"recall","q":"フレックスタイム制において、必ず勤務していなければならない時間帯を何というか。","a":"コアタイム","e":"この時間帯以外は出退勤が自由になる。"},{"ty":"recall","q":"職務遂行方法や労働時間配分を、従業員の裁量に委ねる制度を何というか。","a":"裁量労働制","e":"③にあたる。実際の労働時間ではなく、みなし労働時間で計算する。"},{"ty":"recall","q":"終業時刻と次の始業時刻との間に、一定の休息時間を空けなければならない制度を何というか。","a":"勤務時間インターバル制度","e":"④にあたる。長時間労働による健康被害を防ぐ仕組み。"},{"ty":"recall","q":"ICTを活用し、時間や場所にとらわれない働き方を何というか。","a":"テレワーク","e":"tele（離れた場所で）＋work（働く）。リモートワークと呼ばれる場合もある。"},{"ty":"recall","q":"育児休業の一定期間を父親に割り当てる制度を何というか。","a":"パパ・クウォータ制度","e":"quota＝「割り当て」。1993年にノルウェーが導入した。"},{"ty":"recall","q":"パパ・クウォータ制度を最初に導入した国はどこか。","a":"ノルウェー","e":"1993年。その後スウェーデン、デンマークなどの北欧諸国を中心に、ドイツなどにも広がった。"},{"ty":"recall","q":"パパ・クウォータ制度の最大の特徴はどれか。","a":"父親が取得しなければ、権利が消滅してしまう点","e":"「使わなければ消える」ことで、父親の取得を強く促す仕組み。"},{"ty":"recall","q":"2005年にスウェーデンで導入された、勤続6年以上の労働者が賃金の85%程度の手当を受けながら最長1年間取得できる長期休暇を何というか。","a":"サバティカル休暇","e":"休暇中、企業は代替要員として失業者を雇用することが求められる点も特徴。"},{"ty":"recall","q":"1996年に労働法を改正し、フルタイム労働者とパートタイム労働者の労働条件の差別を禁じた国はどこか。","a":"オランダ","e":"時給、社会保険制度加入、雇用期間、昇進などの労働条件について差別を禁止した。"},{"ty":"recall","q":"オランダで進められた、労働時間を短縮して雇用を分かち合う仕組みを何というか。","a":"ワークシェアリング","e":"これらを総称して『オランダ・モデル』と呼ばれる。"},{"ty":"recall","q":"フルタイムとパートタイムの均等待遇を軸としたオランダの一連の政策を総称して何と呼ぶか。","a":"オランダ・モデル","e":"同名の書籍もある。"},{"ty":"recall","q":"国家や行政の介入がほとんどなく、企業の生産性向上や業績の観点からワーク・ライフ・バランスが進められている国はどこか。","a":"アメリカ","e":"他のヨーロッパ諸国とは対照的な特徴。"},{"ty":"recall","q":"ワーク・ライフ・バランスの推進において、②として挙げられている見直しの対象は誰か。","a":"男性正社員","e":"女性の働き方に関する課題への対応だけでは不十分、という指摘。"},{"ty":"recall","q":"女性の昇進を阻む見えない天井を何というか。","a":"グラス・シーリング","e":"ポジティブ・アクションが取り組む課題のひとつ。"},{"ty":"recall","q":"自営型テレワークの旧称として用いられていた語はどれか。","a":"SOHO","e":"Small Office Home Office。雇用型テレワーク（企業テレワーク）と対比される。"},{"ty":"recall","q":"労働時間の柔軟化に対し、テレワークは何の柔軟化にあたるか。","a":"労働場所の柔軟化","e":"（1）労働時間の柔軟化／（2）労働場所の柔軟化、という構成。"},{"ty":"recall","q":"残業代が支払われない時間外労働を何というか。","a":"サービス残業","e":"労働時間短縮（時短）の文脈で問題とされる。"},{"ty":"recall","q":"次世代育成支援対策推進法により、育児休業取得状況の公表が義務化された事業主の規模はどれか。","a":"労働者数1,000人超","e":"行動計画の届け出義務は101人以上、取得状況の公表義務は1,000人超。数字を区別する。"},{"ty":"recall","q":"サバティカル休暇が2005年に導入された国はどこか。","a":"スウェーデン","e":"勤続6年以上で賃金の85%程度の手当を受けながら最長1年間取得できる。パパ・クウォータのノルウェー、ワークシェアリングのオランダと区別する。"},{"ty":"recall","q":"テレワークの別名として用いられる語はどれか。","a":"リモートワーク","e":"tele（離れた場所で）＋work（働く）。ICTを活用し時間や場所にとらわれない働き方。"}]},{"label":"第8回","title":"第8回 その他の人的資源管理諸制度","note":"","items":[{"ty":"recall","q":"社会保険料の負担など、法律で義務づけられた福利厚生を（　）福利厚生という。","a":"法定","e":"対は法定外福利厚生（企業が任意に行うもの）。"},{"ty":"recall","q":"ストレスの原因となる刺激を（　）という。","a":"ストレッサ","e":"原因＝ストレッサ／結果＝ストレス反応。名称を逆にしない。"},{"ty":"recall","q":"長期の慢性的ストレスにより意欲を失う状態を（　）という（燃え尽き症候群）。","a":"バーンアウト","e":"心身症・うつ病・欠勤などと並ぶストレス反応の一つ。"},{"ty":"recall","q":"ストレスの緩衝要因（buffer）を（　）という。","a":"モデレータ","e":"ストレッサ→（モデレータが緩衝）→ストレス反応、という構造。"},{"ty":"recall","q":"極端な競争心、高い攻撃性、過度に几帳面・神経質、早口などの行動特性を（　）という。","a":"タイプA","e":"ストレス反応が出やすいとされる性格特性。"},{"ty":"recall","q":"出来事を自分の力で左右できると考えるか、外部の力によると考えるかの概念を（　）という（制御の所在）。","a":"Locus of Control","e":"内的統制と外的統制。"},{"ty":"recall","q":"ストレスへの対処のことを（　）という。","a":"コーピング","e":"問題焦点型と情動焦点型の2類型がある。"},{"ty":"recall","q":"ストレッサそのものを除去したり軽減したりする努力を（　）型コーピングという。","a":"問題焦点","e":"原因に対処する。対は情動焦点型（自分の気持ちを変化させる）。"},{"ty":"recall","q":"問題そのものの処理ではなく、自分の気持ちを変化させる努力を（　）型コーピングという。","a":"情動焦点","e":"問題焦点↔情動焦点。どちらに働きかけるかの違い。"},{"ty":"recall","q":"上司や同僚からの支援、家族の支援などを（　）という。","a":"ソーシャル・サポート","e":"コーピングを支える社会的な支援。"},{"ty":"recall","q":"職権などのパワーを背景に、業務の範疇を超えて継続的に人格と尊厳を侵害する言動を（　）・ハラスメントという。","a":"パワー","e":"大学の「教員-学生」関係の場合はアカデミック・ハラスメントと呼ぶ。"},{"ty":"recall","q":"妊娠・出産を理由とする不利益取扱いを（　）・ハラスメントという（男性に対してはパタニティ・ハラスメント）。","a":"マタニティ","e":"パタニティ・ハラスメントは和製英語。"},{"ty":"recall","q":"退職金も受け取れない、最も重い懲戒処分としての解雇を（　）解雇という。","a":"懲戒","e":"諭旨解雇は懲戒解雇を温情的に運用したもので、法令で定められた解雇方法ではない。"},{"ty":"recall","q":"賃金以外に企業が給付する福利厚生を（　）という（付加給付）。","a":"フリンジ・ベネフィット","e":"法定福利厚生（社会保険料負担など）と法定外福利厚生に分かれる。"},{"ty":"recall","q":"懲戒解雇レベルの行為に対し、情状酌量的に取り扱う解雇を（　）解雇という。退職金の一部または全部を受け取れる。","a":"諭旨","e":"法令で定められた解雇方法ではなく、懲戒解雇を雇用主が温情的に運用しているもの。"},{"ty":"recall","q":"経営上の理由による人員整理を（　）解雇といい、解雇権濫用法理の4要件を満たす必要がある。","a":"整理","e":"4要件＝①人員整理の必要性 ②解雇回避の努力義務 ③被解雇者の選定基準の妥当性 ④手続きの妥当性。"},{"ty":"recall","q":"ストレスチェック制度は、労働安全衛生法により一定規模の事業所に（　）されている。","a":"義務化","e":"メンタルヘルス対策の一環として実施が義務づけられている。"},{"ty":"recall","q":"2015年から事業者に義務化された、労働者の心理的な負担の程度を把握する検査を何というか。","a":"ストレスチェック","e":"（5）ストレスチェックの義務化。メンタルヘルス対策の一環。"},{"ty":"recall","q":"職場において、労働者の意に反する性的な言動が行われるハラスメントを何というか。","a":"セクシャル・ハラスメント","e":"それを拒否するなどの対応により不利益を受けることを含む。パワハラ・マタハラと並べて押さえる。"},{"ty":"recall","q":"「リストラ」のもとの言葉は何か。","a":"リストラクチャリング","e":"restructuring。もとは「事業の再構築」を意味する言葉で、人員削減だけを指す言葉ではない。"},{"ty":"recall","q":"リストラクチャリングの本来の意味として正しいものはどれか。","a":"事業の再構築","e":"不採算部門からの撤退、M&A、事業所の統廃合、分社化などを含む。日本では人員削減の意味で使われることが多い。"},{"ty":"recall","q":"もとは再雇用を条件とした一時解雇のことを指した言葉は何か。","a":"レイオフ","e":"layoff（一時解雇または一時帰休）。現在では単なる大規模な解雇を指すこともある。"}]}]}]};</script>
<script>
/* 試験対策クイズ集 共通エンジン ------------------------------------------
   QUIZ(deck) で起動する。外部依存なし。
   1科目1ページの版でも、全科目を1ファイルにまとめた版でも同じものを使う。 */
var QUIZ = (function () {
  'use strict';

  var active = null;
  document.addEventListener('keydown', function (e) {
    if (active && active.onKey) active.onKey(e);
  });

  return function mount(DECK) {

  var $ = function (id) { return document.getElementById(id); };
  function E(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------------- 状態 ---------------- */
  var KEY = 'kq-' + DECK.slug;
  var S = {};          // 解答記録  "mode|sec|q" -> 1(正解) / 0(不正解)
  var mi = 0;          // 選択中のモード
  var sec = -1;        // 選択中の範囲（-1 = ぜんぶ）
  var view = DECK.defaultView || 'quiz';
  var only = false;    // ✕だけ
  var ix = 0;          // 出題リスト内の位置
  var list = [];       // [[secIndex, qIndex], ...]
  var st = null;       // 解答中の一時状態

  function mode() { return DECK.modes[mi]; }
  function sections() { return mode().sections; }
  function qkey(si, qi) { return mode().id + '|' + si + '|' + qi; }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ S: S, m: mi, v: view }));
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o.S) S = o.S;
      if (typeof o.m === 'number' && DECK.modes[o.m]) mi = o.m;
      if (o.v === 'quiz' || o.v === 'list') view = o.v;
    } catch (e) {}
  }

  /* ---------------- 出題リスト ---------------- */
  function build() {
    var out = [];
    sections().forEach(function (sc, si) {
      if (sec >= 0 && si !== sec) return;
      sc.items.forEach(function (it, qi) {
        if (only && S[qkey(si, qi)] !== 0) return;
        out.push([si, qi]);
      });
    });
    return out;
  }
  function wrongCount() {
    var n = 0;
    sections().forEach(function (sc, si) {
      sc.items.forEach(function (it, qi) { if (S[qkey(si, qi)] === 0) n++; });
    });
    return n;
  }
  function tally() {
    var done = 0, ok = 0;
    list.forEach(function (p) {
      var v = S[qkey(p[0], p[1])];
      if (v === 0 || v === 1) { done++; if (v === 1) ok++; }
    });
    return { done: done, ok: ok, total: list.length };
  }

  /* ---------------- 描画：ヘッダ周り ---------------- */
  function drawModes() {
    var el = $('modes'), hint = $('modehint');
    if (DECK.modes.length < 2) { el.style.display = 'none'; hint.style.display = 'none'; return; }
    el.innerHTML = DECK.modes.map(function (m, i) {
      return '<button data-m="' + i + '"' + (i === mi ? ' class="on"' : '') + '>' + E(m.label) + '</button>';
    }).join('');
    el.querySelectorAll('[data-m]').forEach(function (b) {
      b.onclick = function () { mi = +b.dataset.m; sec = -1; only = false; ix = 0; st = null; save(); draw(); window.scrollTo(0, 0); };
    });
    hint.textContent = mode().hint || '';
    hint.style.display = mode().hint ? '' : 'none';
  }

  function drawChips() {
    var el = $('chips');
    var scs = sections();
    if (scs.length < 2) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    var h = '<button class="chip' + (sec < 0 ? ' on' : '') + '" data-s="-1">ぜんぶ</button>';
    scs.forEach(function (sc, si) {
      h += '<button class="chip' + (si === sec ? ' on' : '') + '" data-s="' + si + '">' +
        E(sc.label || sc.title) + '<small>' + sc.items.length + '</small></button>';
    });
    el.innerHTML = h;
    el.querySelectorAll('[data-s]').forEach(function (b) {
      b.onclick = function () { sec = +b.dataset.s; ix = 0; st = null; draw(); window.scrollTo(0, 0); };
    });
  }

  function drawHud() {
    var t = tally();
    var hud = $('hud'), track = $('track');
    if (view === 'list' || mode().kind === 'read') { hud.style.display = 'none'; track.style.display = 'none'; return; }
    hud.style.display = ''; track.style.display = '';
    var pos = Math.min(ix + 1, t.total);
    hud.innerHTML = t.total
      ? '<span class="n">' + pos + ' / ' + t.total + ' 問</span><span class="sp"></span>' +
        '<span class="ok">○ ' + t.ok + '</span><span class="ng">✕ ' + (t.done - t.ok) + '</span>'
      : '';
    track.querySelector('i').style.width = (t.total ? Math.round(t.done / t.total * 100) : 0) + '%';
  }

  // 出題ビューでは「いま解いている範囲」のノートを出す（「ぜんぶ」でも問題に合わせて切り替わる）
  var noteAt = -1;
  function drawNote(si) {
    var el = $('note');
    var scs = sections();
    var at = (si === undefined || si < 0) ? sec : si;
    var note = (at >= 0 && scs[at] && scs[at].note) ? scs[at].note : '';
    if (!note || view === 'list') { el.innerHTML = ''; noteAt = -1; return; }
    if (noteAt === at) return; // 同じ範囲を解いている間は開閉状態を保つ
    noteAt = at;
    el.innerHTML = '<details class="note"><summary>要点ノート（' +
      E(scs[at].label || '') + '）</summary><div class="body">' + note + '</div></details>';
  }

  /* ---------------- 描画：本文 ---------------- */
  function draw() {
    if (sec >= sections().length) sec = -1;
    noteAt = -1;
    drawModes(); drawChips(); drawNote();
    list = build();
    if (ix >= list.length) ix = Math.max(list.length - 1, 0);
    document.body.classList.toggle('hide', false);
    if (view === 'list' || mode().kind === 'read') drawList(); else drawQuiz();
    drawHud(); drawFoot();
  }

  /* --- 出題ビュー --- */
  function drawQuiz() {
    var stage = $('stage'), nav = $('nav');
    if (!list.length) {
      stage.innerHTML = '<div class="empty">' +
        (only ? '間違えた問題はありません。' : 'この範囲に問題がありません。') + '</div>';
      nav.innerHTML = '';
      return;
    }
    if (ix >= list.length) return drawDone();

    var si = list[ix][0], qi = list[ix][1];
    var sc = sections()[si], it = sc.items[qi];
    drawNote(si);
    var rec = S[qkey(si, qi)];
    var mine = st && st.si === si && st.qi === qi ? st : null;
    var answered = (mine && mine.done) ? mine
      : (rec === 0 || rec === 1 ? { si: si, qi: qi, ok: rec === 1, pick: null, done: true } : null);
    var pending = (mine && !mine.done && mine.picks) ? mine.picks : [];
    var revealed = !!(mine && mine.reveal);

    var h = '<div class="card"><p class="src">' + E(sc.title) + '</p>';

    if (it.ty === 'wrong') {
      h += '<p class="qtext">' + sentence(it, !!answered) + '</p>';
      h += '<p class="ask">誤っているのはどれ？</p>' + choices(it, answered, pending);
    } else if (it.ty === 'mc') {
      h += '<p class="qtext">' + blanked(it.q, answered ? it.ch[it.ans].t : null) + '</p>' + choices(it, answered, pending);
    } else if (it.ty === 'ms') {
      h += '<p class="qtext">' + E(it.q) + '</p>';
      h += '<p class="ask">正しいものを2つ選んでください</p>' + choices(it, answered, pending);
    } else if (it.ty === 'recall') {
      h += '<p class="qtext">' + blanked(it.q, (answered || revealed) ? it.a : null) + '</p>';
      if (!answered && !revealed) {
        h += '<div class="btns"><button class="btn pri" data-act="reveal">答えを見る</button></div>' +
          '<p class="ask" style="margin:10px 0 0">まず頭のなかで答えてから押してください。</p>';
      } else {
        h += '<div class="fix' + (it.a.length > 40 ? ' long' : '') + '"><span class="lbl">答え</span><b>' + E(it.a) + '</b></div>';
        if (!answered) {
          h += '<div class="btns"><button class="btn y" data-mark="1">○ 言えた</button>' +
            '<button class="btn n" data-mark="0">✕ 言えなかった</button></div>';
        }
      }
    }

    if (answered) h += result(it, answered);
    h += '</div>';
    stage.innerHTML = h;

    nav.innerHTML = '<button data-go="-1"' + (ix === 0 ? ' disabled' : '') + '>← もどる</button>' +
      '<span class="sp"></span>' +
      '<button data-go="1" class="' + (answered ? 'pri' : '') + '">' +
      (ix === list.length - 1 ? '結果を見る' : 'つぎへ →') + '</button>';

    bindQuiz(it, si, qi, !!answered);
  }

  function sentence(it, reveal) {
    if (!reveal || it.badFrom < 0) return E(it.segs.join(''));
    // 誤り箇所は連続しているので、まとめて1つの <u> で囲む
    return E(it.segs.slice(0, it.badFrom).join('')) +
      '<u class="bad">' + E(it.segs.slice(it.badFrom, it.badTo + 1).join('')) + '</u>' +
      E(it.segs.slice(it.badTo + 1).join(''));
  }
  function blanked(q, fill) {
    var parts = String(q).split('（　）');
    if (parts.length < 2) return E(q);
    var b = fill === null || fill === undefined
      ? '<span class="blank">　　</span>'
      : '<span class="blank on">' + E(fill) + '</span>';
    return E(parts[0]) + b + E(parts.slice(1).join('（　）'));
  }

  function choices(it, answered, pending) {
    var multi = it.ty === 'ms';
    var picks = pending || [];
    var h = '<div class="choices">';
    it.ch.forEach(function (c, i) {
      var cls = 'ch' + (c.none ? ' none' : '');
      var mark = i + 1;
      if (answered) {
        var isAns = multi ? it.ans.indexOf(i) >= 0 : i === it.ans;
        var wasPicked = answered.picks ? answered.picks.indexOf(i) >= 0 : answered.pick === i;
        if (isAns) { cls += ' correct'; mark = '✓'; }
        else if (wasPicked) { cls += ' miss'; mark = '✕'; }
      } else if (picks.indexOf(i) >= 0) {
        cls += ' pick';
      }
      h += '<button class="' + cls + '" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' +
        '<i>' + mark + '</i><span>' + E(c.t) + '</span></button>';
    });
    h += '</div>';
    if (multi && !answered) {
      h += '<div class="btns"><button class="btn pri" data-act="grade"' +
        (picks.length === 2 ? '' : ' disabled') + '>答え合わせ</button></div>';
    }
    return h;
  }

  function result(it, a) {
    var h = '<div class="verdict ' + (a.ok ? 'y' : 'n') + '">' + (a.ok ? '正解' : '不正解') + '</div>';
    if (it.ty === 'wrong') {
      h += it.fix
        ? '<div class="fix"><span class="lbl">正しくは</span><b>' + E(it.fix) + '</b></div>'
        : '<div class="fix"><b>この文に誤りはありません。</b></div>';
    }
    if (it.e) h += '<div class="exp">' + E(it.e) + '</div>';
    return h;
  }

  function bindQuiz(it, si, qi, answered) {
    var stage = $('stage');
    stage.querySelectorAll('.ch').forEach(function (b) {
      if (answered) return;
      b.onclick = function () {
        var i = +b.dataset.i;
        if (it.ty === 'ms') {
          var picks = (st && st.si === si && st.qi === qi && !st.done && st.picks) ? st.picks.slice() : [];
          var at = picks.indexOf(i);
          if (at >= 0) picks.splice(at, 1);
          else if (picks.length < 2) picks.push(i);
          st = { si: si, qi: qi, picks: picks };
          drawQuiz();
        } else {
          grade(it, si, qi, [i]);
        }
      };
    });
    var act = stage.querySelector('[data-act="grade"]');
    if (act) act.onclick = function () { grade(it, si, qi, st.picks); };
    var rev = stage.querySelector('[data-act="reveal"]');
    if (rev) rev.onclick = function () { st = { si: si, qi: qi, reveal: true }; drawQuiz(); };
    stage.querySelectorAll('[data-mark]').forEach(function (b) {
      b.onclick = function () { grade(it, si, qi, null, +b.dataset.mark === 1); };
    });
    $('nav').querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () { step(+b.dataset.go); };
    });
  }

  function grade(it, si, qi, picks, selfOk) {
    var ok;
    if (it.ty === 'ms') {
      ok = picks.length === 2 && picks.every(function (p) { return it.ans.indexOf(p) >= 0; });
    } else if (it.ty === 'recall') {
      ok = !!selfOk;
    } else {
      ok = picks[0] === it.ans;
    }
    S[qkey(si, qi)] = ok ? 1 : 0;
    st = { si: si, qi: qi, ok: ok, pick: picks ? picks[0] : null, picks: picks || [], done: true };
    save();
    drawQuiz(); drawHud(); drawFoot();
  }

  function step(d) {
    var n = ix + d;
    if (n < 0) return;
    ix = n; st = null;
    if (ix >= list.length) { drawDone(); drawHud(); }
    else drawQuiz();
    drawHud();
    window.scrollTo(0, 0);
  }

  function drawDone() {
    $('note').innerHTML = ''; noteAt = -1;
    var t = tally();
    var rate = t.done ? Math.round(t.ok / t.done * 100) : 0;
    var wrong = wrongCount();
    var h = '<div class="done"><p class="big">' + t.ok + ' / ' + t.done + '</p>' +
      '<p class="rate">正答率 ' + rate + '％</p><div class="btns">';
    if (wrong) h += '<button class="btn pri" data-act="review">✕だった' + wrong + '問を復習</button>';
    h += '<button class="btn" data-act="restart">はじめから</button></div></div>';
    $('stage').innerHTML = h;
    $('nav').innerHTML = '<button data-go="-1">← もどる</button>';
    $('stage').querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.act === 'review') { only = true; sec = -1; }
        ix = 0; st = null; draw(); window.scrollTo(0, 0);
      };
    });
    $('nav').querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () { step(-1); };
    });
  }

  /* --- 一覧ビュー --- */
  function drawList() {
    var h = '';
    sections().forEach(function (sc, si) {
      if (sec >= 0 && si !== sec) return;
      h += '<div class="lsec"><h2>' + E(sc.title) + '</h2>';
      if (sc.note) h += '<details class="note" open><summary>要点ノート</summary><div class="body">' + sc.note + '</div></details>';
      sc.items.forEach(function (it) {
        if (it.ty === 'read') {
          h += '<div class="doc"><h3>' + E(it.h) + '</h3>' +
            (it.sub ? '<p class="why">' + E(it.sub) + '</p>' : '') +
            '<pre>' + E(it.body) + '</pre>' +
            (it.kw && it.kw.length ? '<div class="kw">' + it.kw.map(function (k) { return '<span>' + E(k) + '</span>'; }).join('') + '</div>' : '') +
            '</div>';
          return;
        }
        if (it.ty === 'wrong') {
          h += '<div class="item ' + (it.fix ? 'err' : 'clean') + '"><p class="s">' + sentence(it, true) + '</p>' +
            (it.fix
              ? '<p class="a"><span class="lbl">正しくは</span><b>' + E(it.fix) + '</b></p>'
              : '<p class="note-ok">✓ この文に誤りはありません</p>') +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        } else if (it.ty === 'recall') {
          h += '<div class="item"><p class="s">' + blanked(it.q, it.a) + '</p>' +
            (it.q.indexOf('（　）') < 0 ? '<p class="a' + (it.a.length > 40 ? ' long' : '') + '"><span class="lbl">答え</span><b>' + E(it.a) + '</b></p>' : '') +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        } else if (it.ty === 'ms') {
          h += '<div class="item"><p class="s">' + E(it.q) + '</p><p class="a"><span class="lbl">正しいもの</span><b>' +
            it.ans.map(function (i) { return E(it.ch[i].t); }).join('</b>／<b>') + '</b></p>' +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        } else {
          h += '<div class="item"><p class="s">' + blanked(it.q, it.ch[it.ans].t) + '</p>' +
            (it.q.indexOf('（　）') < 0 ? '<p class="a"><span class="lbl">答え</span><b>' + E(it.ch[it.ans].t) + '</b></p>' : '') +
            (it.e ? '<p class="ex">' + E(it.e) + '</p>' : '') + '</div>';
        }
      });
      h += '</div>';
    });
    $('stage').innerHTML = h || '<div class="empty">表示できる項目がありません。</div>';
    $('nav').innerHTML = '';
  }

  /* ---------------- フッタの操作 ---------------- */
  function drawFoot() {
    var el = $('tools');
    var readOnly = mode().kind === 'read';
    var h = '';
    if (!readOnly) {
      h += '<button data-v="quiz" class="' + (view === 'quiz' ? 'on' : '') + '">1問ずつ解く</button>';
      h += '<button data-v="list" class="' + (view === 'list' ? 'on' : '') + '">一覧で読む</button>';
    }
    if (!readOnly && view === 'list') h += '<button data-act="hide">答えを隠す</button>';
    if (!readOnly && view === 'quiz') {
      var w = wrongCount();
      h += '<button data-act="only" class="' + (only ? 'on' : '') + '"' + (w || only ? '' : ' disabled') +
        '>✕だけ復習' + (w ? '（' + w + '）' : '') + '</button>';
      h += '<button data-act="reset">記録を消す</button>';
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () { view = b.dataset.v; only = false; ix = 0; st = null; save(); draw(); window.scrollTo(0, 0); };
    });
    el.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === 'only') { only = !only; if (only) sec = -1; ix = 0; st = null; draw(); window.scrollTo(0, 0); }
        else if (a === 'hide') {
          var on = document.body.classList.toggle('hide');
          b.textContent = on ? '答えを表示' : '答えを隠す';
          b.classList.toggle('on', on);
        } else if (a === 'reset') {
          if (!confirm('この' + mode().label + 'の解答記録を消します。よろしいですか？')) return;
          Object.keys(S).forEach(function (k) { if (k.indexOf(mode().id + '|') === 0) delete S[k]; });
          only = false; ix = 0; st = null; save(); draw();
        }
      };
    });
    $('keys').style.display = (view === 'quiz' && !readOnly) ? '' : 'none';
  }

  /* ---------------- キーボード ---------------- */
  function onKey(e) {
    if (view !== 'quiz' || mode().kind === 'read') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'Enter') { e.preventDefault(); step(1); return; }
    if (k === 'ArrowLeft') { e.preventDefault(); step(-1); return; }
    if (/^[1-9]$/.test(k)) {
      var btns = $('stage').querySelectorAll('.ch:not([disabled])');
      var i = +k - 1;
      if (btns[i]) { e.preventDefault(); btns[i].click(); }
      return;
    }
    if (k === ' ') {
      var b = $('stage').querySelector('[data-act="reveal"],[data-act="grade"]');
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  }

  /* ---------------- 起動 ---------------- */
  load();
  draw();
  active = { onKey: onKey };
  return active;

  };
})();

QUIZ(DECK);
</script>

<script id="dads-a11y">
(function(){
  'use strict';
  function all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
  function setButtonTypes(root){all('button',root).forEach(function(b){if(!b.hasAttribute('type'))b.type='button';});}
  function enhance(){
    var main=document.querySelector('.wrap')||document.body;
    if(!main.id)main.id='main-content';
    main.setAttribute('role','main');
    if(!document.querySelector('.dads-skip')){
      var skip=document.createElement('a');skip.className='dads-skip';skip.href='#'+main.id;skip.textContent='本文へ移動';
      document.body.insertBefore(skip,document.body.firstChild);
    }
    var h1=document.querySelector('h1');
    if(h1){if(!h1.id)h1.id='page-title';main.setAttribute('aria-labelledby',h1.id);}

    var modes=document.getElementById('modes');
    if(modes){
      modes.setAttribute('role','tablist');modes.setAttribute('aria-label','学習モード');
      all('button',modes).forEach(function(b,i){
        b.setAttribute('role','tab');b.setAttribute('aria-controls','stage');
        var on=b.classList.contains('on');b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;
      });
    }
    var chips=document.getElementById('chips');
    if(chips){chips.setAttribute('role','group');chips.setAttribute('aria-label','出題範囲');
      all('button',chips).forEach(function(b){b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false');});}
    var tools=document.getElementById('tools');
    if(tools){tools.setAttribute('role','group');tools.setAttribute('aria-label','表示と復習の設定');
      all('button.on',tools).forEach(function(b){b.setAttribute('aria-pressed','true');});}
    var hud=document.getElementById('hud');if(hud){hud.setAttribute('role','status');hud.setAttribute('aria-live','polite');}
    var stage=document.getElementById('stage');if(stage){stage.setAttribute('role','region');stage.setAttribute('aria-label','問題と解答');}
    var nav=document.getElementById('nav');if(nav){nav.setAttribute('aria-label','問題の移動');}
    var track=document.getElementById('track');
    if(track){
      var bar=track.querySelector('i'),pct=bar?parseFloat(bar.style.width)||0:0;
      track.setAttribute('role','progressbar');track.setAttribute('aria-label','学習の進捗');
      track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.setAttribute('aria-valuenow',String(Math.round(pct)));
    }
    all('.choices').forEach(function(c){c.setAttribute('role','group');c.setAttribute('aria-label','解答の選択肢');});
    all('.ch').forEach(function(b){
      b.setAttribute('aria-pressed',b.classList.contains('pick')?'true':'false');
      if(b.classList.contains('correct'))b.setAttribute('aria-label','正解: '+b.textContent.trim());
      if(b.classList.contains('miss'))b.setAttribute('aria-label','選択した不正解: '+b.textContent.trim());
    });
    all('details.note').forEach(function(d){var s=d.querySelector('summary');if(s)s.setAttribute('aria-label',(s.textContent||'要点ノート')+'を開閉');});
    setButtonTypes(document);
  }
  var queued=false;
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;enhance();});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){enhance();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','open']});});
  else{enhance();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','open']});}
})();
</script>
<!-- DADS-A11Y:END -->
