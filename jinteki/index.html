<style>

.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}

.mode button.on{background:var(--accent);color:#fff}
.modehint{font-size:12px;color:var(--sub);margin:0 0 16px;line-height:1.6}

.msg{background:var(--accentbg);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7}

</style></head><body><div class="wrap">
<h1>人的マネジメント 穴埋めチェック</h1>
<p class="lead">全8回・100問。試験は穴埋め形式なので、慣れてきたら「穴埋めモード」で自分の言葉で思い出す練習をしてください。解答は自動保存されます。</p>
<div class="bar"><i id="pbar"></i></div>
<div class="barlab"><span id="plab">全体の進捗 0 / 100 問</span><span id="prate"></span></div>
<div class="mode">
<button id="m1" class="on">選択モード</button>
<button id="m2">穴埋めモード</button>
</div>

<div class="stats">
<div class="stat"><b id="s1">0</b><span>この回の解答数</span></div>
<div class="stat"><b id="s2" style="color:var(--ok)">0</b><span>正解</span></div>
<div class="stat"><b id="s3" style="color:var(--ng)">0</b><span>不正解</span></div>
<div class="stat"><b id="s4">—</b><span>正答率</span></div>
</div>
<div id="main"></div>
<div class="foot">
<button id="bw">間違えた問題だけ</button>

<button id="brall">全部リセット</button>
</div>
<p class="credit">出題は講義レジュメの穴埋め箇所にもとづいています。全100問について、答えがレジュメ本文に存在することを機械的に照合済みです。<br>誤りを見つけたら教えてください。</p>

{k:"1",title:"第1回 経営学説史の復習",qs:[

{q:"メイヨーやレスリスバーガーが参加した、シカゴ郊外の工場での一連の実験を（　）実験という。",a:"ホーソン",d:["継電器組立","ハーバード","モラール"],e:"継電器組立実験室(1927〜1932)などの調査。人間関係論の出発点。"},

{k:"2",title:"第2回 日本企業の採用",qs:[

{q:"従業員の家族や親戚など、何らかのかかわりがある人物を採用することを（　）採用という（俗に言うコネ入社）。",a:"縁故",d:["リファラル","アルムナイ","内部"],e:"知人紹介による採用はリファラル(referral)採用、退職者の再雇用はアルムナイ(alumni)採用。"},
{q:"一度退職した元従業員を再び採用することを（　）採用という（alumni）。",a:"アルムナイ",d:["リファラル","縁故","出戻り"],e:"alumni＝卒業生・同窓生。退職者ネットワークからの再雇用。"},
{q:"学生が在学中に企業で就業体験をする制度を企業（　）制度という。目的は企業と学生のマッチングとリアリティショックの回避。",a:"インターンシップ",d:["トライアル","OJT","メンタリング"],e:"リアリティショック＝入社前の期待と入社後の現実のギャップによる衝撃。"}

{k:"3",title:"第3回 日本企業の評価制度",qs:[
{q:"組織に属している従業員の貢献を秩序的・体系的に決定する手続きを（　）という。日常業務を通じて上司が部下を評価する仕組み。",a:"人事考課",d:["査定","人事評価","業績評価"],e:"人事考課＝評価する手続きそのもの。"},
{q:"考課期間の仕事について、目標の達成度を対象として評価するものを（　）考課という（業績評価）。",a:"成績",d:["情意","能力","業績"],e:"成績考課＝Performance Appraisal。何を達成したか。"},
{q:"勤務態度や意欲、企業が重視する価値観の体現度を評価するものを（　）考課という。",a:"情意",d:["成績","能力","態度"],e:"情意＝意欲・態度の面。成果に結びつくよう能力発揮したかを見る。"},
{q:"知識・技能、判断力、企画力、折衝力、指導力などを評価するものを（　）考課という（能力評定）。",a:"能力",d:["成績","情意","適性"],e:"成績・情意・能力の3考課をセットで押さえる。"},

    const reveal=st||SHOWN[k];
    const blank=reveal?'<em class="filled">'+esc(q.a)+'</em>':'<em></em>';
    h+='<div class="q'+(st?(st.ok?' ok':' ng'):'')+'"><div class="qh"><span class="qn">Q'+(qi+1)+'</span><span class="qt">'+esc(q.q).replace('（　）',blank)+'</span></div>';
    if(mode==='sel'){
      h+='<div class="opts">';
      order(cur,qi).forEach((it,i)=>{
        let cls='o';
        if(st){if(it.ok)cls+=' c';else if(st.sel===i)cls+=' x';}
        const mk=st?(it.ok?'✓':(st.sel===i?'✕':(i+1))):(i+1);
        h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'"><i>'+mk+'</i><span>'+esc(it.t)+'</span></div>';
      });
      h+='</div>';
      if(!st)h+='<div class="act"><button data-check="'+qi+'">答え合わせ</button><span class="hint" data-cnt="'+qi+'"></span></div>';
    }else{
      if(!st&&!SHOWN[k])h+='<div class="act"><button data-show="'+qi+'">答えを見る</button><span class="hint">まず頭の中で答えてから押す</span></div>';
      else if(!st){
        h+='<div class="ans">答え：<b>'+esc(q.a)+'</b></div>';
        h+='<div class="act"><span class="hint">言えた？</span><button class="mk" data-mark="'+qi+'" data-v="1">○ 言えた</button><button class="mx" data-mark="'+qi+'" data-v="0">✕ 言えなかった</button></div>';
      }
    }
    if(st)h+='<div class="exp"><b class="'+(st.ok?'ok':'ng')+'">'+(st.ok?'正解':'不正解')+'</b>　'+esc(q.e)+'</div>';
    h+='</div>';
  });
  if(!shown)h+='<div class="msg">この回に間違えた問題はありません。</div>';
  m.innerHTML=h;bind();stats();
}
function bind(){
  document.querySelectorAll('.o').forEach(el=>{
    const qi=+el.dataset.q,i=+el.dataset.i,k=K(cur,qi);
    if(S[k])return;
    el.onclick=()=>{
      PICK[k]=i;
      el.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='';
    };
  });
  document.querySelectorAll('[data-check]').forEach(b=>{
    const qi=+b.dataset.check,k=K(cur,qi);
    b.onclick=()=>{
      if(PICK[k]===undefined){const c=document.querySelector('[data-cnt="'+qi+'"]');if(c)c.textContent='選択肢を選んでください';return;}
      S[k]={sel:PICK[k],ok:!!order(cur,qi)[PICK[k]].ok};save();render();
    };
  });
  document.querySelectorAll('[data-show]').forEach(b=>{
    const qi=+b.dataset.show;b.onclick=()=>{SHOWN[K(cur,qi)]=1;render();};
  });
  document.querySelectorAll('[data-mark]').forEach(b=>{
    const qi=+b.dataset.mark,v=+b.dataset.v;
    b.onclick=()=>{S[K(cur,qi)]={sel:-1,ok:!!v};save();render();};
  });
}
function stats(){
  const l=LEC[cur];let d=0,o=0;
  l.qs.forEach((q,qi)=>{const st=S[K(cur,qi)];if(st){d++;if(st.ok)o++;}});
  document.getElementById('s1').textContent=d+' / '+l.qs.length;
  document.getElementById('s2').textContent=o;
  document.getElementById('s3').textContent=d-o;
  document.getElementById('s4').textContent=d?Math.round(o/d*100)+'%':'—';
  let ad=0,ao=0;
  LEC.forEach((L,li)=>L.qs.forEach((q,qi)=>{const st=S[K(li,qi)];if(st){ad++;if(st.ok)ao++;}}));
  document.getElementById('pbar').style.width=Math.round(ad/TOTAL*100)+'%';
  document.getElementById('plab').textContent='全体の進捗 '+ad+' / '+TOTAL+' 問';
  document.getElementById('prate').textContent=ad?('正答率 '+Math.round(ao/ad*100)+'%'):'';
}
function save(){try{localStorage.setItem('hmq2',JSON.stringify(S));}catch(e){}}
function load(){try{const v=localStorage.getItem('hmq2');if(v)Object.assign(S,JSON.parse(v));}catch(e){}}
document.getElementById('m1').onclick=function(){
  mode='sel';this.classList.add('on');document.getElementById('m2').classList.remove('on');
  document.getElementById('mh').textContent='選択モード：4つの候補から選びます。まず用語に慣れる最初の1周向け。';
  wrongOnly=false;rb();render();
};
document.getElementById('m2').onclick=function(){
  mode='rec';this.classList.add('on');document.getElementById('m1').classList.remove('on');
  document.getElementById('mh').textContent='穴埋めモード：空欄を見て頭の中で答え、「答えを見る」で確認して自己採点。本番はこの形式です。成績は選択モードとは別に記録されます。';
  wrongOnly=false;rb();render();
};
document.getElementById('bw').onclick=function(){wrongOnly=true;this.style.display='none';document.getElementById('ba').style.display='';render();};
document.getElementById('ba').onclick=function(){wrongOnly=false;this.style.display='none';document.getElementById('bw').style.display='';render();};
document.getElementById('br').onclick=function(){
  LEC[cur].qs.forEach((q,qi)=>{const k=K(cur,qi);delete S[k];delete PICK[k];delete SHOWN[k];delete ORD[cur+'_'+qi];});
  wrongOnly=false;rb();save();render();
};
document.getElementById('brall').onclick=function(){
  if(!confirm('全ての回の解答記録を消します。よろしいですか？'))return;
  Object.keys(S).forEach(k=>delete S[k]);
  Object.keys(SHOWN).forEach(k=>delete SHOWN[k]);
  Object.keys(PICK).forEach(k=>delete PICK[k]);
  Object.keys(ORD).forEach(k=>delete ORD[k]);
  wrongOnly=false;rb();save();render();
};
load();render();

</script></body></html>
